server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # nginx sits behind Traefik/Coolify and does not reliably know the public
    # scheme/host; emit relative Location headers for the redirect below.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Next.js App Router's static export ships, for every nested route, a
    # same-named <route>/ directory holding only RSC prefetch payloads (no
    # index.html) alongside the real <route>.html page. Normalize away a
    # trailing slash first (Next.js's own canonical URLs never have one) so
    # try_files below always sees the no-slash form and resolves the actual
    # page instead of that empty sibling directory.
    if ($uri ~ ^(.+)/$) {
        return 301 $1$is_args$args;
    }

    # Unknown URLs used to fall through to nginx's stock 404 body, which
    # announces the server version. This serves the branded app/not-found.tsx
    # export instead. `internal` keeps /404.html itself unreachable as a URL, so
    # the page cannot be requested (and indexed) directly on a 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The one city URL this site ever published, retired in favour of /schedule.
    # 308 rather than 301: a strict permanent redirect that preserves the
    # method. For a GET landing page the practical difference is nil; what
    # matters is that it is permanent, so the equity and any index entry move.
    #
    # The target is /schedule with NO fragment. It used to be
    # /schedule#saint-petersburg, back when the catalogue was grouped into
    # per-city sections and that id existed to land on. The catalogue is now one
    # global chronological list with no city sections, so the fragment would
    # point at nothing — and, more to the point, the city is no longer a
    # destination in the navigation graph at all. That graph is exactly
    # / -> /schedule -> /events/<slug>.
    #
    # EXACT match, deliberately not a `/cities/` prefix or regex. A wildcard
    # would turn every made-up city URL into a permanent redirect to a valid
    # page, manufacturing a soft-404 surface out of nothing. /cities/anything
    # else must keep reaching the branded 404 below, and it does, because this
    # location matches one literal path.
    #
    # The trailing-slash form is covered by the normalization above: /cities/
    # saint-petersburg/ 301s to the no-slash form and then 308s here. Two hops
    # for a non-canonical spelling of a retired URL is not worth special-casing.
    location = /cities/saint-petersburg {
        return 308 "/schedule";
    }

    # An exact-match location outranks every regex location, so this is what
    # keeps /robots.txt out of the `\.(txt|md)$` block below - a robots.txt
    # answered with `X-Robots-Tag: noindex` is self-defeating. Empty on purpose:
    # it inherits root/try_files and only exists to win the match.
    location = /robots.txt { }

    # Two response families that are not pages and must never be indexed:
    #
    #   .txt  the App Router's RSC payloads. out/_next/static/chunks/846-*.js
    #         builds these requests as `pathname += ".txt"`, so they ARE
    #         client-side navigation - they must keep answering 200 and must
    #         never be removed or 404ed. Crawl suppression only.
    #   .md   the raw legal sources under /legal/. commerce/legal/
    #         production-manifest.json records https://flexperiment.ru/legal/*.md
    #         as the canonical document URLs and commerce/src/legal-release.ts
    #         fetches them over HTTPS to verify their sha256, so these must also
    #         stay reachable. Only the rendered /legal/<slug> pages are the
    #         indexable representation.
    #
    # The three security headers are re-declared rather than inherited: nginx's
    # add_header is not additive across levels - a location that declares any
    # add_header REPLACES the whole server-level set for responses it handles.
    location ~* \.(txt|md)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Everything Next emits under /_next/static/ is content-hashed, so a change
    # to a file is a change to its URL and the response can be cached for a year
    # and never revalidated.
    #
    # Deliberately scoped to this prefix and no wider. The unhashed assets
    # referenced by raw path - /background.webp, /noize.webp, /separator.webp,
    # /head.svg, /head-still.svg, /favicon.ico - would be pinned to a stale
    # version by `immutable`, and /release.json is the deploy descriptor, where
    # an immutable cache would actively mislead about what is deployed.
    #
    # try_files without the .html fallback: a missing asset here is a build or
    # deploy fault and must read as 404, not as a page.
    location /_next/static/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
