# A concrete Traefik peer, resolved at nginx startup; never trust the Docker subnet.
# A missing DNS/network attachment refuses startup. Re-read/reload if Traefik is recreated.
set_real_ip_from coolify-proxy;
real_ip_header X-Forwarded-For;
# Traefik supplies/appends the transport client's address last. Do not walk a forged left prefix.
real_ip_recursive off;
