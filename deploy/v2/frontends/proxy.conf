proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
# These artifacts are admitted only behind the approved HTTPS Coolify hosts.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_cache off;
proxy_buffering off;
proxy_redirect off;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
add_header Cache-Control no-store always;
# Set-Cookie, Location, status, query string and body are forwarded unchanged.
# In particular there is no proxy_cookie_domain or permissive CORS fallback.
