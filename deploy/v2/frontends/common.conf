# Magic-link query tokens and request bodies must never reach nginx logs,
# including errors and rejected/oversized request lines.
access_log off;
error_log /dev/null crit;
server_tokens off;
absolute_redirect off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header X-Robots-Tag "noindex, nofollow" always;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
client_max_body_size 1m;

location = /identity {
    alias /app/.identity/identity.json;
    default_type application/json;
    add_header Cache-Control no-store always;
}
location = /healthz { return 200 'frontend alive'; }
location = /readyz {
    # Upstream readiness is real and read-only, not a frontend auth E2E claim.
    include /etc/nginx/v2/proxy.conf;
    proxy_pass http://$commerce_upstream;
}
location = /partner { return 404; }
location ^~ /partner/ { return 404; }
location /v1/ { return 404; }
location /internal/ { return 404; }
location / { try_files $uri $uri.html $uri/index.html =404; }
