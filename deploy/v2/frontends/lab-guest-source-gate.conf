# Apply only to anonymous session creation and recovery email requests.
# realip_remote_addr is nonempty even without a successful Real IP rewrite.
default_type application/json;
if ($lab_guest_trusted_peer = 0) {
    return 503 '{"code":"LAB_SOURCE_UNAVAILABLE"}';
}
if ($remote_addr = $realip_remote_addr) {
    return 503 '{"code":"LAB_SOURCE_UNAVAILABLE"}';
}
if ($lab_guest_client_is_proxy = 1) {
    return 503 '{"code":"LAB_SOURCE_UNAVAILABLE"}';
}
