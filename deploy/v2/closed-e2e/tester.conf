# Private SSH-only TLS entry. Certificates/keys never belong to this checkout.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/canary-tls/fullchain.pem;
    ssl_certificate_key /etc/canary-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    location / { return 403; }
}
server {
    listen 443 ssl;
    server_name canary-api.flexperiment.ru canary-platform.flexperiment.ru canary-admin.flexperiment.ru;
    ssl_certificate /etc/canary-tls/fullchain.pem;
    ssl_certificate_key /etc/canary-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    client_max_body_size 1m;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Cache-Control no-store always;
    location ~ ^/__closed_legal/(privacy|personal_data|account_terms|marketing_consent)\.md$ {
        if ($host != canary-platform.flexperiment.ru) { return 404; }
        limit_except GET { deny all; }
        default_type text/plain;
        charset utf-8;
        alias /etc/canary-legal/$1.md;
    }
    location / {
        set $target flexperiment-fast-cut-canary-commerce:3002;
        if ($host = canary-platform.flexperiment.ru) { set $target flexperiment-fast-cut-canary-platform:3001; }
        if ($host = canary-admin.flexperiment.ru) { set $target flexperiment-fast-cut-canary-admin:80; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_redirect off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://$target;
    }
}
