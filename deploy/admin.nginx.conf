server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker service IPs are ephemeral across Commerce rolling redeploys.
    # Resolve the service name at proxy time through Docker DNS instead of
    # retaining the address nginx saw when this container started.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    set $commerce_upstream commerce:3001;

    location /v1/admin/ {
        proxy_pass http://$commerce_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
