gaps:
  allowlist_erasure:
    issue: "FLEX-131"
    evidence: "Проверить необходимость, срок и способ убрать email из списка допущенных предложений. На проверенной ревизии операции полного и reviewed erasure эту колонку не проверяют и не очищают."
  audit:
    issue: "FLEX-131"
    evidence: "Проверить закрытые аудит- и нормативные доказательства, смешанные JSON, связку субъекта, допустимое хранение и частичное исполнение; runtime может отказывать на упоминании."
  closure:
    issue: "FLEX-131"
    evidence: "Reviewed v1 допускает только CLOSE и блокирует любое действующее право, открытый возврат или незавершённый расчёт. Уточнить реальную необходимость аккаунта, выход из бессрочного договора и отдельный приём требований."
  consent_removal:
    issue: "FLEX-131"
    evidence: "Оба пути erasure при допуске удаляют записи выбора и связанные события. Отдельно определить, нужна ли и где хранится минимальная запись договорного доказательства или доказательства согласия."
  export_delivery:
    issue: "FLEX-133"
    evidence: "Проверить полноту отчёта по ст. 14, подтверждение личности, изоляцию, объём и влияние на Commerce; выбрать синхронную или фоновую выдачу."
  financial:
    issue: "FLEX-131"
    evidence: "Подтвердить налоговый режим ИП, юридическое основание и срок каждого документа, минимизацию и сквозное исполнение по исходной ветке."
  identity_return:
    issue: "FLEX-131"
    evidence: "D-S5: текущее ограничение входа/регистрации, связь с восстановлением, самостоятельное основание и срок HMAC/отметок, исключения и безопасное обслуживание действующих прав."
  lab_attendance:
    issue: "FLEX-131"
    evidence: "Подтвердить хранение защищённого списка присутствия и владельца носителя. Сверить разделение участника, покупателя и оператора и выдавать только сведения проверенного субъекта."
  lab_restore:
    issue: "FLEX-8"
