gaps:
  audit:
    issue: "FLEX-131"
    evidence: "Проверить закрытые аудит- и нормативные доказательства, смешанные JSON, связку субъекта, допустимое хранение и частичное исполнение; runtime может отказывать на упоминании."
  closure:
    issue: "FLEX-131"
    evidence: "Reviewed v1 допускает только CLOSE и блокирует любое действующее право, открытый возврат или незавершённый расчёт. Уточнить реальную необходимость аккаунта, выход из бессрочного договора и отдельный приём требований."
  export_delivery:
    issue: "FLEX-133"
    evidence: "Проверить полноту отчёта по ст. 14, подтверждение личности, изоляцию, объём и влияние на Commerce; выбрать синхронную или фоновую выдачу."
  financial:
    issue: "FLEX-131"
    evidence: "Подтвердить налоговый режим ИП, юридическое основание и срок каждого документа, минимизацию и сквозное исполнение по исходной ветке."
  identity_return:
    issue: "FLEX-131"
    evidence: "D-S5: текущее ограничение входа/регистрации, связь с восстановлением, самостоятельное основание и срок HMAC/отметок, исключения и безопасное обслуживание действующих прав."
  lab_restore:
    issue: "FLEX-8"
    evidence: "Проверить поздние отписки, запрет отправки после restore, сроки политики, цель и подтверждения обработки."
  methods:
    issue: "FLEX-16"
    evidence: "Квалифицировать действующий метод по ст. 19, SQLite/WAL, временным данным, копиям и обработчикам; A-7.5 отдельно."
  processors:
    issue: "FLEX-133"
    evidence: "Дополнить инвентарь по фактической среде, ролям, договорам, переданным полям, доступу и подтверждениям у конкретных получателей."
  retention:
    issue: "FLEX-131"
    evidence: "Подтвердить сроки D-S4/D-L5/D-05 и доступный способ исполнения в рабочей среде для каждой обрабатываемой категории."
  rights_evidence:
    issue: "FLEX-131"
    evidence: "Штатная операция не формирует полный комплект по № 179; ответ и доказательства хранятся в закрытом деле. Пауза после подтверждённого ledger остаётся открытой."
