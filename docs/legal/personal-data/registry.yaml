    purposes: ["identity", "auth_security", "analytics", "auth_credentials"]
    access: "description"
    closure: "review"
    lifecycle: "Разделить настройки и полномочия, отозвать старые полномочия на сервере; проверить локальную очистку каждого вида данных на всех применимых маршрутах"
