# FLEX-133. Описывает схему в исходниках и проектные правила. Статусы исполнения проверяются отдельно.
version: 1

purposes:
  analytics:
    use: "Согласованная аналитика и ограниченная эксплуатационная телеметрия"
    basis: "152-ФЗ ст. 6 и 9; применимая политика, настройки и основания подлежат проверке"
    retention: "До прекращения согласованной цели или срока на конкретном носителе"
    expiry: "Прекратить передачу, удалить либо квалифицировать остаток"
    review: "processors"
    sources: ["pd_law", "stage_a_inventory"]
  auth_credentials:
    use: "Вход, проверка и восстановление полномочий MY, LMS и LAB"
    basis: "152-ФЗ ст. 6 и 19, применимые условия входа"
    retention: "До отзыва или истечения полномочия; технический grace отдельно"
    expiry: "Отозвать полномочие, затем очистить остаток"
    sources: ["pd_law", "account_terms", "retention_code"]
    review: "retention"
  auth_security:
    use: "Ограничение попыток входа, антиабуз и безопасность сессий"
    basis: "152-ФЗ ст. 19; необходимость и самостоятельное основание по ст. 6 уточняются по данным"
    retention: "До окончания защитной цели или подтверждённого срока для конкретного события"
    expiry: "Очистить след и счётчики по установленному сроку"
    sources: ["pd_law", "retention_code"]
    review: "retention"
  backup:
    use: "Резервирование и восстановление утверждённых систем"
    basis: "152-ФЗ ст. 19; блокирование при невозможности уничтожения в срок по применимой ст. 21"
    retention: "По утверждённому правилу копий. Исключение ч. 6 ст. 21 применяется по обстоятельствам дела"
    expiry: "Доказать блок и удаление каждой охваченной копии, проверить replay перед допуском"
    review: "methods"
    sources: ["pd_law", "retention_code", "retention_test"]
  checkout:
    use: "Подготовка оферты и checkout, сверка принятой сделки"
    basis: "152-ФЗ п. 5 ч. 1 ст. 6 при заключении или исполнении договора"
    retention: "До истечения предложения, заключения договора и необходимых сверок"
    expiry: "Отдельно квалифицировать доказательство сделки; очистить неоформленные и избыточные данные"
    review: "retention"
    sources: ["pd_law", "paid_terms", "checkout_code"]
  closed_checkout_admission:
    use: "Сопоставление email с допуском к конкретному закрытому предложению"
    basis: "Основание для закрытого профиля и срок хранения каждой записи требуют отдельной квалификации"
    retention: "До окончания необходимости индивидуального допуска; фактическое действие при удалении открыто"
    expiry: "Отозвать допуск либо удалить сопоставимый адрес после проверки основания и охвата"
    sources: ["checkout_code", "paid_terms", "pd_law"]
    review: "allowlist_erasure"
  consent_proof:
    use: "Факты предоставления, изменения или отзыва согласия"
    basis: "152-ФЗ ст. 9; возможное доказательное хранение оценивается отдельно"
    retention: "Пока нужна соответствующая цель или отдельно обоснованное доказательство"
    expiry: "Удалить целевые записи после прекращения оснований; пересмотреть отдельно нужные доказательства"
    sources: ["pd_law", "erase_reviewed", "erase_full"]
    review: "consent_removal"
  contract_acceptance:
    use: "Подтверждение акцепта правил аккаунта, оферты и условий доступа"
    basis: "152-ФЗ ст. 6; конкретная версия правил аккаунта или договора"
    retention: "До окончания договора или самостоятельной доказательной цели"
    expiry: "Пересмотреть применимые договорные доказательства и уничтожить избыточные дубли"
    sources: ["pd_law", "account_terms", "paid_terms"]
    review: "consent_removal"
  delivery:
    use: "Техническая доставка письма или уведомления по собственной цели"
    basis: "Основание исходного уведомления, применимое поручение по ст. 6 152-ФЗ"
    retention: "До результата доставки и срока подтверждённой политики outbox"
    expiry: "Очистить рабочие копии и запросить доказательство по обработчику"
    review: "processors"
    sources: ["pd_law", "stage_a_inventory", "paid_inventory"]
  evidence:
    use: "Доказательство договорных, юридических или контрольных действий"
    basis: "Конкретная применимая норма, договор или квалифицированное требование; исходный JSON не получает общего срока"
    retention: "До прекращения установленной цели или законного удержания с датой пересмотра"
    expiry: "Проверить минимальный остаток и его влияние на целостность доказательства"
    review: "audit"
    sources: ["pd_law", "qerase"]
  export:
    use: "Самостоятельная и операторская выдача сведений субъекту"
    basis: "152-ФЗ ст. 14 и 20; безопасный механизм выдачи проектируется"
    retention: "Время подготовки, выдачи и отдельно квалифицированный короткий срок временного результата при его наличии"
    expiry: "Удалить результат и минимизировать след выдачи; отдельно учесть дело субъекта"
    review: "export_delivery"
    sources: ["pd_law", "flex133"]
  fiscal:
    use: "Фискализация и сохранность подтверждений расчёта"
    basis: "54-ФЗ ст. 1.2, 4.7, 5 и НК РФ ст. 23 в применимом объёме"
    retention: "По виду документа и роли. Для фискального накопителя 5 лет с окончания использования"
    expiry: "Удалить дубли и рабочий контакт при наступлении их триггера; сохранить обязательный подлинник на его срок"
    review: "financial"
    sources: ["kkt_law", "tax_law", "paid_inventory"]
  free_enrollment:
    use: "Учёт FREE-записи и первого начала курса"
    basis: "152-ФЗ ст. 6; применимые условия LMS и отдельно квалифицированная цель учёта"
    retention: "До окончания необходимости FREE-записи и её факта начала"
    expiry: "Уничтожить данные без самостоятельного основания по применимому триггеру"
    sources: ["pd_law", "account_terms", "erase_reviewed"]
    review: "methods"
  identity:
    use: "Аккаунт и проверяемая привязка входа MY/LMS/LAB"
    basis: "152-ФЗ ст. 6, условия аккаунта и применимое отдельное согласие"
    retention: "Пока нужна действующая цель аккаунта или подтверждённое обязательство"
    expiry: "Пересмотреть привязку, отозвать доступ и уничтожить необязательный остаток"
    review: "closure"
    sources: ["pd_law", "account_terms", "qerase"]
  lab_interest:
    use: "Подтверждённая предзапись и уведомление о начале продаж LAB"
    basis: "Конкретная цель и согласие по FLEX-8; 152-ФЗ ст. 6 и 9"
    retention: "По событию достижения цели, отзыву или подтверждённой политике FLEX-8"
    expiry: "Остановить уведомления и очистить заявку и связанные сведения по применимому триггеру"
    review: "lab_restore"
    sources: ["lab_interest_owner", "pd_law"]
  lab_service:
    use: "Бронирование, билет, посещение и оказание LAB"
    basis: "152-ФЗ п. 5 ч. 1 ст. 6 при применимом договоре"
    retention: "До исполнения, отмены или окончания отдельной доказательной цели"
    expiry: "Отозвать полномочия билета и пересмотреть доказательный остаток"
    review: "closure"
    sources: ["pd_law", "paid_terms", "lab_attestation"]
  learning_progress:
    use: "Продолжение урока, позиция и факт завершения"
    basis: "152-ФЗ ст. 6; применимые условия LMS"
    retention: "До прекращения цели поддержки прогресса либо законно установленного исключения"
    expiry: "Уничтожить позиции и факты прогресса по применимому триггеру"
    sources: ["pd_law", "account_terms", "erase_reviewed"]
    review: "methods"
  marketing:
    use: "Добровольная рекламная рассылка"
    basis: "152-ФЗ ст. 15 и 38-ФЗ ст. 18"
    retention: "До отказа, прекращения согласия либо достижения цели"
    expiry: "Немедленно прекратить продвижение после требования и пересмотреть данные"
    review: "retention"
    sources: ["pd_law", "ad_law", "stage_a_inventory"]
  ops_security:
    use: "Операторский доступ и безопасность административных действий"
    basis: "152-ФЗ ст. 19; необходимость и правовое основание по ст. 6 документируются по категории"
    retention: "До истечения полномочий или утверждённого срока события безопасности"
    expiry: "Отозвать доступ, минимизировать, уничтожить после окончания цели"
    review: "audit"
    sources: ["pd_law", "stage_a_inventory"]
  paid_access:
    use: "Исполнение оплаченного доступа и относящиеся к нему факты оказания"
    basis: "152-ФЗ п. 5 ч. 1 ст. 6 при действующем договорном обязательстве"
    retention: "До прекращения конкретного права или окончания отдельной доказательной цели"
    expiry: "Закрыть право по договорному основанию и пересмотреть остаток"
    review: "closure"
    sources: ["pd_law", "paid_terms", "qerase"]
  payments:
    use: "Исполнение и сверка конкретной оплаты"
    basis: "152-ФЗ п. 5 ч. 1 ст. 6, когда данные необходимы для заключения или исполнения договора"
    retention: "До сверенного исхода операции и закрытия необходимых расчётных действий"
    expiry: "Очистить рабочие payload и контакты по подтверждённому триггеру"
    sources: ["pd_law", "checkout_code"]
    review: "financial"
  playback_telemetry:
    use: "Диагностика выдачи доступа к видео и относящиеся к просмотру технические события"
    basis: "152-ФЗ ст. 6 и 19; подтвердить необходимый набор и срок в квалификации"
    retention: "По наступлению согласованной технической границы или прекращению цели; отдельно PLAYBACK_TELEMETRY"
    expiry: "Проверить штатную очистку и остаток за пределами SQLite"
    sources: ["pd_law", "retention_code", "stage_a_inventory"]
    review: "retention"
  publishing:
    use: "Публикация каталога, редакций и контента"
    basis: "Договоры и подтверждённые основания для авторства и публикации; персональное содержимое требует отдельной проверки"
    retention: "Пока нужна публикация или связанное доказательство"
    expiry: "Снять или исправить публикацию и пересмотреть связанные копии"
    review: "audit"
    sources: ["pd_law", "stage_a_inventory"]
  recovery:
    use: "Защита от возврата уничтоженных данных при восстановлении"
    basis: "152-ФЗ ст. 19 и 21; необходимость удержания сверяется по ст. 5 и 6"
    retention: "Пока существует доказанная необходимость replay и проверки восстановимой копии"
    expiry: "Сохранить неповторяемость удаления и проверить возможность безопасной очистки истории"
    sources: ["pd_law", "erase_full"]
    review: "methods"
  refunds:
    use: "Принятие требования, рассмотрение, возврат и подтверждённый результат"
    basis: "152-ФЗ пп. 2 и 5 ч. 1 ст. 6 при применимости; закон и оферта по конкретному расчёту"
    retention: "До завершения требования и отдельно установленной учётной или доказательной цели"
    expiry: "Удалить рабочий конверт при допустимом подтверждённом исходе; пересмотреть текст и остаток"
    review: "financial"
    sources: ["pd_law", "paid_terms", "refund_code"]
  registration_restriction:
    use: "Текущая техническая блокировка прежней привязки входа и повторной регистрации после erasure"
    basis: "Самостоятельное основание, необходимость и соразмерность ещё не определены в D-S5"
    retention: "Срок и порядок пересмотра не утверждены; срок финансовых документов или копий не переносится автоматически"
    expiry: "Пересмотреть сопоставимые идентификаторы, исключения и допустимый маршрут; постоянный запрет не утверждён"
    sources: ["flex133", "pd_law", "erase_fence"]
    review: "identity_return"
  rights:
    use: "Приём и исполнение обращений субъекта"
    basis: "152-ФЗ ст. 14, 20 и 21; приказ Роскомнадзора № 179 для подтверждения уничтожения"
    retention: "Срок обращения из матрицы FLEX-131; акт и выгрузка по № 179 хранятся 3 года с уничтожения"
    expiry: "Закрыть дело после доказанного исполнения; пересмотреть и уничтожить остаток по своему сроку"
    review: "rights_evidence"
    sources: ["pd_law", "order179", "qerase"]
  suppression:
    use: "Предотвращение повторной отправки по отозванному согласию"
    basis: "152-ФЗ п. 2 ч. 1 ст. 6 в объёме применимой обязанности; ст. 15"
    retention: "Пока минимальная отметка необходима; срок и пересмотр квалифицируются отдельно"
    expiry: "Проверить безопасное прекращение хранения отметки и отсутствие возобновления отправки"
    review: "identity_return"
    sources: ["pd_law", "ad_law", "erase_fence"]
  tax_records:
    use: "Хранение минимальных документов для налогового учёта"
    basis: "152-ФЗ п. 2 ч. 1 ст. 6 при применимости и НК РФ подп. 8 п. 1 ст. 23"
    retention: "Пять лет для необходимых налоговых документов при применимости; дата отсчёта и исключения по виду документа"
    expiry: "По окончании проверенного срока и других действующих оснований уничтожить нужный охват"
    sources: ["pd_law", "tax_law", "paid_inventory"]
    review: "financial"

sqlite:
  access_overrides:
    - columns: ["operation_id", "course_ref", "scope_level", "scope_ref", "expected_kind", "expected_value", "effect", "committed_version", "state", "attention_reason", "orphaned_at", "created_at", "deadline_at", "platform_epoch", "resolved_at", "resolving_manifest_version", "resolving_manifest_hash", "resolution_evidence_json"]
      classification: "mixed"
      subject: "scope_ref и содержимое доказательства требуют отдельной проверки"
      purposes: ["evidence", "publishing"]
      access: "review"
      closure: "review"
      review: "audit"
  account:
    - columns: ["id", "account_id", "provider_id", "user_id", "access_token_expires_at", "refresh_token_expires_at", "scope", "created_at", "updated_at"]
      classification: "personal"
      subject: "user_id → user"
      purposes: ["identity", "auth_credentials"]
      access: "projection"
      closure: "destroy_when_due"
      review: "retention"
    - columns: ["access_token", "refresh_token", "id_token", "password"]
      classification: "secret"
      subject: "user_id → user"
      purposes: ["auth_credentials"]
      access: "description"
      closure: "destroy_when_due"
      review: "retention"
  account_consents:
    - columns: ["id", "customer_id", "kind", "document_version", "recorded_at", "source", "document_sha256", "evidence_status", "confirmed_auth_user_id", "confirmed_at"]
      classification: "personal"
      subject: "customer_id и confirmed_auth_user_id"
      purposes: ["consent_proof", "contract_acceptance"]
      access: "projection"
      closure: "review"
      retentionPolicies: ["UNBOUND_INTENTS"]
      observed:
        status: "conditional"
        behavior: "При допущенном полном и reviewed erasure строки удаляются. Необходимый остаток договорного доказательства проверяется по другим категориям."
        sources: ["erase_reviewed", "erase_full"]
      review: "consent_removal"
  audit_log:
    - columns: ["id", "actor", "action", "subject_type", "subject_ref", "evidence_json", "created_at"]
      classification: "mixed"
      subject: "subject_ref, actor и потенциальные упоминания в evidence_json"
      purposes: ["evidence", "ops_security"]
      access: "review"
      closure: "review"
      review: "audit"
  auth_email_outbox:
    - columns: ["id", "recipient_normalized", "kind", "state", "attempt_count", "last_error", "created_at", "updated_at"]
      classification: "personal"
      subject: "recipient_normalized и связанное дело доставки"
      purposes: ["auth_credentials", "delivery"]
      access: "description"
      closure: "destroy_when_due"
      payloadColumns: ["last_error"]
      retentionPolicies: ["AUTH_OUTBOX"]
      review: "processors"
    - columns: ["encrypted_payload", "payload_sha256"]
      classification: "secret"
      subject: "recipient_normalized и связанное дело доставки"
      purposes: ["auth_credentials", "delivery"]
      access: "description"
      closure: "destroy_when_due"
      payloadColumns: ["encrypted_payload"]
      retentionPolicies: ["AUTH_OUTBOX"]
      review: "processors"
  authenticated_consent_actions:
    - columns: ["id", "customer_id", "auth_user_id", "storefront", "legal_release_id", "release_version", "manifest_sha256", "action_key", "request_sha256", "recorded_at"]
      classification: "personal"
      subject: "customer_id и auth_user_id"
      purposes: ["consent_proof", "contract_acceptance"]
      access: "projection"
      closure: "review"
      observed:
        status: "conditional"
        behavior: "При допущенном полном и reviewed erasure строки удаляются. Необходимый остаток договорного доказательства проверяется по другим категориям."
        sources: ["erase_reviewed", "erase_full"]
      review: "consent_removal"
  authenticated_consent_events:
    - columns: ["sequence", "action_id", "kind", "granted", "document_version", "document_sha256"]
      classification: "personal"
      subject: "action_id → authenticated_consent_actions"
      purposes: ["consent_proof", "contract_acceptance"]
      access: "projection"
      closure: "review"
      observed:
        status: "conditional"
        behavior: "При допущенном erasure строки удаляются каскадом через authenticated_consent_actions. Договорные доказательства из покупок учитываются отдельно."
        sources: ["erase_reviewed", "erase_full", "consent_fk"]
      review: "consent_removal"
  browser_context_arrivals:
    - columns: ["id", "browser_context_id", "state", "failure_code", "captured_at", "claim_deadline_at", "attempts", "last_attempt_at", "claim_id", "eligible_until", "settled_at"]
      classification: "mixed"
      subject: "browser_context_id → browser_contexts; внешняя привязка в доказательстве"
      purposes: ["checkout", "auth_security"]
      access: "review"
      closure: "review"
      review: "processors"
    - columns: ["arrival_proof", "proof_sha256"]
      classification: "secret"
      subject: "browser_context_id → browser_contexts; внешняя привязка в доказательстве"
      purposes: ["checkout", "auth_security"]
      access: "description"
      closure: "destroy_when_due"
      payloadColumns: ["arrival_proof"]
      review: "processors"
  browser_contexts:
    - columns: ["id", "storefront", "storefront_origin", "status", "bound_customer_id", "successor_id", "created_at", "expires_at", "retired_at", "retire_reason", "close_state", "close_attempts", "close_settled_at"]
      classification: "personal"
      subject: "bound_customer_id или подтверждённый контекст браузера"
      purposes: ["checkout", "auth_security"]
      access: "projection"
      closure: "destroy_when_due"
      review: "retention"
  catalog_course_projection:
    - columns: ["course_ref", "version", "content_hash", "visibility", "last_reconciled_at", "applied_at", "state_hash", "authoring_source", "title", "slug", "summary", "description_json", "seo_json", "editorial_requested_visibility", "editorial_restriction"]
      classification: "mixed"
      subject: "проверить пользовательские сведения в опубликованном содержимом; course_ref не ключ человека"
      purposes: ["publishing"]
      access: "review"
      closure: "review"
      review: "audit"
  catalog_lesson_projection:
    - columns: ["lesson_ref", "course_ref", "section_ref", "ever_published", "visibility", "free_preview", "withdrawn_at", "withdrawn_reason", "position", "title", "slug", "description_json", "seo_json"]
      classification: "mixed"
