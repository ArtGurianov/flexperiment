    access: "description"
    closure: "review"
    lifecycle: "Точный состав и полномочия по custody; отдельно квалифицировать уничтожение"
    sources: ["stage_a_inventory", "qerase"]
    review: "methods"
  export_artifact:
    scope: "planned"
