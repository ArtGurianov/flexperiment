retentionPolicies:
  AUTH_OUTBOX:
    parameter: "authOutboxMaxAgeSeconds"
    scope: "Старые auth_email_outbox и my_otp_outbox; учитываются недавний выпуск и удержание"
    source: "retention_code"
    review: "retention"
  BACKUP_ARCHIVES:
    parameter: "backupArchiveMaxAgeSeconds"
    scope: "Выбор кандидатов из подтверждённого инвентаря; сохраняет текущую копию и удержания; не выполняет уничтожение"
    source: "retention_code"
    review: "retention"
  EXPIRED_CREDENTIALS:
    parameter: "expiredCredentialsGraceSeconds"
    scope: "Просроченные session, verification, lms_sessions, session_exchanges; проверки привязки и удержаний"
    source: "retention_code"
    review: "retention"
  PLAYBACK_TELEMETRY:
    parameter: "playbackTelemetryMaxAgeSeconds"
    scope: "Старые playback_access_events по occurred_at и удержанию; позиции, состояние и счётчики не охватываются этой категорией"
    source: "retention_code"
    review: "retention"
  UNBOUND_INTENTS:
    parameter: "unboundIntentsMaxAgeSeconds"
    scope: "Только старые непривязанные customers и намерения account_consents/marketing_consents по полным проверкам, включая отсутствие заказов и иных связей"
    source: "retention_code"
    review: "retention"

