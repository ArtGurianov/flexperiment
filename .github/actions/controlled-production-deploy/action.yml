name: Controlled production deploy primitive
description: Shared exact deployment primitive. The caller owns the environment gate and supplies sealed inputs through its environment.
runs:
  using: composite
  steps:
      - name: Assert this controller is exact, current main
        # main is trusted deployment-controller code; runtime-candidate is an
        # untrusted/read-only candidate object. A workflow_dispatch can be
        # run from any ref, so this must be proven explicitly - unlike the
        # old push-to-main trigger, dispatch does not itself guarantee it.
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "DEPLOY_CONTROLLER_NOT_MAIN" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo "DEPLOY_CONTROLLER_MAIN_MOVED" >&2; exit 1; }
      - name: Read current production-deploy pointer
        shell: bash
        run: |
          set -euo pipefail
          production_deploy_sha="$(scripts/read-production-deploy-ref.sh)"
          git fetch --no-tags origin "$production_deploy_sha"
          echo "PRODUCTION_DEPLOY_SHA=$production_deploy_sha" >> "$GITHUB_ENV"
      - name: Resolve controller and immutable deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TARGET_SHA" ]]; then
            # Manual recovery of an already-owned, already-paused same-owner
            # deployment, under its own separate authority (see the
            # RECOVERY_MODE==1 precondition below).
            [[ "$INPUT_TARGET_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'GENERIC_DEPLOY_MANUAL_RECOVERY_TARGET_INVALID' >&2; exit 1; }
            target_sha="${INPUT_TARGET_SHA,,}"
            recovery_mode=1
          else
            # Ordinary controlled deploy: the candidate authority is the
            # dedicated runtime-candidate ref. This is never $GITHUB_SHA -
            # that is this controller's own commit, a distinct identity.
            git fetch --no-tags origin runtime-candidate
            target_sha="$(git rev-parse origin/runtime-candidate)"
            [[ "$INPUT_EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ORDINARY_DEPLOY_EXPECTED_CANDIDATE_SHA_REQUIRED" >&2; exit 1; }
            [[ "$INPUT_EXPECTED_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ORDINARY_DEPLOY_EXPECTED_CONTROLLER_SHA_REQUIRED" >&2; exit 1; }
            [[ "$INPUT_EXPECTED_CONTROLLER_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "ORDINARY_DEPLOY_EXPECTED_CONTROLLER_TREE_REQUIRED" >&2; exit 1; }
            [[ "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ORDINARY_DEPLOY_EXPECTED_PRODUCTION_DEPLOY_SHA_REQUIRED" >&2; exit 1; }
            [[ "$INPUT_EXPECTED_CANDIDATE_SHA" == "$target_sha" ]] || { echo "RUNTIME_CANDIDATE_UNEXPECTED_SHA=$target_sha" >&2; exit 1; }
            [[ "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" == "$PRODUCTION_DEPLOY_SHA" ]] || { echo "PRODUCTION_DEPLOY_UNEXPECTED_SHA=$PRODUCTION_DEPLOY_SHA" >&2; exit 1; }
            recovery_mode=0
          fi
          [[ "$target_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'GENERIC_DEPLOY_INVALID_SOURCE_COMMIT' >&2; exit 1; }
          git fetch --no-tags origin "$target_sha"
          git cat-file -e "$target_sha^{commit}" || { echo 'GENERIC_DEPLOY_TARGET_NOT_IN_REPOSITORY' >&2; exit 1; }
          if [[ "$recovery_mode" == 0 ]]; then
            cas_expected_production_deploy_sha="$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA"
          else
            cas_expected_production_deploy_sha="$PRODUCTION_DEPLOY_SHA"
          fi
          candidate_contract_path="$RUNNER_TEMP/generic-deploy-release-surface-contract.json"
          candidate_manifest_path="$RUNNER_TEMP/generic-deploy-production-manifest.json"
          git show "$target_sha:release-surface-contract.json" > "$candidate_contract_path"
          git show "$target_sha:commerce/legal/production-manifest.json" > "$candidate_manifest_path"
          {
            echo "TARGET_SHA=$target_sha"
            echo "RELEASE_ID=deploy-$target_sha"
            echo "RECOVERY_MODE=$recovery_mode"
            echo "CAS_EXPECTED_PRODUCTION_DEPLOY_SHA=$cas_expected_production_deploy_sha"
            echo "CANDIDATE_CONTRACT_PATH=$candidate_contract_path"
            echo "CANDIDATE_MANIFEST_PATH=$candidate_manifest_path"
          } >> "$GITHUB_ENV"
      - name: Assert runtime-candidate topology
        # A recovery (workflow_dispatch) resumes an already-owned, already-
        # paused same-owner deployment under its own separate authority and
        # may target a SHA that predates the current production-deploy tip;
        # it explicitly waives the descendant/maintenance-lineage rule below.
        if: env.RECOVERY_MODE == '0'
        shell: bash
        run: |
          set -euo pipefail
          scripts/inspect-runtime-candidate-topology.sh --production-deploy "$PRODUCTION_DEPLOY_SHA" --candidate "$TARGET_SHA" > topology.json
          jq -e '.candidate_is_descendant_of_production_deploy == true' topology.json >/dev/null || { echo "RUNTIME_CANDIDATE_NOT_DESCENDANT_OF_PRODUCTION_DEPLOY" >&2; exit 1; }
          jq -e '(.maintenance_commits_in_range | length) == 0' topology.json >/dev/null || { jq -c '.maintenance_commits_in_range' topology.json >&2; echo "RUNTIME_CANDIDATE_CONTAINS_MAINTENANCE_COMMIT" >&2; exit 1; }
          jq -e '(.merge_commits_in_range | length) == 0' topology.json >/dev/null || { jq -c '.merge_commits_in_range' topology.json >&2; echo "RUNTIME_CANDIDATE_NOT_LINEAR" >&2; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        shell: bash
      - name: Materialize exact runtime readiness parser
        # Runtime readiness evidence must be interpreted with the exact
        # runtime's semantics, never with main's controller copy. In
        # particular, migration recognition intentionally differs between
        # maintenance/controller history and a deployed runtime lineage.
        # Only the explicitly named readiness evaluator and reconciler may
        # execute from the runtime worktree; dependency lifecycle scripts
        # remain disabled.
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ASSERT_DIR="$RUNNER_TEMP/generic-runtime-readiness"
          git worktree add --detach "$RUNTIME_ASSERT_DIR" "$TARGET_SHA"
          [[ "$(git -C "$RUNTIME_ASSERT_DIR" rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo "RUNTIME_ASSERT_WORKTREE_WRONG_SHA" >&2; exit 1; }
          (cd "$RUNTIME_ASSERT_DIR" && pnpm install --frozen-lockfile --ignore-scripts)
          echo "RUNTIME_ASSERT_DIR=$RUNTIME_ASSERT_DIR" >> "$GITHUB_ENV"
      - name: Preflight immutable generic-deploy boundaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "GENERIC_DEPLOY_INVALID_SOURCE_COMMIT" >&2; exit 1; }
          [[ "$RELEASE_ID" == "deploy-$TARGET_SHA" ]] || { echo "GENERIC_DEPLOY_INVALID_RELEASE_ID" >&2; exit 1; }
          if [[ -n "${INPUT_MATERIALIZED_RELEASE_PACKET:-}" ]]; then
            # A Release Control v2 candidate is deliberately a direct child of
            # the production base, not of main. It therefore cannot satisfy the
            # ordinary target-in-controller ancestry rule below. This is not an
            # env-flag exemption: the sealed packet must validate, reconstruct
            # exactly from the controller's first-parent integration lineage,
            # and bind this target and exact production base before any API call.
            printf '%s' "$INPUT_MATERIALIZED_RELEASE_PACKET" > materialized-release-packet-input.json
            node --import tsx commerce/src/validate-release-control-v2-packet.ts materialized-release-packet-input.json > materialized-release-packet.json
            # Packet validation only proves that the JSON can be rehydrated;
            # it never grants execution authority. The one ancestry exception
            # this primitive owns is therefore restricted to the same inert,
            # exact BENIGN packet shape the v2 workflow admits before calling
            # us. A future caller cannot bypass ordinary controller coverage
            # merely by supplying a well-formed STOP_ESCALATE packet.
            jq -e '
              .mode == "SHADOW_ONLY" and
              .production_authority == "NONE" and
              .mutations == "FORBIDDEN" and
              .policy_lanes == ["BENIGN"] and
              .decision == "ADMIT_BENIGN_SHADOW" and
              .required_authority == "NONE" and
              (.stop_conditions | length) == 0 and
              .activation_required == false and
              .generated_workflows == [] and
              .historical_synthesis == false and
              .mutation_plan == null
            ' materialized-release-packet.json >/dev/null || { echo "MATERIALIZED_DEPLOY_PACKET_NOT_EXECUTION_ELIGIBLE" >&2; exit 1; }
            packet_base_sha="$(jq -er '.base_sha' materialized-release-packet.json)"
            packet_candidate_sha="$(jq -er '.candidate_sha' materialized-release-packet.json)"
            [[ "$packet_base_sha" == "$PRODUCTION_DEPLOY_SHA" && "$packet_base_sha" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo "MATERIALIZED_DEPLOY_PACKET_BASE_MISMATCH" >&2; exit 1; }
            [[ "$packet_candidate_sha" == "$TARGET_SHA" && "$packet_candidate_sha" == "$INPUT_EXPECTED_CANDIDATE_SHA" ]] || { echo "MATERIALIZED_DEPLOY_PACKET_CANDIDATE_MISMATCH" >&2; exit 1; }
            [[ "$CONTROLLER_SHA" == "$INPUT_EXPECTED_CONTROLLER_SHA" && "$(git rev-parse "${CONTROLLER_SHA}^{tree}")" == "$INPUT_EXPECTED_CONTROLLER_TREE" ]] || { echo "MATERIALIZED_DEPLOY_CONTROLLER_BINDING_MISMATCH" >&2; exit 1; }
            node --import tsx commerce/src/verify-release-control-v2-materialization.ts materialized-release-packet.json "$CONTROLLER_SHA" > reconstructed-materialized-release-packet.json
            cmp --silent materialized-release-packet.json reconstructed-materialized-release-packet.json || { echo "MATERIALIZED_DEPLOY_PACKET_RECONSTRUCTION_MISMATCH" >&2; exit 1; }
            [[ "$(git rev-parse "${TARGET_SHA}^")" == "$packet_base_sha" ]] || { echo "MATERIALIZED_DEPLOY_CANDIDATE_PARENT_MISMATCH" >&2; exit 1; }
          elif [[ "$RECOVERY_MODE" == 1 ]]; then
            # A manual recovery neither selects a new candidate nor repeats
            # initial materialized-candidate admission. Its authority comes
            # solely from the exact held release verified below: paused sales,
            # same deploy-<target> owner, CONTROLLED_CUTOVER mode, matching
            # durable source, and incomplete terminal evidence. In particular,
            # a detached v2 materialized target intentionally need not be an
            # ancestor of this newer controller main.
            :
          else
            # The controller must not be OLDER than what an ordinary candidate
            # deploys, so its policy covers the code it is judging. Equality is
            # allowed: `main` is a descendant of every ordinary target, so a
            # different SHA never gave the controller independent authority.
            git merge-base --is-ancestor "$TARGET_SHA" "$CONTROLLER_SHA" || { echo "GENERIC_DEPLOY_CONTROLLER_OLDER_THAN_TARGET" >&2; exit 1; }
          fi
          checkout_contract_version="$(jq -er '.checkout_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' "$CANDIDATE_CONTRACT_PATH")" || { echo "GENERIC_DEPLOY_CHECKOUT_CONTRACT_VERSION_INVALID" >&2; exit 1; }
          admin_contract_version="$(jq -er '.admin_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' "$CANDIDATE_CONTRACT_PATH")" || { echo "GENERIC_DEPLOY_ADMIN_CONTRACT_VERSION_INVALID" >&2; exit 1; }
          echo "CHECKOUT_CONTRACT_VERSION=$checkout_contract_version" >> "$GITHUB_ENV"
          echo "ADMIN_CONTRACT_VERSION=$admin_contract_version" >> "$GITHUB_ENV"
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          validate_json() {
            local file="$1" label="$2" bytes
            if ! jq -e 'type == "object"' "$file" >/dev/null 2>&1; then
              echo "${label}_INVALID_JSON" >&2
              bytes="$(wc -c < "$file")"
              echo "${label}_BYTES=$bytes" >&2
              printf '%s_PREFIX_HEX=' "$label" >&2
              LC_ALL=C od -An -tx1 -N64 "$file" | tr -d ' \n' >&2
              echo >&2
              exit 1
            fi
            echo "${label}_JSON=PASS"
          }
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > durable-before.json
          validate_json durable-before.json DURABLE_BEFORE
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          validate_json completion.json COMPLETION
          owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
          if [[ "$RECOVERY_MODE" == 1 ]]; then
            if ! jq -e --arg release_id "$RELEASE_ID" --arg source_commit "$TARGET_SHA" '
              .sales_paused == true and
              .owner_release_id == $release_id and
              .owner_mode == "CONTROLLED_CUTOVER" and
              .expected.source_commit == $source_commit
            ' durable-before.json >/dev/null || ! jq -e '.complete == false' completion.json >/dev/null; then
              echo "GENERIC_DEPLOY_MANUAL_RECOVERY_STATE_INVALID" >&2
              exit 1
            fi
          fi
          if ! jq -e '.complete' completion.json >/dev/null; then
            [[ -z "$owner" || "$owner" == "$RELEASE_ID" ]] || { echo "GENERIC_DEPLOY_BLOCKED_BY_RELEASE_OWNER=$owner" >&2; exit 1; }
          fi
          git fetch origin runtime-candidate
          if ! jq -e '.complete' completion.json >/dev/null && [[ -z "$owner" ]]; then
            [[ "$(git rev-parse origin/runtime-candidate)" == "$TARGET_SHA" ]] || { echo "GENERIC_DEPLOY_TARGET_IS_NOT_RUNTIME_CANDIDATE_HEAD" >&2; exit 1; }
          fi
          production_source="$(jq -er '.runtime.source_commit' durable-before.json)"
          [[ "$production_source" =~ ^[a-f0-9]{40}$ ]] || { echo "GENERIC_DEPLOY_PRODUCTION_SOURCE_UNAVAILABLE" >&2; exit 1; }
          git cat-file -e "$production_source^{commit}" || { echo "GENERIC_DEPLOY_PRODUCTION_SOURCE_NOT_IN_REPOSITORY" >&2; exit 1; }
          # No pathspec: the boundary module decides what is sensitive, this step
          # only supplies facts. A pathspec here silently narrowed the boundary
          # to its original three directories and made RELEASE_SEMANTICS inert.
          git diff --name-only -z "$production_source" "$TARGET_SHA" > generic-deploy-boundary-paths.bin
          pnpm commerce:production-deploy:assert-boundary generic-deploy-boundary-paths.bin
          migration_inventory="$(jq -er '
            .runtime.migration_versions |
            if type == "array" and length > 0 and all(.[]; type == "string") then sort | join("\n")
            else error("GENERIC_DEPLOY_PRODUCTION_BASELINE_INVALID")
            end
          ' durable-before.json)"
          source_migration_inventory="$(git ls-tree -r --name-only "$production_source" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          [[ -n "$source_migration_inventory" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_INVENTORY_EMPTY" >&2; exit 1; }
          [[ "$migration_inventory" == "$source_migration_inventory" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_INVENTORY_MISMATCH" >&2; exit 1; }
          migration_inventory_sha256="$(printf %s "$migration_inventory" | shasum -a 256 | awk '{ print $1 }')"
          echo "MIGRATION_INVENTORY_SHA256=$migration_inventory_sha256"
          # The durable expectation may be a migration filename (left by a
          # controlled cutover) or an inventory hash (left by a previous generic
          # deploy). Either is valid evidence of a coherent baseline.
          durable_migration="$(jq -er '.expected.migration | select(type == "string" and (test("^[0-9]{4}_.+\\.sql$") or test("^inventory-sha256:[a-f0-9]{64}$")))' durable-before.json)"
          [[ -n "$durable_migration" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_EXPECTATION_INVALID" >&2; exit 1; }
          # ...but we always ACQUIRE with the inventory form. A filename is
          # validated against the deployed runtime's static allowlist, so a
          # cutover that leaves a newer filename there (0038 did) makes every
          # later generic deploy unacquirable. The inventory hash is derived
          # from the runtime's own applied migrations, so it cannot go stale.
          # Safe here precisely because this controller refuses any candidate
          # touching commerce/migrations: the applied set is identical before
          # and after the deploy, so this hash still describes the post-deploy
          # state that reopen re-verifies.
          expected_migration="inventory-sha256:$migration_inventory_sha256"
          jq -e --arg release_id "$RELEASE_ID" --arg source_commit "$TARGET_SHA" --arg migration "$expected_migration" '
            .runtime as $runtime |
            if
              ($runtime.legal_version | type == "string") and
              ($runtime.legal_manifest_sha256 | type == "string") and
              ($runtime.legal_hashes | type == "object") and
              ($runtime.current_legal_copies_match == true)
            then {
              release_id: $release_id,
              mode: "CONTROLLED_CUTOVER",
              expected: {
                source_commit: $source_commit,
                migration: $migration,
                legal_version: $runtime.legal_version,
                legal_manifest_sha256: $runtime.legal_manifest_sha256,
                legal_hashes: $runtime.legal_hashes
              }
            }
            else error("GENERIC_DEPLOY_PRODUCTION_BASELINE_INVALID")
            end
          ' durable-before.json > release.json
          validate_json release.json RELEASE_REQUEST
          validate_json "$CANDIDATE_MANIFEST_PATH" CANDIDATE_LEGAL_MANIFEST
          manifest_source_sha="$(shasum -a 256 "$CANDIDATE_MANIFEST_PATH" | awk '{ print $1 }')"
          manifest_publish_time="$(jq -er '.publish_time' "$CANDIDATE_MANIFEST_PATH")"
          jq -e --slurpfile request release.json --arg source_sha "$manifest_source_sha" --arg publish_time "$manifest_publish_time" '
            .runtime as $runtime | $request[0].expected as $expected |
            $runtime.legal_version == $expected.legal_version and
            $runtime.legal_manifest_sha256 == $expected.legal_manifest_sha256 and
            $runtime.legal_hashes == $expected.legal_hashes and
            $runtime.current_legal_copies_match == true and
            $runtime.source_legal_manifest_sha256 == $source_sha and
            $runtime.source_legal_publish_time == $publish_time
          ' durable-before.json >/dev/null || { echo "GENERIC_DEPLOY_LEGAL_RUNTIME_BASELINE_MISMATCH" >&2; exit 1; }
          jq -e --slurpfile request release.json '
            . as $candidate | $request[0].expected as $expected |
            $candidate.version == $expected.legal_version and
            {
              PUBLIC_OFFER: $candidate.documents.PUBLIC_OFFER.sha256,
              PRIVACY_POLICY: $candidate.documents.PRIVACY_POLICY.sha256,
              PD_CONSENT: $candidate.documents.PD_CONSENT.sha256,
              CHECKOUT_DISCLOSURE: $candidate.documents.CHECKOUT_DISCLOSURE.sha256
            } == $expected.legal_hashes
          ' "$CANDIDATE_MANIFEST_PATH" >/dev/null || { echo "GENERIC_DEPLOY_LEGAL_CANONICAL_MANIFEST_MISMATCH" >&2; exit 1; }
          if ! jq -e '.complete' completion.json >/dev/null; then
            if [[ "$owner" == "$RELEASE_ID" ]]; then
              jq -e --slurpfile request release.json '.expected == ($request[0].expected | del(.legal_hashes))' durable-before.json >/dev/null || { echo "GENERIC_DEPLOY_OWNER_EXPECTATIONS_MISMATCH" >&2; exit 1; }
            fi
          fi
          if ! jq -e '.complete' completion.json >/dev/null && \
            [[ "$owner" == "$RELEASE_ID" ]] && \
            jq -e --arg source "$TARGET_SHA" '
              .sales_paused == true and
              .owner_mode == "CONTROLLED_CUTOVER" and
              .expected.source_commit == $source
            ' durable-before.json >/dev/null; then
            echo 'REUSING_PAUSED_OWNER=1' >> "$GITHUB_ENV"
          else
            echo 'REUSING_PAUSED_OWNER=0' >> "$GITHUB_ENV"
          fi
          (cd "$RUNTIME_ASSERT_DIR" && node --import tsx commerce/src/reconcile-generic-production-deploy.ts "$GITHUB_WORKSPACE/durable-before.json" "$GITHUB_WORKSPACE/completion.json" "$GITHUB_WORKSPACE/release.json") > reconciliation.json
          validate_json reconciliation.json RECONCILIATION
          action="$(jq -er '.action' reconciliation.json)"
          [[ "$action" != "BLOCKED" ]] || { jq -c . reconciliation.json >&2; exit 1; }
          echo "DEPLOY_ACTION=$action" >> "$GITHUB_ENV"
      - uses: ./.github/actions/controlled-production-deploy-execution
