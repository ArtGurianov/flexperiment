name: Controlled generic runtime publication primitive
description: Publishes one immutable generic runtime provenance ref without promoting or deploying it.
runs:
  using: composite
  steps:
      - name: Bind exact generic publication controller and admission evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo GENERIC_RUNTIME_PUBLICATION_CONTROLLER_NOT_MAIN >&2; exit 1; }
          [[ "$INPUT_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo GENERIC_RUNTIME_PUBLICATION_TARGET_SHA_INVALID >&2; exit 1; }
          [[ "$INPUT_EXPECTED_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo GENERIC_RUNTIME_PUBLICATION_EXPECTED_CONTROLLER_SHA_INVALID >&2; exit 1; }
          [[ "$INPUT_EXPECTED_CONTROLLER_TREE" =~ ^[0-9a-f]{40}$ ]] || { echo GENERIC_RUNTIME_PUBLICATION_EXPECTED_CONTROLLER_TREE_INVALID >&2; exit 1; }
          [[ "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo GENERIC_RUNTIME_PUBLICATION_EXPECTED_PRODUCTION_DEPLOY_SHA_INVALID >&2; exit 1; }
          [[ "$INPUT_EXPECTED_TEST_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo GENERIC_RUNTIME_PUBLICATION_EXPECTED_TEST_RUN_ID_INVALID >&2; exit 1; }
          [[ -n "$GITHUB_TOKEN" ]] || { echo GENERIC_RUNTIME_PUBLICATION_GITHUB_TOKEN_REQUIRED >&2; exit 1; }
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            +refs/heads/runtime-candidate:refs/remotes/origin/runtime-candidate \
            +refs/heads/production-deploy:refs/remotes/origin/production-deploy \
            "$INPUT_TARGET_SHA"
          [[ "$CONTROLLER_SHA" == "$INPUT_EXPECTED_CONTROLLER_SHA" && "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo GENERIC_RUNTIME_PUBLICATION_CONTROLLER_MOVED >&2; exit 1; }
          [[ "$(git rev-parse "${CONTROLLER_SHA}^{tree}")" == "$INPUT_EXPECTED_CONTROLLER_TREE" ]] || { echo GENERIC_RUNTIME_PUBLICATION_CONTROLLER_TREE_MISMATCH >&2; exit 1; }
          [[ "$(git rev-parse origin/production-deploy)" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo GENERIC_RUNTIME_PUBLICATION_PRODUCTION_DEPLOY_MOVED >&2; exit 1; }
          git cat-file -e "$INPUT_TARGET_SHA^{commit}" || { echo GENERIC_RUNTIME_PUBLICATION_TARGET_NOT_COMMIT >&2; exit 1; }
          git merge-base --is-ancestor "$INPUT_TARGET_SHA" "$CONTROLLER_SHA" || { echo GENERIC_RUNTIME_PUBLICATION_TARGET_NOT_COVERED_BY_CONTROLLER >&2; exit 1; }
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_EXPECTED_TEST_RUN_ID" > test-run.json
          jq -e \
            --argjson expected_run_id "$INPUT_EXPECTED_TEST_RUN_ID" \
            --arg target_sha "$INPUT_TARGET_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
              .id == $expected_run_id and
              .name == "Test" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $target_sha and
              .head_repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success"
            ' test-run.json >/dev/null || { echo GENERIC_RUNTIME_PUBLICATION_TEST_EVIDENCE_INVALID >&2; exit 1; }
          scripts/inspect-runtime-candidate-topology.sh \
            --production-deploy "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" \
            --candidate "$INPUT_TARGET_SHA" > topology.json
          jq -e '
            .candidate_is_descendant_of_production_deploy == true and
            .maintenance_commits_in_range == [] and
            .merge_commits_in_range == []
          ' topology.json >/dev/null || { echo GENERIC_RUNTIME_PUBLICATION_TARGET_TOPOLOGY_INELIGIBLE >&2; exit 1; }
          {
            echo "PUBLISH_REF=refs/heads/runtime/generic-$INPUT_TARGET_SHA"
            echo "OBSERVED_RUNTIME_CANDIDATE=$(git rev-parse origin/runtime-candidate)"
            echo "OBSERVED_PRODUCTION_DEPLOY=$(git rev-parse origin/production-deploy)"
          } >> "$GITHUB_ENV"

      - name: Rebind controller and immutable publication preconditions
        shell: bash
        run: |
          set -euo pipefail
          read_remote_ref() {
            local ref="$1" value
            value="$(git ls-remote --exit-code origin "$ref" | awk '{print $1}')" || return 1
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$value"
          }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$INPUT_EXPECTED_CONTROLLER_SHA" && "$(git rev-parse origin/main)" == "$INPUT_EXPECTED_CONTROLLER_SHA" ]] || { echo GENERIC_RUNTIME_PUBLICATION_CONTROLLER_MOVED >&2; exit 1; }
          [[ "$(git rev-parse "${CONTROLLER_SHA}^{tree}")" == "$INPUT_EXPECTED_CONTROLLER_TREE" ]] || { echo GENERIC_RUNTIME_PUBLICATION_CONTROLLER_TREE_MISMATCH >&2; exit 1; }
          [[ "$(read_remote_ref refs/heads/production-deploy)" == "$OBSERVED_PRODUCTION_DEPLOY" && "$OBSERVED_PRODUCTION_DEPLOY" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo GENERIC_RUNTIME_PUBLICATION_PRODUCTION_DEPLOY_MOVED >&2; exit 1; }
          [[ "$(read_remote_ref refs/heads/runtime-candidate)" == "$OBSERVED_RUNTIME_CANDIDATE" ]] || { echo GENERIC_RUNTIME_PUBLICATION_RUNTIME_CANDIDATE_MOVED >&2; exit 1; }
          existing="$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$INPUT_TARGET_SHA" ]] || { echo "GENERIC_RUNTIME_PUBLICATION_REF_CONFLICT=$existing" >&2; exit 1; }
            echo GENERIC_RUNTIME_PUBLICATION_SAME_SHA_REPLAY
          fi

      - name: Create the one immutable generic provenance ref
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GENERIC_RUNTIME_PUBLICATION_REF_TOKEN" ]] || { echo GENERIC_RUNTIME_PUBLICATION_REF_TOKEN_REQUIRED >&2; exit 1; }
          existing="$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')"
          if [[ -z "$existing" ]]; then
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${GENERIC_RUNTIME_PUBLICATION_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            set +e
            git push --force-with-lease="${PUBLISH_REF}:" origin "${INPUT_TARGET_SHA}:${PUBLISH_REF}"
            publish_push_rc=$?
            set -e
            echo "PUBLISH_PUSH_RC=$publish_push_rc" >> "$GITHUB_ENV"
          fi

      - name: Read back publication and prove mutable authorities stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          read_remote_ref() {
            local ref="$1" value
            value="$(git ls-remote --exit-code origin "$ref" | awk '{print $1}')" || return 1
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$value"
          }
          published_after="$(read_remote_ref "$PUBLISH_REF")" || { echo GENERIC_RUNTIME_PUBLICATION_READBACK_UNAVAILABLE >&2; exit 1; }
          runtime_candidate_after="$(read_remote_ref refs/heads/runtime-candidate)" || { echo GENERIC_RUNTIME_PUBLICATION_POST_RUNTIME_CANDIDATE_UNAVAILABLE >&2; exit 1; }
          production_deploy_after="$(read_remote_ref refs/heads/production-deploy)" || { echo GENERIC_RUNTIME_PUBLICATION_POST_PRODUCTION_DEPLOY_UNAVAILABLE >&2; exit 1; }
          [[ "$published_after" == "$INPUT_TARGET_SHA" ]] || { echo GENERIC_RUNTIME_PUBLICATION_READBACK_MISMATCH >&2; exit 1; }
          [[ "$runtime_candidate_after" == "$OBSERVED_RUNTIME_CANDIDATE" && "$production_deploy_after" == "$OBSERVED_PRODUCTION_DEPLOY" ]] || { echo "GENERIC_RUNTIME_PUBLICATION_AUTHORITY_MOVED runtime-candidate=$runtime_candidate_after production-deploy=$production_deploy_after" >&2; exit 1; }
          {
            echo "## Generic runtime publication"
            echo "- Controller SHA: $CONTROLLER_SHA"
            echo "- Target SHA: $INPUT_TARGET_SHA"
            echo "- Successful Test workflow run: $INPUT_EXPECTED_TEST_RUN_ID"
            echo "- Published ref: $PUBLISH_REF"
            echo "- Publication push transport rc: ${PUBLISH_PUSH_RC:-not-needed}"
            echo "- Read-back: PASS"
            echo "- runtime-candidate: unchanged ($runtime_candidate_after)"
            echo "- production-deploy: unchanged ($production_deploy_after)"
          } >> "$GITHUB_STEP_SUMMARY"
