# The ordinary production deploy path. It carries the ordering the release
# contract fixes; the executable half arrives with the launch baseline, and
# until then the entry point exits 78 rather than pretending to deploy.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: >-
          The published candidate to deploy. Its commit, release class and
          readiness expectation all come from that candidate: an operator does
          not get to name a commit, and does not get to choose whether sales
          close - a rolling deploy is something a candidate is classified as,
          never something a dispatcher asks for.
        required: true
        type: string

permissions:
  contents: read

# A deploy must never race another deploy, and must never be cancelled
# half-way: an interrupted run is exactly how production is left mid-topology.
concurrency:
  group: flexperiment-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The input reaches the shell only through the environment. A `${{ }}`
      # expression is substituted into the script text before bash ever runs it,
      # so a crafted value escapes its own quoting no matter how it is quoted.
      - name: Bind to the published candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ -n "$CANDIDATE" ]] || { echo "CANDIDATE_REQUIRED" >&2; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The orchestrator owns the whole sequence - pre-topology capture, the
      # fence, deployment, convergence, readiness, arming, certification,
      # completion - so the workflow stays a thin caller and cannot reorder it.
      - name: Run the release orchestration
        env:
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
        run: pnpm exec tsx scripts/release/deploy-production.ts
