# The ordinary production deploy path. It carries the ordering the release
# contract fixes; the executable half arrives with the launch baseline, and
# until then the entry point exits 78 rather than pretending to deploy.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release class. A rolling release never closes sales; a maintenance cutover does, and certifies.
        required: true
        type: choice
        options: [ROLLING_SAFE, MAINTENANCE_CUTOVER]
      target_sha:
        description: The exact 40-hex commit to deploy. Must already be on main with a green Test run.
        required: true
        type: string

permissions:
  contents: read

# A deploy must never race another deploy, and must never be cancelled
# half-way: an interrupted run is exactly how production is left mid-topology.
concurrency:
  group: flexperiment-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The input reaches the shell only through the environment. A `${{ }}`
      # expression is substituted into the script text before bash ever runs it,
      # so a crafted value escapes its own quoting no matter how it is quoted.
      - name: Bind to the exact target commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "TARGET_SHA_INVALID" >&2; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" origin/main \
            || { echo "TARGET_SHA_NOT_ON_MAIN" >&2; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The orchestrator owns the whole sequence - pre-topology capture, the
      # fence, deployment, convergence, readiness, arming, certification,
      # completion - so the workflow stays a thin caller and cannot reorder it.
      - name: Run the release orchestration
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
        run: pnpm exec tsx scripts/release/deploy-production.ts
