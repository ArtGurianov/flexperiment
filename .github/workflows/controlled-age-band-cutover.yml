name: Controlled age-band legal cutover

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact immutable age-band source commit on origin/main
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
      RELEASE_ID: age-band-${{ inputs.target_sha }}
      CANDIDATE_SOURCE_COMMIT: ${{ inputs.target_sha }}
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build durable request from main-only production ref
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "target_sha must be a full SHA" >&2; exit 1; }
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > durable-before.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          if jq -e '.complete' completion.json >/dev/null; then echo 'TERMINAL_COMPLETE=1' >> "$GITHUB_ENV"; exit 0; fi
          owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
          expected="$(jq -r '.expected.source_commit // empty' durable-before.json)"
          if [[ -z "$owner" ]]; then
            [[ "$CANDIDATE_SOURCE_COMMIT" == "$MAIN_SHA" ]] || { echo "New release target must equal origin/main" >&2; exit 1; }
            git checkout --detach "$CANDIDATE_SOURCE_COMMIT"
          else
            [[ "$owner" == "$RELEASE_ID" ]] || { echo "Release is owned by $owner" >&2; exit 1; }
            if [[ "$expected" == "$CANDIDATE_SOURCE_COMMIT" ]]; then git checkout --detach "$CANDIDATE_SOURCE_COMMIT"; else
              git cat-file -e "$expected^{commit}" && git merge-base --is-ancestor "$CANDIDATE_SOURCE_COMMIT" "$expected" || { echo "Unexpected durable source" >&2; exit 1; }
              git checkout --detach "$expected"; export COMMERCE_RELEASE_MANIFEST_PATH=commerce/legal/production-manifest.json
            fi
          fi
          TARGET_SHA="$(git rev-parse HEAD)"; echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          pnpm exec tsx commerce/src/release-cutover-payload.ts "$TARGET_SHA" > release.json
          jq -e '.expected.migration == "0034_worker_sweep_evidence.sql" and .expected.legal_version == "2026-08-25.1"' release.json >/dev/null
          current_legal="$(jq -r '.runtime.legal_version // empty' durable-before.json)"
          if [[ "$current_legal" == 2026-08-23.2 ]]; then
            echo 'LEGAL_PUBLICATION_STATE=NOT_PUBLISHED' >> "$GITHUB_ENV"
          elif [[ "$current_legal" == 2026-08-25.1 ]] && jq -e --arg manifest "$(jq -er '.expected.legal_manifest_sha256' release.json)" '.runtime.legal_manifest_sha256 == $manifest and (.runtime.legal_publish_time | type == "string" and length > 0)' durable-before.json >/dev/null; then
            echo 'LEGAL_PUBLICATION_STATE=PUBLISHED_THIS_CANDIDATE' >> "$GITHUB_ENV"
          else
            echo 'Unexpected legal publication state' >&2; exit 1
          fi
          pnpm exec tsx commerce/src/reconcile-cutover.ts durable-before.json completion.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation.json
          jq -e 'type == "object"' reconciliation.json >/dev/null || { echo "CUTOVER_RECONCILIATION_INVALID_JSON" >&2; exit 1; }
          CUTOVER_ACTION="$(jq -er .action reconciliation.json)"; [[ "$CUTOVER_ACTION" != BLOCKED ]] || { jq -c . reconciliation.json >&2; exit 1; }
          echo "CUTOVER_ACTION=$CUTOVER_ACTION" >> "$GITHUB_ENV"; echo 'TERMINAL_COMPLETE=0' >> "$GITHUB_ENV"

      - name: Verify a previously complete release on all surfaces
        if: env.TERMINAL_COMPLETE == '1'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          sha="$(jq -er '.expected.source_commit' completion.json)"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/legal-config" > legal.json
          jq -e --arg sha "$sha" --arg manifest "$(jq -er '.expected.legal_manifest_sha256' completion.json)" '.sales_paused == false and .runtime.source_commit == $sha and .runtime.worker_source_commit == $sha and .runtime.legal_version == "2026-08-25.1" and .runtime.legal_manifest_sha256 == $manifest and (.runtime.worker_last_successful_sweep_at|type == "string")' status.json >/dev/null
          jq -e --arg sha "$sha" '.source_commit == $sha and .checkout_contract_version == "age-band-v1"' frontend.json >/dev/null
          jq -e --arg sha "$sha" '.source_commit == $sha and .admin_contract_version == "age-band-v1"' admin.json >/dev/null
          jq -e --arg offer "$(jq -er '.expected.legal_hashes.PUBLIC_OFFER' completion.json)" --arg privacy "$(jq -er '.expected.legal_hashes.PRIVACY_POLICY' completion.json)" --arg consent "$(jq -er '.expected.legal_hashes.PD_CONSENT' completion.json)" --arg disclosure "$(jq -er '.expected.legal_hashes.CHECKOUT_DISCLOSURE' completion.json)" '.version == "2026-08-25.1" and .manifest.documents.PUBLIC_OFFER.sha256 == $offer and .manifest.documents.PRIVACY_POLICY.sha256 == $privacy and .manifest.documents.PD_CONSENT.sha256 == $consent and .manifest.documents.CHECKOUT_DISCLOSURE.sha256 == $disclosure' legal.json >/dev/null

      - name: Acquire owner and pause sales
        if: env.TERMINAL_COMPLETE != '1'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/acquire" > /dev/null
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/pause" > pause.json
          jq -e '.sales_paused' pause.json >/dev/null

      - name: Reconcile after pause
        if: env.TERMINAL_COMPLETE != '1'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          pnpm exec tsx commerce/src/reconcile-cutover.ts status.json completion.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation.json
          jq -e 'type == "object"' reconciliation.json >/dev/null || { echo "CUTOVER_RECONCILIATION_INVALID_JSON" >&2; exit 1; }
          action="$(jq -er .action reconciliation.json)"; [[ "$action" != BLOCKED ]] || exit 1; echo "CUTOVER_ACTION=$action" >> "$GITHUB_ENV"

      - name: Set guarded production deployment ref for candidate
        if: env.TERMINAL_COMPLETE != '1' && (env.CUTOVER_ACTION == 'DEPLOY_CANDIDATE' || env.CUTOVER_ACTION == 'PUBLISH_LEGAL')
        run: scripts/set-production-deploy-ref.sh "$TARGET_SHA"

      - name: Deploy candidate to all production resources
        if: env.TERMINAL_COMPLETE != '1' && (env.CUTOVER_ACTION == 'DEPLOY_CANDIDATE' || env.CUTOVER_ACTION == 'PUBLISH_LEGAL')
        run: scripts/controlled-coolify-deploy.sh "$TARGET_SHA"

      - name: Prove candidate before legal publication
        if: env.TERMINAL_COMPLETE != '1' && env.CUTOVER_ACTION == 'DEPLOY_CANDIDATE'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json || true
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json || true
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json || true
            if node --import tsx commerce/src/assert-candidate-runtime-ready.ts status.json "$TARGET_SHA" "0034_worker_sweep_evidence.sql" && jq -e --arg sha "$TARGET_SHA" '.source_commit == $sha and .checkout_contract_version == "age-band-v1"' frontend.json >/dev/null && jq -e --arg sha "$TARGET_SHA" '.source_commit == $sha and .admin_contract_version == "age-band-v1"' admin.json >/dev/null; then break; fi
            [[ "$attempt" == "$POLL_ATTEMPTS" ]] && exit 1; sleep "$POLL_SECONDS"
          done
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          pnpm exec tsx commerce/src/reconcile-cutover.ts status.json completion.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation.json
          jq -e 'type == "object"' reconciliation.json >/dev/null || { echo "CUTOVER_RECONCILIATION_INVALID_JSON" >&2; exit 1; }
          [[ "$(jq -er .action reconciliation.json)" == PUBLISH_LEGAL ]] || exit 1
          echo 'CUTOVER_ACTION=PUBLISH_LEGAL' >> "$GITHUB_ENV"

      - name: Publish legal and reconcile
        if: env.TERMINAL_COMPLETE != '1'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          if [[ "$LEGAL_PUBLICATION_STATE" == NOT_PUBLISHED ]]; then api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/legal-publish" > publication.json; PUBLISHED_AT="$(jq -er .effectiveAt publication.json)"; else api "$PUBLIC_API_URL/v1/internal/release-control/status" > publication.json; PUBLISHED_AT="$(jq -er .runtime.legal_publish_time publication.json)"; fi
          echo "PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"

      - name: Create or recover guarded promotion on main
        if: env.TERMINAL_COMPLETE != '1'
        run: |
          set -euo pipefail
          git fetch origin main; MAIN_SHA="$(git rev-parse origin/main)"; published="$(date -u -d "$PUBLISHED_AT" +%Y-%m-%dT%H:%M:%SZ)"
          allowed() { ! git diff --name-only "$CANDIDATE_SOURCE_COMMIT..$1" | grep -Ev '^(certification\.sh|commerce/legal/production-manifest\.json|public/legal/.+)$' | grep -q .; }
          if [[ "$MAIN_SHA" == "$CANDIDATE_SOURCE_COMMIT" ]]; then
            git checkout --detach "$CANDIDATE_SOURCE_COMMIT"; COMMERCE_LEGAL_PROMOTION_VERSION=2026-08-25.1 COMMERCE_LEGAL_PROMOTION_PUBLISH_TIME="$PUBLISHED_AT" pnpm commerce:legal-release:promote
            git add certification.sh commerce/legal/production-manifest.json public/legal; git diff --cached --exit-code && exit 1
            git diff --cached --name-only | grep -Ev '^(certification\.sh|commerce/legal/production-manifest\.json|public/legal/.+)$' | grep -q . && exit 1
            git config user.name flexperiment-release-bot; git config user.email flexperiment-release-bot@users.noreply.github.com; git commit -m 'chore(legal): promote 2026-08-25.1'; PROMOTION_SHA="$(git rev-parse HEAD)"; git push origin HEAD:refs/heads/main
          else
            git merge-base --is-ancestor "$CANDIDATE_SOURCE_COMMIT" "$MAIN_SHA" && allowed "$MAIN_SHA" && git show "$MAIN_SHA:commerce/legal/production-manifest.json" > manifest.json && jq -e --arg published "$published" '.version == "2026-08-25.1" and .publish_time == $published' manifest.json >/dev/null || { echo 'main is not the exact promotion' >&2; exit 1; }
            PROMOTION_SHA="$MAIN_SHA"; git checkout --detach "$PROMOTION_SHA"
          fi
          RELEASE_ID="$RELEASE_ID" COMMERCE_RELEASE_MANIFEST_PATH=commerce/legal/production-manifest.json pnpm exec tsx commerce/src/release-cutover-payload.ts "$PROMOTION_SHA" > promotion-release.json
          jq -e --slurpfile candidate release.json '.expected.legal_manifest_sha256 == $candidate[0].expected.legal_manifest_sha256 and .expected.legal_hashes == $candidate[0].expected.legal_hashes' promotion-release.json >/dev/null
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @promotion-release.json "$PUBLIC_API_URL/v1/internal/release-control/expectations" > /dev/null
          echo "PROMOTION_SHA=$PROMOTION_SHA" >> "$GITHUB_ENV"

      - name: Set guarded production deployment ref for promotion
        if: env.TERMINAL_COMPLETE != '1'
        run: scripts/set-production-deploy-ref.sh "$PROMOTION_SHA"

      - name: Deploy promotion to all production resources
        if: env.TERMINAL_COMPLETE != '1'
        run: scripts/controlled-coolify-deploy.sh "$PROMOTION_SHA"

      - name: Verify all promotion surfaces and guarded reopen
        if: env.TERMINAL_COMPLETE != '1'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json || true
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json || true
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json || true
            if jq -e --arg sha "$PROMOTION_SHA" --arg manifest "$(jq -er '.expected.legal_manifest_sha256' promotion-release.json)" '.sales_paused and .runtime.source_commit == $sha and .runtime.worker_source_commit == $sha and .runtime.legal_version == "2026-08-25.1" and .runtime.legal_manifest_sha256 == $manifest and (.runtime.worker_last_successful_sweep_at|type == "string") and .runtime.current_legal_copies_match' status.json >/dev/null && jq -e --arg sha "$PROMOTION_SHA" '.source_commit == $sha and .checkout_contract_version == "age-band-v1"' frontend.json >/dev/null && jq -e --arg sha "$PROMOTION_SHA" '.source_commit == $sha and .admin_contract_version == "age-band-v1"' admin.json >/dev/null; then break; fi
            [[ "$attempt" == "$POLL_ATTEMPTS" ]] && exit 1; sleep "$POLL_SECONDS"
          done
          api "$PUBLIC_API_URL/v1/internal/release-control/contract" > contract.json; jq -e '.deprecated_date_of_birth_rejected' contract.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/healthz" | jq -e '.ok' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/readyz" | jq -e '.ok' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/legal-config" > legal.json
          jq -e --arg offer "$(jq -er '.expected.legal_hashes.PUBLIC_OFFER' promotion-release.json)" --arg privacy "$(jq -er '.expected.legal_hashes.PRIVACY_POLICY' promotion-release.json)" --arg consent "$(jq -er '.expected.legal_hashes.PD_CONSENT' promotion-release.json)" --arg disclosure "$(jq -er '.expected.legal_hashes.CHECKOUT_DISCLOSURE' promotion-release.json)" '.version == "2026-08-25.1" and .manifest.documents.PUBLIC_OFFER.sha256 == $offer and .manifest.documents.PRIVACY_POLICY.sha256 == $privacy and .manifest.documents.PD_CONSENT.sha256 == $consent and .manifest.documents.CHECKOUT_DISCLOSURE.sha256 == $disclosure' legal.json >/dev/null
          api -X POST -H 'Content-Type: application/json' --data-binary @promotion-release.json "$PUBLIC_API_URL/v1/internal/release-control/reopen" > reopened.json; jq -e '.sales_paused == false and .owner_release_id == null' reopened.json >/dev/null
