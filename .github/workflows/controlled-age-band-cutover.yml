name: Controlled age-band legal cutover

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact immutable age-band source commit to deploy
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      COMMERCE_INTERNAL_URL: ${{ secrets.COMMERCE_INTERNAL_URL }}
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
      PUBLIC_RELEASE_URL: ${{ secrets.PUBLIC_RELEASE_URL }}
      # run_id is stable across a GitHub re-run, so a failed release can resume
      # its same durable owner instead of acquiring a second lease.
      RELEASE_ID: gha-${{ github.run_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      CANDIDATE_SOURCE_COMMIT: ${{ inputs.target_sha }}
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build immutable cutover request
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" > durable-before.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$COMMERCE_INTERNAL_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          if jq -e '.complete == true' completion.json >/dev/null; then
            echo "TERMINAL_COMPLETE=1" >> "$GITHUB_ENV"
            echo "CUTOVER_ACTION=RELEASE_ALREADY_COMPLETE" >> "$GITHUB_ENV"
            echo "RELEASE_ALREADY_COMPLETE"
            exit 0
          fi
          owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
          expected_sha="$(jq -r '.expected.source_commit // empty' durable-before.json)"
          if [[ -n "$owner" && "$owner" != "$RELEASE_ID" ]]; then echo "Release is owned by $owner" >&2; exit 1; fi
          if [[ -n "$owner" && "$expected_sha" != "$TARGET_SHA" ]]; then
            git fetch origin "$expected_sha"
            git checkout --detach "$expected_sha"
            export COMMERCE_RELEASE_MANIFEST_PATH=commerce/legal/production-manifest.json
            echo "RESUMING_PROMOTION=1" >> "$GITHUB_ENV"
          else
            echo "RESUMING_PROMOTION=0" >> "$GITHUB_ENV"
          fi
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          pnpm commerce:release-cutover:payload "$TARGET_SHA" > release.json
          jq -e '.mode == "CONTROLLED_CUTOVER" and .expected.migration == "0033_runtime_release_evidence.sql" and .expected.legal_version == "2026-08-25.1"' release.json >/dev/null
          candidate_manifest_sha="$(jq -er '.expected.legal_manifest_sha256' release.json)"
          current_legal_version="$(jq -r '.runtime.legal_version // empty' durable-before.json)"
          if [[ "$current_legal_version" == "2026-08-23.2" ]]; then
            echo "LEGAL_PUBLICATION_STATE=NOT_PUBLISHED" >> "$GITHUB_ENV"
          elif [[ "$current_legal_version" == "2026-08-25.1" ]] \
            && jq -e --arg manifest "$candidate_manifest_sha" '.runtime.legal_manifest_sha256 == $manifest and (.runtime.legal_publish_time | type == "string" and length > 0)' durable-before.json >/dev/null \
            && date -u -d "$(jq -er '.runtime.legal_publish_time' durable-before.json)" +%Y-%m-%dT%H:%M:%SZ >/dev/null; then
            echo "LEGAL_PUBLICATION_STATE=PUBLISHED_THIS_CANDIDATE" >> "$GITHUB_ENV"
          else
            echo "Unexpected or mismatched legal publication state; refusing resume." >&2
            exit 1
          fi
          pnpm commerce:release-cutover:reconcile durable-before.json completion.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation.json
          CUTOVER_ACTION="$(jq -er '.action' reconciliation.json)"
          case "$CUTOVER_ACTION" in
            RELEASE_ALREADY_COMPLETE|ACQUIRE_OWNER|PAUSE_SALES|DEPLOY_CANDIDATE|PUBLISH_LEGAL|CREATE_PROMOTION|DEPLOY_PROMOTION|VERIFY_AND_REOPEN) ;;
            BLOCKED) echo "$(jq -r '.reason' reconciliation.json)" >&2; exit 1 ;;
            *) echo "Unknown reconciliation action: $CUTOVER_ACTION" >&2; exit 1 ;;
          esac
          echo "CUTOVER_ACTION=$CUTOVER_ACTION" >> "$GITHUB_ENV"
          if [[ "$CUTOVER_ACTION" == "RELEASE_ALREADY_COMPLETE" ]]; then
            echo "TERMINAL_COMPLETE=1" >> "$GITHUB_ENV"
            echo "RELEASE_ALREADY_COMPLETE"
            exit 0
          fi
          if jq -e '.complete == true and (.expected.source_commit | test("^[a-f0-9]{40}$")) and .expected.migration == "0033_runtime_release_evidence.sql" and .expected.legal_version == "2026-08-25.1"' completion.json >/dev/null; then
            final_source_commit="$(jq -er '.expected.source_commit' completion.json)"
            jq -e --arg source "$final_source_commit" --arg manifest "$(jq -er '.expected.legal_manifest_sha256' completion.json)" '.sales_paused == false and .owner_release_id == null and .expected.source_commit == $source and .expected.migration == "0033_runtime_release_evidence.sql" and .runtime.source_commit == $source and .runtime.worker_source_commit == $source and .runtime.migration_applied == true and (.runtime.required_migrations["0031_participant_age_band.sql"] == true) and (.runtime.required_migrations["0033_runtime_release_evidence.sql"] == true) and .runtime.legal_version == "2026-08-25.1" and .runtime.legal_manifest_sha256 == $manifest and (.runtime.worker_observed_at | type == "string" and length > 0)' durable-before.json >/dev/null
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_RELEASE_URL/release.json" > completed-frontend-release.json
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_RELEASE_URL/v1/public/legal-config" > completed-public-legal.json
            durable_effective_epoch="$(date -u -d "$(jq -er '.runtime.legal_publish_time' durable-before.json)" +%s)"
            public_effective_epoch="$(date -u -d "$(jq -er '.effective_at' completed-public-legal.json)" +%s)"
            [[ "$durable_effective_epoch" == "$public_effective_epoch" ]]
            jq -e --arg offer "$(jq -er '.expected.legal_hashes.PUBLIC_OFFER' completion.json)" --arg privacy "$(jq -er '.expected.legal_hashes.PRIVACY_POLICY' completion.json)" --arg consent "$(jq -er '.expected.legal_hashes.PD_CONSENT' completion.json)" --arg disclosure "$(jq -er '.expected.legal_hashes.CHECKOUT_DISCLOSURE' completion.json)" '.manifest.documents.PUBLIC_OFFER.sha256 == $offer and .manifest.documents.PRIVACY_POLICY.sha256 == $privacy and .manifest.documents.PD_CONSENT.sha256 == $consent and .manifest.documents.CHECKOUT_DISCLOSURE.sha256 == $disclosure and (.effective_at | type == "string" and length > 0)' completed-public-legal.json >/dev/null
            jq -e --arg source "$final_source_commit" '.source_commit == $source and .checkout_contract_version == "age-band-v1"' completed-frontend-release.json >/dev/null
            echo "TERMINAL_COMPLETE=1" >> "$GITHUB_ENV"
            echo "RELEASE_ALREADY_COMPLETE"
          else
            echo "TERMINAL_COMPLETE=0" >> "$GITHUB_ENV"
          fi

      - name: Acquire durable owner and pause new orders
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 ]] && exit 0
          [[ "$CUTOVER_ACTION" != "RELEASE_ALREADY_COMPLETE" ]] || exit 0
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X POST --data-binary @release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/acquire" > acquire.json
          api -X POST --data-binary @release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/pause" > pause.json
          jq -e '.sales_paused == true' pause.json >/dev/null

      - name: Reconcile after durable owner and pause
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 ]] && exit 0
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" > durable-after-pause.json
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-after-pause.json
          pnpm commerce:release-cutover:reconcile durable-after-pause.json completion-after-pause.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation-after-pause.json
          CUTOVER_ACTION="$(jq -er '.action' reconciliation-after-pause.json)"
          [[ "$CUTOVER_ACTION" == "DEPLOY_CANDIDATE" || "$CUTOVER_ACTION" == "PUBLISH_LEGAL" || "$CUTOVER_ACTION" == "CREATE_PROMOTION" || "$CUTOVER_ACTION" == "DEPLOY_PROMOTION" || "$CUTOVER_ACTION" == "VERIFY_AND_REOPEN" ]] || { jq -c . reconciliation-after-pause.json >&2; exit 1; }
          echo "CUTOVER_ACTION=$CUTOVER_ACTION" >> "$GITHUB_ENV"

      - name: Deploy candidate source through the sole Coolify trigger
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 || "$CUTOVER_ACTION" != "DEPLOY_CANDIDATE" ]] && exit 0
          # HTTP acceptance only proves webhook delivery. Runtime proof is the next step.
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" >/dev/null

      - name: Prove candidate runtime is ready while old legal release remains active
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 || "$CUTOVER_ACTION" != "DEPLOY_CANDIDATE" ]] && exit 0
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" > runtime.json || true
            if pnpm commerce:release-cutover:assert-candidate-ready runtime.json "$TARGET_SHA"; then break; fi
            sleep "$POLL_SECONDS"
          done
          [[ -f runtime.json ]] || { echo "FAILED_GATE=candidate-runtime-or-old-legal" >&2; exit 1; }
          pnpm commerce:release-cutover:assert-candidate-ready runtime.json "$TARGET_SHA"
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-after-candidate.json
          pnpm commerce:release-cutover:reconcile runtime.json completion-after-candidate.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation-after-candidate.json
          CUTOVER_ACTION="$(jq -er '.action' reconciliation-after-candidate.json)"
          [[ "$CUTOVER_ACTION" == "PUBLISH_LEGAL" ]] || { jq -c . reconciliation-after-candidate.json >&2; exit 1; }
          echo "CUTOVER_ACTION=$CUTOVER_ACTION" >> "$GITHUB_ENV"

      - name: Publish the checked-in candidate once under the durable owner
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 ]] && exit 0
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' "$@"; }
          if [[ "$LEGAL_PUBLICATION_STATE" == "NOT_PUBLISHED" ]]; then
            api -X POST --data-binary @release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/legal-publish" > publication.json
            PUBLISHED_AT="$(jq -er '.effectiveAt' publication.json)"
          else
            PUBLISHED_AT="$(jq -er '.runtime.legal_publish_time' durable-before.json)"
          fi
          [[ "$PUBLISHED_AT" != "PENDING_AUTHORITATIVE_PUBLISH_TIMESTAMP" ]]
          echo "PUBLISHED_AT=$PUBLISHED_AT" >> "$GITHUB_ENV"
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" > durable-after-legal.json
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-after-legal.json
          pnpm commerce:release-cutover:reconcile durable-after-legal.json completion-after-legal.json release.json "$CANDIDATE_SOURCE_COMMIT" > reconciliation-after-legal.json
          CUTOVER_ACTION="$(jq -er '.action' reconciliation-after-legal.json)"
          [[ "$CUTOVER_ACTION" == "CREATE_PROMOTION" || "$CUTOVER_ACTION" == "DEPLOY_PROMOTION" || "$CUTOVER_ACTION" == "VERIFY_AND_REOPEN" ]] || { jq -c . reconciliation-after-legal.json >&2; exit 1; }
          echo "CUTOVER_ACTION=$CUTOVER_ACTION" >> "$GITHUB_ENV"

      - name: Create and deploy immutable legal promotion artifact
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 ]] && exit 0
          if [[ "$CUTOVER_ACTION" == "VERIFY_AND_REOPEN" ]]; then
            cp release.json promotion-release.json
            echo "PROMOTION_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$RESUMING_PROMOTION" == 1 ]]; then
            cp release.json promotion-release.json
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" >/dev/null
            echo "PROMOTION_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          git fetch origin main
          normalized_publish_time="$(date -u -d "$PUBLISHED_AT" +%Y-%m-%dT%H:%M:%SZ)"
          if git show origin/main:commerce/legal/production-manifest.json > existing-promotion-manifest.json 2>/dev/null \
            && jq -e --arg published "$normalized_publish_time" '.version == "2026-08-25.1" and .publish_time == $published' existing-promotion-manifest.json >/dev/null; then
            PROMOTION_SHA="$(git log -1 --format=%H origin/main -- commerce/legal/production-manifest.json)"
            git checkout --detach "$PROMOTION_SHA"
            RELEASE_ID="$RELEASE_ID" COMMERCE_RELEASE_MANIFEST_PATH=commerce/legal/production-manifest.json pnpm commerce:release-cutover:payload "$PROMOTION_SHA" > promotion-release.json
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' -X POST --data-binary @promotion-release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/expectations" > expectations.json
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" >/dev/null
            echo "PROMOTION_SHA=$PROMOTION_SHA" >> "$GITHUB_ENV"
            exit 0
          fi
          COMMERCE_LEGAL_PROMOTION_VERSION=2026-08-25.1 COMMERCE_LEGAL_PROMOTION_PUBLISH_TIME="$PUBLISHED_AT" pnpm commerce:legal-release:promote
          git add certification.sh commerce/legal/production-manifest.json public/legal
          git diff --cached --exit-code && { echo "Promotion produced no source change" >&2; exit 1; }
          git config user.name "flexperiment-release-bot"
          git config user.email "flexperiment-release-bot@users.noreply.github.com"
          git commit -m "chore(legal): promote 2026-08-25.1"
          PROMOTION_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/main"
          RELEASE_ID="$RELEASE_ID" pnpm commerce:release-cutover:payload "$PROMOTION_SHA" > promotion-release.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' -X POST --data-binary @promotion-release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/expectations" > expectations.json
          jq -e '.sales_paused == true' expectations.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" >/dev/null
          echo "PROMOTION_SHA=$PROMOTION_SHA" >> "$GITHUB_ENV"

      - name: Verify promotion, contract, then reopen with guarded CAS
        run: |
          set -euo pipefail
          [[ "${TERMINAL_COMPLETE:-0}" == 1 ]] && exit 0
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          expected_source_manifest_sha="$(sha256sum commerce/legal/production-manifest.json | awk '{print $1}')"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" > final-runtime.json || true
            if jq -e --arg sha "$PROMOTION_SHA" --arg manifest "$expected_source_manifest_sha" '.sales_paused == true and .runtime.source_commit == $sha and .runtime.worker_source_commit == $sha and .runtime.migration_applied == true and .runtime.legal_version == "2026-08-25.1" and .runtime.current_legal_copies_match == true and (.runtime.legal_publish_time | length > 0) and .runtime.source_legal_manifest_sha256 == $manifest and .runtime.source_legal_publish_time == (.runtime.legal_publish_time | gsub(" "; "T") + "Z")' final-runtime.json >/dev/null 2>&1; then break; fi
            [[ "$attempt" == "$POLL_ATTEMPTS" ]] && { echo "FAILED_GATE=promotion-runtime-or-legal" >&2; exit 1; }
            sleep "$POLL_SECONDS"
          done
          api "$COMMERCE_INTERNAL_URL/v1/internal/release-control/contract" > contract.json
          jq -e '.deprecated_date_of_birth_rejected == true and .participant_age_bands == ["ADULT", "MINOR_14_17", "MINOR_UNDER_14"]' contract.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_RELEASE_URL/release.json" > frontend-release.json
          jq -e --arg sha "$PROMOTION_SHA" '.source_commit == $sha and .checkout_contract_version == "age-band-v1"' frontend-release.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$COMMERCE_INTERNAL_URL/healthz" | jq -e '.ok == true' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$COMMERCE_INTERNAL_URL/readyz" | jq -e '.ok == true' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_RELEASE_URL/v1/public/legal-config" > public-legal.json
          internal_effective_epoch="$(date -u -d "$(jq -er '.runtime.legal_publish_time' final-runtime.json)" +%s)"
          public_effective_epoch="$(date -u -d "$(jq -er '.effective_at' public-legal.json)" +%s)"
          [[ "$internal_effective_epoch" == "$public_effective_epoch" ]]
          jq -e --arg version "2026-08-25.1" --arg offer "$(jq -er '.expected.legal_hashes.PUBLIC_OFFER' promotion-release.json)" --arg privacy "$(jq -er '.expected.legal_hashes.PRIVACY_POLICY' promotion-release.json)" --arg consent "$(jq -er '.expected.legal_hashes.PD_CONSENT' promotion-release.json)" --arg disclosure "$(jq -er '.expected.legal_hashes.CHECKOUT_DISCLOSURE' promotion-release.json)" '.version == $version and .manifest.documents.PUBLIC_OFFER.sha256 == $offer and .manifest.documents.PRIVACY_POLICY.sha256 == $privacy and .manifest.documents.PD_CONSENT.sha256 == $consent and .manifest.documents.CHECKOUT_DISCLOSURE.sha256 == $disclosure' public-legal.json >/dev/null
          api -X POST -H 'Content-Type: application/json' --data-binary @promotion-release.json "$COMMERCE_INTERNAL_URL/v1/internal/release-control/reopen" > reopened.json
          jq -e '.sales_paused == false and .owner_release_id == null' reopened.json >/dev/null

      - name: Recovery context on failure
        if: failure()
        run: |
          set -u
          echo "release_id=$RELEASE_ID target_sha=$TARGET_SHA promotion_sha=${PROMOTION_SHA:-unknown}"
          if status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$COMMERCE_INTERNAL_URL/v1/internal/release-control/status" 2>/dev/null)"; then
            jq -c '{sales_paused, owner_release_id, source_commit: .runtime.source_commit, worker_source_commit: .runtime.worker_source_commit, migration_applied: .runtime.migration_applied, legal_version: .runtime.legal_version}' <<<"$status"
          else
            echo 'release_control_status=UNKNOWN'
          fi
          echo "Repair the failed gate and resume the same release_id. Do not reopen unless the guarded checks pass."
