# Publishes an immutable candidate: the exact commit, its release class and the
# readiness expectation that belong together. It deploys nothing.
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: The exact 40-hex commit to publish as a candidate.
        required: true
        type: string

permissions:
  contents: read
  # Reading the check runs of the exact candidate commit.
  checks: read

concurrency:
  group: flexperiment-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # See deploy-production.yml: inputs reach the shell only via `env`.
      - name: Bind to the exact candidate commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "CANDIDATE_SHA_INVALID" >&2; exit 1; }
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main \
            || { echo "CANDIDATE_SHA_NOT_ON_MAIN" >&2; exit 1; }
          # An ancestor that was green once is not the same claim. The launch
          # cutover destroys the predecessor database, so it may only ever be
          # the exact current tip.
          [[ "$CANDIDATE_SHA" == "$(git rev-parse origin/main)" ]] \
            || { echo "LAUNCH_BASELINE_MUST_BE_MAIN_HEAD" >&2; exit 1; }

      # Green on this exact commit, not somewhere in its history. A candidate
      # inherits nothing from its ancestors.
      - name: Require green CI on the exact candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          for check in test docker-build; do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs" \
              --jq ".check_runs[] | select(.name == \"${check}\") | .conclusion" | head -1)"
            [[ "$conclusion" == "success" ]] \
              || { echo "CANDIDATE_CHECK_NOT_SUCCESS: ${check}=${conclusion:-missing}" >&2; exit 1; }
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Publish the candidate
        env:
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          # Launch publication is the only P2 classifier. Future rolling
          # publication must come from a compatibility proof, never dispatch.
          RELEASE_CLASS: LAUNCH_BASELINE
        run: pnpm exec tsx scripts/release/release-candidate.ts
