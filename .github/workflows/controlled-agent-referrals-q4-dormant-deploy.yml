name: Controlled Agent Referrals Q3 to Q4 DORMANT deployment

# The Q4 capability candidate is deployed only through this manual controller.
# It intentionally ends with a held ROLLING owner; terminalization and feature
# activation are separate authorization boundaries.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      Q2: 2dc1a55a070a7e9e9ebcd52f46dff8d171da223e
      BASE_SHA: f317c836635bfe3a86735ecda6a050c51d4dc924
      TARGET_SHA: e0cf268496660dade2db3fa43b189682d059c25c
      TARGET_TREE: 5e122dc8e4fbb5811fb98e27813c1b0883e15911
      Q3_RELEASE_ID: agent-referrals-recovery-f317c836635bfe3a86735ecda6a050c51d4dc924
      Q4_RELEASE_ID: agent-referrals-q4-dormant-e0cf268496660dade2db3fa43b189682d059c25c
      OLD_Q2_RELEASE_ID: agent-referrals-f540b997d6d31a22293909ded7ce464c3f51732f
      PRODUCTION_DEPLOY_REF_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_REF_TOKEN }}
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind dedicated production-deploy credential
        run: |
          set -euo pipefail
          [[ -n "$PRODUCTION_DEPLOY_REF_TOKEN" ]] || { echo AGENT_REFERRALS_Q4_DEPLOY_REF_TOKEN_REQUIRED >&2; exit 1; }
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${PRODUCTION_DEPLOY_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Bind exact current main controller and frozen release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo AGENT_REFERRALS_Q4_DORMANT_CONTROLLER_NOT_MAIN >&2; exit 1; }
          [[ "$Q4_RELEASE_ID" == "agent-referrals-q4-dormant-$TARGET_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_RELEASE_ID_INVALID >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_CONTROLLER_MAIN_MOVED >&2; exit 1; }

      - uses: pnpm/action-setup@v4
        with: { version: 10.29.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Reconstruct exact certified Q4 from this controller tree
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.release/controlled-candidates/agent-referrals-activation-$BASE_SHA/certificate.json" > candidate-certificate.json
          jq -e --arg base "$BASE_SHA" '.base_sha == $base' candidate-certificate.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_CERTIFICATE_BASE_MISMATCH >&2; exit 1; }
          jq -e '.patch_source == "controller_tree"' candidate-certificate.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_CERTIFICATE_PATCH_SOURCE_INVALID >&2; exit 1; }
          SOURCE_MAIN_SHA="$(jq -er '.source_main_sha' candidate-certificate.json)"
          git merge-base --is-ancestor "$SOURCE_MAIN_SHA" "$GITHUB_SHA" || { echo AGENT_REFERRALS_Q4_DORMANT_SOURCE_MAIN_NOT_ANCESTOR >&2; exit 1; }
          RECONSTRUCTED_SHA="$(node --import tsx commerce/src/controlled-candidate-verify.ts candidate-certificate.json "$GITHUB_SHA")"
          [[ "$RECONSTRUCTED_SHA" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_RECONSTRUCTION_MISMATCH >&2; exit 1; }
          [[ "$(git rev-parse "${RECONSTRUCTED_SHA}^")" == "$BASE_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_PARENT_NOT_Q3 >&2; exit 1; }
          [[ "$(git rev-parse "${RECONSTRUCTED_SHA}^{tree}")" == "$TARGET_TREE" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_TREE_MISMATCH >&2; exit 1; }
          jq -r '.paths[].path' candidate-certificate.json | sort > certified-manifest.txt
          git diff --name-only "$BASE_SHA" "$RECONSTRUCTED_SHA" | sort > actual-changed-paths.txt
          diff certified-manifest.txt actual-changed-paths.txt || { echo AGENT_REFERRALS_Q4_DORMANT_MANIFEST_MISMATCH >&2; exit 1; }
          ! grep -Eq '^(commerce/migrations/|public/legal/|commerce/legal/|\.github/workflows/)' certified-manifest.txt || { echo AGENT_REFERRALS_Q4_DORMANT_FORBIDDEN_CANDIDATE_PATH >&2; exit 1; }
          {
            echo "SOURCE_MAIN_SHA=$SOURCE_MAIN_SHA"
            echo "RECONSTRUCTED_SHA=$RECONSTRUCTED_SHA"
          } >> "$GITHUB_ENV"

      - name: Prove production pointer and immutable Q2 Q3 predecessors
        run: |
          set -euo pipefail
          read_remote_ref() {
            local ref="$1" value
            value="$(git ls-remote --exit-code origin "$ref" | awk '{print $1}')" || return 1
            [[ "$value" =~ ^[a-f0-9]{40}$ ]] || return 1
            printf '%s\n' "$value"
          }
          production_deploy="$(read_remote_ref refs/heads/production-deploy)" || { echo AGENT_REFERRALS_Q4_DORMANT_PRODUCTION_UNAVAILABLE >&2; exit 1; }
          q2_publication="$(read_remote_ref refs/heads/runtime/agent-referrals-1)" || { echo AGENT_REFERRALS_Q4_DORMANT_Q2_PUBLICATION_UNAVAILABLE >&2; exit 1; }
          q3_publication="$(read_remote_ref refs/heads/runtime/agent-referrals-recovery-1)" || { echo AGENT_REFERRALS_Q4_DORMANT_Q3_PUBLICATION_UNAVAILABLE >&2; exit 1; }
          [[ "$q3_publication" == "$BASE_SHA" && "$q2_publication" == "$Q2" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_PREDECESSOR_PUBLICATION_MISMATCH >&2; exit 1; }
          case "$production_deploy" in "$BASE_SHA"|"$TARGET_SHA") ;; *) echo "AGENT_REFERRALS_Q4_DORMANT_PRODUCTION_POINTER_UNEXPECTED=$production_deploy" >&2; exit 1 ;; esac
          echo "OBSERVED_PRODUCTION_DEPLOY=$production_deploy" >> "$GITHUB_ENV"

      - name: Classify exact durable Q4 DORMANT deployment state
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$Q3_RELEASE_ID" > q3-completion.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$Q4_RELEASE_ID" > q4-completion.json
          api "$PUBLIC_API_URL/v1/internal/release-control/resolution/$OLD_Q2_RELEASE_ID" > q2-resolution.json
          jq -e --arg q3 "$BASE_SHA" '.complete == true and .expected.source_commit == $q3' q3-completion.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_Q3_TERMINAL_NOT_PROVEN >&2; exit 1; }
          jq -e --arg q3 "$BASE_SHA" '.complete == false and .resolution == "SUPERSEDED" and .replacement_source_commit == $q3' q2-resolution.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_Q2_SUPERSEDE_NOT_PROVEN >&2; exit 1; }
          q3_inventory="$(git ls-tree -r --name-only "$BASE_SHA" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          q4_inventory="$(git ls-tree -r --name-only "$TARGET_SHA" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          [[ "$q3_inventory" == "$q4_inventory" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_MIGRATION_INVENTORY_CHANGED >&2; exit 1; }
          migration="inventory-sha256:$(printf '%s' "$q4_inventory" | shasum -a 256 | awk '{print $1}')"
          jq -e --arg id "$Q4_RELEASE_ID" --arg source "$TARGET_SHA" --arg migration "$migration" '.runtime as $r | {release_id:$id,mode:"ROLLING",expected:{source_commit:$source,migration:$migration,legal_version:$r.legal_version,legal_manifest_sha256:$r.legal_manifest_sha256,legal_hashes:$r.legal_hashes}}' status.json > q4-release.json
          jq -e '.expected.legal_version != null and .expected.legal_manifest_sha256 != null and .expected.legal_hashes != null' q4-release.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_LEGAL_EVIDENCE_UNAVAILABLE >&2; exit 1; }
          if [[ "$OBSERVED_PRODUCTION_DEPLOY" == "$BASE_SHA" ]]; then
            jq -n --arg id "$Q3_RELEASE_ID" --slurpfile completion q3-completion.json '{release_id:$id,mode:"ROLLING",expected:$completion[0].expected}' > q3-readiness.json
            api -X POST --data-binary @q3-readiness.json "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/dormant-readiness" > q3-readiness-result.json
            jq -e '.ready == true' q3-readiness-result.json >/dev/null || { jq -c '.reasons' q3-readiness-result.json >&2; exit 1; }
          fi
          if jq -e '.complete == true' q4-completion.json >/dev/null; then
            jq -e --slurpfile release q4-release.json '.expected == $release[0].expected' q4-completion.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_TERMINAL_EXPECTATION_MISMATCH >&2; exit 1; }
            [[ "$OBSERVED_PRODUCTION_DEPLOY" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_TERMINAL_POINTER_MISMATCH >&2; exit 1; }
            jq -e --arg q4 "$TARGET_SHA" '.owner_release_id == null and .owner_mode == null and .sales_paused == false and .runtime.source_commit == $q4 and .runtime.worker_source_commit == $q4' status.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_TERMINAL_STATE_MISMATCH >&2; exit 1; }
            api -X POST --data-binary @q4-release.json "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/dormant-readiness" > q4-terminal-readiness.json
            jq -e '.ready == true' q4-terminal-readiness.json >/dev/null || { jq -c '.reasons' q4-terminal-readiness.json >&2; exit 1; }
            echo "DEPLOYMENT_STATE=ALREADY_TERMINALIZED" >> "$GITHUB_ENV"
            exit 0
          fi
          jq -e '.complete == false' q4-completion.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_COMPLETION_STATE_INVALID >&2; exit 1; }
          if [[ "$OBSERVED_PRODUCTION_DEPLOY" == "$BASE_SHA" ]] && jq -e '.owner_release_id == null and .owner_mode == null and .sales_paused == false' status.json >/dev/null; then
            echo "DEPLOYMENT_STATE=FRESH" >> "$GITHUB_ENV"; exit 0
          fi
          if [[ "$OBSERVED_PRODUCTION_DEPLOY" == "$BASE_SHA" ]] && jq -e --arg id "$Q4_RELEASE_ID" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected' status.json >/dev/null; then
            echo "DEPLOYMENT_STATE=OWNED_PRE_CAS" >> "$GITHUB_ENV"; exit 0
          fi
          if [[ "$OBSERVED_PRODUCTION_DEPLOY" == "$TARGET_SHA" ]] && jq -e --arg id "$Q4_RELEASE_ID" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected' status.json >/dev/null; then
            if jq -e --arg q4 "$TARGET_SHA" '.runtime.source_commit == $q4 and .runtime.worker_source_commit == $q4' status.json >/dev/null; then
              api -X POST --data-binary @q4-release.json "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/dormant-readiness" > q4-prepared-readiness.json
              if jq -e '.ready == true' q4-prepared-readiness.json >/dev/null; then echo "DEPLOYMENT_STATE=PREPARED" >> "$GITHUB_ENV"; else echo "DEPLOYMENT_STATE=OWNED_POST_CAS" >> "$GITHUB_ENV"; fi
            else
              echo "DEPLOYMENT_STATE=OWNED_POST_CAS" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          echo AGENT_REFERRALS_Q4_DORMANT_OWNER_STATE_UNEXPECTED >&2; exit 1

      - name: Prove Q4 publication and promotion authority before fresh acquire
        if: env.DEPLOYMENT_STATE == 'FRESH'
        run: |
          set -euo pipefail
          runtime_candidate="$(git ls-remote --exit-code origin refs/heads/runtime-candidate | awk '{print $1}')" || { echo AGENT_REFERRALS_Q4_DORMANT_RUNTIME_CANDIDATE_UNAVAILABLE >&2; exit 1; }
          q4_publication="$(git ls-remote --exit-code origin refs/heads/runtime/agent-referrals-activation-1 | awk '{print $1}')" || { echo AGENT_REFERRALS_Q4_DORMANT_Q4_PUBLICATION_UNAVAILABLE >&2; exit 1; }
          [[ "$runtime_candidate" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_RUNTIME_CANDIDATE_NOT_Q4 >&2; exit 1; }
          [[ "$q4_publication" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_Q4_PUBLICATION_MISMATCH >&2; exit 1; }
          [[ "$(git rev-parse "${TARGET_SHA}^")" == "$BASE_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_Q4_PARENT_NOT_Q3 >&2; exit 1; }

      - name: Acquire exact Q4 ROLLING owner without pausing sales
        if: env.DEPLOYMENT_STATE == 'FRESH'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @q4-release.json "$PUBLIC_API_URL/v1/internal/release-control/acquire" > acquired.json
          jq -e --arg id "$Q4_RELEASE_ID" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected' acquired.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_ACQUIRE_UNEXPECTED_STATE >&2; exit 1; }

      - name: Reconfirm exact Q3 to Q4 CAS authority immediately before pointer transition
        if: env.DEPLOYMENT_STATE == 'FRESH' || env.DEPLOYMENT_STATE == 'OWNED_PRE_CAS'
        run: |
          set -euo pipefail
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$BASE_SHA" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_CAS_PRODUCTION_MISMATCH >&2; exit 1; }
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > pre-cas-status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$Q4_RELEASE_ID" > pre-cas-completion.json
          jq -e --arg id "$Q4_RELEASE_ID" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected' pre-cas-status.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_CAS_OWNER_MISMATCH >&2; exit 1; }
          jq -e '.complete == false' pre-cas-completion.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_CAS_COMPLETION_MISMATCH >&2; exit 1; }

      - name: Guarded Q3 to Q4 production pointer transition
        if: env.DEPLOYMENT_STATE == 'FRESH' || env.DEPLOYMENT_STATE == 'OWNED_PRE_CAS'
        run: scripts/set-production-deploy-ref.sh "$TARGET_SHA" "$BASE_SHA"

      - name: Deploy exact Q4 and wait for all runtime surfaces
        if: env.DEPLOYMENT_STATE != 'PREPARED' && env.DEPLOYMENT_STATE != 'ALREADY_TERMINALIZED'
        run: |
          set -euo pipefail
          scripts/controlled-coolify-deploy.sh "$TARGET_SHA"
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          for _ in $(seq 1 30); do
            if ! api "$PUBLIC_API_URL/v1/internal/release-control/status" > converged-status.json; then sleep 10; continue; fi
            jq -e --arg id "$Q4_RELEASE_ID" --arg q4 "$TARGET_SHA" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected and .runtime.source_commit == $q4 and .runtime.worker_source_commit == $q4' converged-status.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_CONVERGENCE_AUTHORITY_MISMATCH >&2; exit 1; }
            if curl --fail --silent "$PUBLIC_API_URL/healthz" | jq -e '.ok' >/dev/null && curl --fail --silent "$PUBLIC_API_URL/readyz" | jq -e '.ok' >/dev/null && curl --fail --silent "$PUBLIC_FRONTEND_URL/release.json" | jq -e --arg q4 "$TARGET_SHA" '.source_commit == $q4' >/dev/null && curl --fail --silent "$ADMIN_RELEASE_URL" | jq -e --arg q4 "$TARGET_SHA" '.source_commit == $q4' >/dev/null; then exit 0; fi
            sleep 10
          done
          echo AGENT_REFERRALS_Q4_DORMANT_CONVERGENCE_FAILED >&2; exit 1

      - name: Prove unchanged Q4 migration inventory and full Q4 DORMANT readiness
        if: env.DEPLOYMENT_STATE != 'ALREADY_TERMINALIZED'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status-after-deploy.json
          jq -e --arg id "$Q4_RELEASE_ID" --arg q4 "$TARGET_SHA" --slurpfile release q4-release.json '.owner_release_id == $id and .owner_mode == "ROLLING" and .sales_paused == false and .expected == $release[0].expected and .runtime.source_commit == $q4 and .runtime.worker_source_commit == $q4' status-after-deploy.json >/dev/null || { echo AGENT_REFERRALS_Q4_DORMANT_POST_DEPLOY_OWNER_MISMATCH >&2; exit 1; }
          expected_inventory="$(git ls-tree -r --name-only "$TARGET_SHA" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          runtime_inventory="$(jq -r '.runtime.migration_versions | sort | join("\n")' status-after-deploy.json)"
          [[ "$runtime_inventory" == "$expected_inventory" ]] || { echo AGENT_REFERRALS_Q4_DORMANT_RUNTIME_MIGRATION_INVENTORY_MISMATCH >&2; exit 1; }
          ! printf '%s\n' "$runtime_inventory" | grep -Eq '^005[0-9]' || { echo AGENT_REFERRALS_Q4_DORMANT_UNEXPECTED_NEW_MIGRATION >&2; exit 1; }
          for migration in 0042_agent_referrals_agents_rebuild.sql 0043_agent_referrals_foundation.sql 0044_partner_identity.sql 0045_engagement_publication.sql 0046_attribution_reward.sql 0047_act_payment_settlement.sql 0048_ord_reporting.sql 0049_agent_referrals_integration_hardening.sql; do
            jq -e --arg m "$migration" '.runtime.migration_versions | index($m) != null' status-after-deploy.json >/dev/null || { echo "AGENT_REFERRALS_Q4_DORMANT_RUNTIME_MIGRATION_MISSING=$migration" >&2; exit 1; }
            expected_hash="$(git show "$TARGET_SHA:commerce/migrations/$migration" | shasum -a 256 | awk '{print $1}')"
            jq -e --arg m "$migration" --arg hash "$expected_hash" '.runtime.migration_source_hashes[$m] == $hash' status-after-deploy.json >/dev/null || { echo "AGENT_REFERRALS_Q4_DORMANT_RUNTIME_MIGRATION_HASH_MISMATCH=$migration" >&2; exit 1; }
          done
          api -X POST --data-binary @q4-release.json "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/dormant-readiness" > q4-dormant-readiness.json
          jq -e '.ready == true' q4-dormant-readiness.json >/dev/null || { jq -c '.reasons' q4-dormant-readiness.json >&2; exit 1; }
          {
            echo "## Agent Referrals Q3 to Q4 DORMANT deployment"
            echo "- Q4 ROLLING owner remains held: $Q4_RELEASE_ID"
            echo "- Full DORMANT readiness: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
