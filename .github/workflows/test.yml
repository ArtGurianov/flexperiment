name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: flexperiment-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Foundation encrypted SQLite restore prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Independent V2 owner control contract
        run: python3 scripts/v2/test_owner_rpc.py
      - run: pnpm lint
      # Workflow defects used to surface only at dispatch time, which for a
      # deploy path means surfacing in production. actionlint catches the
      # structural ones before merge.
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2
      # apps/lab/next-env.d.ts imports ./.next/types/*.d.ts, which only exist after a
      # build or typegen. Without them that file fails to load, taking its
      # next/image-types/global reference down with it, so a clean checkout
      # reports PageProps/LayoutProps and every image module as missing.
      # Locally these are masked by leftover apps/lab/.next/dev/types from next dev.
      - run: pnpm --filter @flexperiment/lab exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lab:typecheck
      # The root tsconfig EXCLUDES apps/admin, so the line above never saw a
      # single admin/partner component. The admin app carries its own
      # tsconfig (its own jsx/lib/bundler settings) and needs its own
      # invocation - without this, a type error in the operator UI ships.
      - run: pnpm admin:typecheck
      - run: pnpm platform:typecheck
      - run: pnpm test
      - run: pnpm platform:test
      - name: Recovery backup contract
        run: bash deploy/test-recovery-backup.sh
      # The committed SEO snapshot is validated on its own terms, without
      # contacting Commerce. Production-versus-snapshot drift is a real thing
      # to watch, but it is an operational check on its own schedule: gating
      # builds on it would turn an unrelated frontend pull request red the
      # moment an operator edits a date, which trains everyone to ignore the
      # signal. See docs/release/SEO_SURFACE_SNAPSHOT.md.
      - run: pnpm commerce:seo-snapshot:validate
      # CI never built the frontend before this, so nothing ever checked what
      # the static export actually contains - and under `output: "export"` that
      # HTML is the authoritative SEO artifact. Every metadata defect this work
      # fixed was invisible in the TypeScript source and visible only here.
      #
      # Must come after the LAB `next typegen` above, or PageProps<"/events/
      # [slug]"> does not resolve. `pnpm build` refuses a SOURCE_COMMIT that is
      # not exactly 40 lowercase hex characters; github.sha already is one.
      - name: Build the static export
        run: pnpm build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          LAB_ORIGIN: https://lab.flexperiment.ru
      - name: Build the Payload platform
        run: pnpm platform:build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PAYLOAD_SECRET: ci-build-only-not-a-runtime-secret
          PAYLOAD_DATABASE_URL: file:/tmp/flexperiment-platform-ci.sqlite
          PLATFORM_ORIGIN: https://build.invalid
          DEPLOY_ENV: staging
          PAYLOAD_JOBS_ENABLED: "false"
      - name: Static-export conformance
        run: pnpm test:export
      - name: Real-Nginx frontend static-export routing contract
        run: pnpm frontend:test:nginx
      - name: Real-Nginx admin/partner shared-frontend host routing config
        run: pnpm admin:test:nginx
      - name: Reference Caddy deployment topology
        run: pnpm deploy:test:caddyfile

  # Until this existed, nothing in CI built a deployable artifact, and the
  # first thing to ever attempt it was the production deploy itself. That is
  # how a9ea010 reached production with three images that could not be built:
  # a patched dependency is an input to `pnpm install`, so the patch file had
  # to be inside the image before any source was copied, and no Dockerfile
  # copied it. Every check above passed, because none of them build an image.
  #
  # The invariant is not about patches. It is that every deployable Docker
  # artifact of this exact revision is buildable, proved from a clean checkout
  # before the revision can be published as provenance. This job is part of
  # `Test` on purpose: generic publication accepts a successful `Test` run for
  # an exact SHA as its evidence, so the chain reads
  #   exact SHA -> tests -> real production image builds -> Test success
  # rather than leaving the artifact first proved in Coolify.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The three Dockerfiles Coolify builds, with Coolify's own context and
      # no target, so what passes here is what it will run. No registry login,
      # no push, no production secrets: buildability is the whole claim.
      #
      # Layer cache speeds this up without weakening it. A cache key covers
      # the digests of the files an instruction copies, so a context missing a
      # file cannot be served from a run that had it — the exact failure above
      # reproduces here rather than being cached over. The context is always
      # the clean checkout, never the cache.
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            LAB_ORIGIN=https://lab.flexperiment.ru
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: false
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      # docker-compose.commerce.yml declares this same context and Dockerfile
      # for both `commerce` and `commerce-worker`; they share one image and
      # differ only in `command`, so one build covers both. Dockerfile.commerce
      # declares no build args of its own — the ones Coolify injects are
      # runtime configuration it appends, and none are needed to build.
      - name: Commerce image (also runs the worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.commerce
          push: false
          cache-from: type=gha,scope=commerce
          cache-to: type=gha,mode=max,scope=commerce

      # v2 is a separate lineage and two separate runtime applications. These
      # builds prove deployability only; this workflow never publishes a v1 or
      # v2 candidate and never mutates a deployment ref.
      - name: Payload platform v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.platform
          push: false
          load: true
          tags: flexperiment-platform-v2:test
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            PLATFORM_ORIGIN=https://ci.platform.invalid
            YANDEX_WEBMASTER_VERIFICATION=ci-yandex-verification
          cache-from: type=gha,scope=platform-v2
          cache-to: type=gha,mode=max,scope=platform-v2

      - name: Commerce v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.commerce-v2
          push: false
          load: true
          tags: flexperiment-commerce-v2:test
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=commerce-v2
          cache-to: type=gha,mode=max,scope=commerce-v2

      - name: Boot and verify the Payload platform v2 image
        run: >-
          bash scripts/ci/smoke-v2-image.sh
          flexperiment-platform-v2:test platform-v2-smoke 3001 3101 platform
          --env PAYLOAD_SECRET=ci-runtime-only-not-a-production-secret
          --env PAYLOAD_JOBS_ENABLED=false
          --env "PLATFORM_REVALIDATE_TOKEN=${PLATFORM_REVALIDATE_TOKEN}"
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PLATFORM_CANONICAL_ORIGIN: https://ci.platform.invalid
          PLATFORM_REVALIDATE_TOKEN: ci-rendered-server-revalidation-token

      - name: Boot and verify the Commerce v2 image
        run: >-
          bash scripts/ci/smoke-v2-image.sh
          flexperiment-commerce-v2:test commerce-v2-smoke 3002 3102 commerce-v2
          --env DEPLOY_ENV=staging
          --env PAYMENT_MODE=disabled
          --env BETTER_AUTH_SECRET=ci-runtime-better-auth-secret-not-for-production
          --env AUTH_EMAIL_OUTBOX_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          --env PLATFORM_ORIGIN=http://127.0.0.1:3101
          --env LAB_ORIGIN=http://127.0.0.1:3100
          --env ADMIN_ORIGIN=http://127.0.0.1:3103
          --env API_ORIGIN=http://127.0.0.1:3102
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Commerce V2 foundation — actual image, restart, replacement and encrypted restore
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          bash scripts/ci/smoke-v2-foundation.sh flexperiment-commerce-v2:test
        env:
          SOURCE_COMMIT: ${{ github.sha }}
