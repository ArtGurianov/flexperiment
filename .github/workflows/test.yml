name: Test

on:
  pull_request:
  push:
  workflow_dispatch: {}

concurrency:
  group: flexperiment-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Real-Nginx frontend static-export routing contract
        run: pnpm frontend:test:nginx
      - name: Real-Nginx admin dynamic-upstream config
        run: pnpm admin:test:nginx
