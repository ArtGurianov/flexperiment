name: BREAK GLASS - runtime candidate repair

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact published runtime-candidate commit SHA to promote.
        required: true
        type: string
      expected_runtime_candidate_sha:
        description: Exact current runtime-candidate SHA required for the CAS update.
        required: true
        type: string
      expected_production_deploy_sha:
        description: Exact current production-deploy SHA required as topology evidence.
        required: true
        type: string
      reason:
        description: Why the candidate is diverged and why repair is the correct response. Recorded as audit.
        required: true
        type: string
      incident_reference:
        description: Incident or run reference this repair belongs to. Recorded as audit.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-break-glass
    timeout-minutes: 10
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha }}
      INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA: ${{ inputs.expected_runtime_candidate_sha }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha }}
      INPUT_REASON: ${{ inputs.reason }}
      INPUT_INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
      RUNTIME_CANDIDATE_REF_TOKEN: ${{ secrets.RUNTIME_CANDIDATE_REF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind dedicated candidate-ref credential
        run: |
          set -euo pipefail
          [[ -n "$RUNTIME_CANDIDATE_REF_TOKEN" ]] || { echo "RUNTIME_CANDIDATE_REF_TOKEN_REQUIRED" >&2; exit 1; }
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RUNTIME_CANDIDATE_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Assert exact current main controller and validate immutable inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_CONTROLLER_NOT_MAIN" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_CONTROLLER_MAIN_MOVED" >&2; exit 1; }
          [[ "$INPUT_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_TARGET_SHA_INVALID" >&2; exit 1; }
          [[ "$INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_EXPECTED_RUNTIME_CANDIDATE_SHA_INVALID" >&2; exit 1; }
          [[ "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_EXPECTED_PRODUCTION_DEPLOY_SHA_INVALID" >&2; exit 1; }
          [[ "$INPUT_REASON" =~ ^[[:print:]]{1,240}$ ]] || { echo "RUNTIME_CANDIDATE_PROMOTION_REASON_INVALID" >&2; exit 1; }
          [[ "$INPUT_INCIDENT_REFERENCE" =~ ^[[:print:]]{1,240}$ ]] || { echo "RUNTIME_CANDIDATE_REPAIR_INCIDENT_REFERENCE_INVALID" >&2; exit 1; }

      - name: Resolve exact remote refs and prove ordinary promotion topology
        run: |
          set -euo pipefail
          actual_runtime_candidate="$(git ls-remote --exit-code origin refs/heads/runtime-candidate | awk '{print $1}')"
          actual_production_deploy="$(git ls-remote --exit-code origin refs/heads/production-deploy | awk '{print $1}')"
          [[ "$actual_runtime_candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "RUNTIME_CANDIDATE_REMOTE_REF_INVALID" >&2; exit 1; }
          [[ "$actual_production_deploy" =~ ^[0-9a-f]{40}$ ]] || { echo "PRODUCTION_DEPLOY_REMOTE_REF_INVALID" >&2; exit 1; }
          [[ "$actual_runtime_candidate" == "$INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA" ]] || { echo "RUNTIME_CANDIDATE_CAS_MISMATCH=$actual_runtime_candidate" >&2; exit 1; }
          [[ "$actual_production_deploy" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo "PRODUCTION_DEPLOY_CAS_MISMATCH=$actual_production_deploy" >&2; exit 1; }
          git fetch --no-tags origin \
            refs/heads/runtime-candidate:refs/remotes/origin/runtime-candidate \
            refs/heads/production-deploy:refs/remotes/origin/production-deploy \
            '+refs/heads/runtime/*:refs/remotes/origin/runtime/*'
          [[ "$(git rev-parse origin/runtime-candidate)" == "$actual_runtime_candidate" ]] || { echo "RUNTIME_CANDIDATE_REMOTE_FETCH_MISMATCH" >&2; exit 1; }
          [[ "$(git rev-parse origin/production-deploy)" == "$actual_production_deploy" ]] || { echo "PRODUCTION_DEPLOY_REMOTE_FETCH_MISMATCH" >&2; exit 1; }
          git cat-file -e "$INPUT_TARGET_SHA^{commit}" || { echo "RUNTIME_CANDIDATE_TARGET_NOT_COMMIT" >&2; exit 1; }
          candidate_source_branch="$(git for-each-ref --format='%(refname:short)' --contains "$INPUT_TARGET_SHA" 'refs/remotes/origin/runtime/*' | head -n 1)"
          [[ -n "$candidate_source_branch" ]] || { echo "RUNTIME_CANDIDATE_TARGET_NOT_PUBLISHED_RUNTIME_BRANCH" >&2; exit 1; }
          # Repair relaxes exactly the two assertions about the *current*
          # candidate, because the current candidate is what is broken. It
          # waives nothing else: the target must still descend from
          # production-deploy, still come from a published runtime/* branch,
          # and still pass the same lease-backed CAS.
          git merge-base --is-ancestor "$actual_production_deploy" "$INPUT_TARGET_SHA" || { echo "RUNTIME_CANDIDATE_TARGET_NOT_DESCENDANT_OF_PRODUCTION" >&2; exit 1; }
          # Self-disabling: refused on a healthy candidate, so this can never
          # become a general force primitive or a fallback for the ordinary path.
          if git merge-base --is-ancestor "$actual_production_deploy" "$actual_runtime_candidate"; then
            echo "RUNTIME_CANDIDATE_REPAIR_NOT_DIVERGED" >&2
            exit 1
          fi
          [[ "$INPUT_TARGET_SHA" != "$actual_runtime_candidate" ]] || { echo "RUNTIME_CANDIDATE_TARGET_ALREADY_CURRENT" >&2; exit 1; }
          {
            echo "ACTUAL_RUNTIME_CANDIDATE=$actual_runtime_candidate"
            echo "ACTUAL_PRODUCTION_DEPLOY=$actual_production_deploy"
            echo "CANDIDATE_SOURCE_BRANCH=$candidate_source_branch"
          } >> "$GITHUB_ENV"

      - name: Reconfirm exact CAS inputs immediately before promotion
        run: |
          set -euo pipefail
          current_runtime_candidate="$(git ls-remote --exit-code origin refs/heads/runtime-candidate | awk '{print $1}')"
          current_production_deploy="$(git ls-remote --exit-code origin refs/heads/production-deploy | awk '{print $1}')"
          [[ "$current_runtime_candidate" == "$INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA" ]] || { echo "RUNTIME_CANDIDATE_CAS_MISMATCH=$current_runtime_candidate" >&2; exit 1; }
          [[ "$current_production_deploy" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo "PRODUCTION_DEPLOY_CAS_MISMATCH=$current_production_deploy" >&2; exit 1; }
          git fetch --no-tags origin \
            refs/heads/runtime-candidate:refs/remotes/origin/runtime-candidate \
            refs/heads/production-deploy:refs/remotes/origin/production-deploy
          [[ "$(git rev-parse origin/runtime-candidate)" == "$current_runtime_candidate" ]] || { echo "RUNTIME_CANDIDATE_PRE_CAS_FETCH_MISMATCH" >&2; exit 1; }
          [[ "$(git rev-parse origin/production-deploy)" == "$current_production_deploy" ]] || { echo "PRODUCTION_DEPLOY_PRE_CAS_FETCH_MISMATCH" >&2; exit 1; }

      - name: Attempt runtime-candidate lease-backed CAS
        run: |
          set -uo pipefail
          set +e
          git push --force-with-lease="refs/heads/runtime-candidate:${INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA}" origin "${INPUT_TARGET_SHA}:refs/heads/runtime-candidate"
          cas_push_rc=$?
          set -e
          echo "CAS_PUSH_RC=$cas_push_rc" >> "$GITHUB_ENV"

      - name: Reconcile authoritative post-CAS refs and write audit summary
        run: |
          set -euo pipefail
          read_remote_ref() {
            local ref="$1" value
            value="$(git ls-remote --exit-code origin "$ref" | awk '{print $1}')" || return 1
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || return 1
            printf '%s\n' "$value"
          }
          runtime_candidate_after="$(read_remote_ref refs/heads/runtime-candidate)" || { echo "RUNTIME_CANDIDATE_PROMOTION_POST_STATE_UNAVAILABLE" >&2; exit 1; }
          production_deploy_after="$(read_remote_ref refs/heads/production-deploy)" || { echo "RUNTIME_CANDIDATE_PROMOTION_POST_STATE_UNAVAILABLE" >&2; exit 1; }
          if [[ "$runtime_candidate_after" == "$INPUT_TARGET_SHA" && "$production_deploy_after" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]]; then
            cas_outcome=SUCCESS
          elif [[ "$runtime_candidate_after" == "$INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA" && "$production_deploy_after" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]]; then
            echo "CAS_PUSH_NOT_APPLIED" >&2
            exit 1
          else
            echo "POST_CAS_AUTHORITY_UNEXPECTED runtime-candidate=$runtime_candidate_after production-deploy=$production_deploy_after" >&2
            exit 1
          fi
          {
            echo "## BREAK GLASS - runtime candidate repair"
            echo ""
            echo "This is not an ordinary lifecycle action. It ran because the"
            echo "candidate ref no longer descended from production-deploy."
            echo ""
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "- Incident reference: $INPUT_INCIDENT_REFERENCE"
            echo "- Controller SHA: $CONTROLLER_SHA"
            echo "- Reason: $INPUT_REASON"
            echo "- Production deploy before: $ACTUAL_PRODUCTION_DEPLOY"
            echo "- Runtime candidate before: $ACTUAL_RUNTIME_CANDIDATE"
            echo "- Target SHA: $INPUT_TARGET_SHA"
            echo "- Candidate source branch: $CANDIDATE_SOURCE_BRANCH"
            echo "- Runtime candidate after: $runtime_candidate_after"
            echo "- Production deploy after: $production_deploy_after"
            echo "- Topology checks: PASS"
            echo "- Lease-backed CAS outcome: $cas_outcome (transport rc: $CAS_PUSH_RC)"
          } >> "$GITHUB_STEP_SUMMARY"
