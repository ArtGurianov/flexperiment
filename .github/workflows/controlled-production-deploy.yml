name: Controlled production deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Manual recovery only - exact paused same-owner deployment SHA to recover. Leave empty for an ordinary deploy of the current runtime-candidate.
        required: false
        type: string
      expected_candidate_sha:
        description: Required exact runtime-candidate SHA for an ordinary deploy. Leave empty only for explicit same-owner recovery.
        required: false
        type: string
      expected_controller_sha:
        description: Required reviewed controller SHA for an ordinary deploy. Leave empty only for explicit same-owner recovery.
        required: false
        type: string
      expected_controller_tree:
        description: Required reviewed controller tree for an ordinary deploy. Leave empty only for explicit same-owner recovery.
        required: false
        type: string
      expected_production_deploy_sha:
        description: Required exact production-deploy SHA to lease from for an ordinary deploy. Leave empty only for explicit same-owner recovery.
        required: false
        type: string
  workflow_call:
    inputs:
      target_sha:
        required: false
        type: string
      expected_candidate_sha:
        required: false
        type: string
      expected_controller_sha:
        required: false
        type: string
      expected_controller_tree:
        required: false
        type: string
      expected_production_deploy_sha:
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
      # This controller's own commit. It MUST NEVER be used as the deployment
      # candidate, source_commit, Coolify target, or release acquire target -
      # see "main is never an implicit deploy target" in
      # docs/release/DEPLOYMENT_INVARIANTS.md.
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha || '' }}
      INPUT_EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha || '' }}
      INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha || '' }}
      INPUT_EXPECTED_CONTROLLER_TREE: ${{ inputs.expected_controller_tree || '' }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha || '' }}
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"
      POLL_CONNECT_TIMEOUT: "3"
      POLL_MAX_TIME: "7"
      INITIAL_READINESS_DELAY_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/controlled-production-deploy
