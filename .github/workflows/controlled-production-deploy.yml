name: Controlled production deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Manual recovery only - exact paused same-owner deployment SHA to recover. Leave empty for an ordinary deploy of the current runtime-candidate.
        required: false
        type: string
      expected_candidate_sha:
        description: Optional defensive check for an ordinary (non-recovery) deploy - if set, must equal the exact SHA currently at runtime-candidate, or the run refuses.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
      # This controller's own commit. It MUST NEVER be used as the deployment
      # candidate, source_commit, Coolify target, or release acquire target -
      # see "main is never an implicit deploy target" in
      # docs/release/DEPLOYMENT_INVARIANTS.md.
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha || '' }}
      INPUT_EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha || '' }}
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"
      POLL_CONNECT_TIMEOUT: "3"
      POLL_MAX_TIME: "7"
      INITIAL_READINESS_DELAY_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert this controller is exact, current main
        # main is trusted deployment-controller code; runtime-candidate is an
        # untrusted/read-only candidate object. A workflow_dispatch can be
        # run from any ref, so this must be proven explicitly - unlike the
        # old push-to-main trigger, dispatch does not itself guarantee it.
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "DEPLOY_CONTROLLER_NOT_MAIN" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo "DEPLOY_CONTROLLER_MAIN_MOVED" >&2; exit 1; }

      - name: Read current production-deploy pointer
        run: |
          set -euo pipefail
          production_deploy_sha="$(scripts/read-production-deploy-ref.sh)"
          git fetch --no-tags origin "$production_deploy_sha"
          echo "PRODUCTION_DEPLOY_SHA=$production_deploy_sha" >> "$GITHUB_ENV"

      - name: Resolve controller and immutable deployment target
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TARGET_SHA" ]]; then
            # Manual recovery of an already-owned, already-paused same-owner
            # deployment, under its own separate authority (see the
            # RECOVERY_MODE==1 precondition below).
            [[ "$INPUT_TARGET_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'GENERIC_DEPLOY_MANUAL_RECOVERY_TARGET_INVALID' >&2; exit 1; }
            target_sha="${INPUT_TARGET_SHA,,}"
            recovery_mode=1
          else
            # Ordinary controlled deploy: the candidate authority is the
            # dedicated runtime-candidate ref. This is never $GITHUB_SHA -
            # that is this controller's own commit, a distinct identity.
            git fetch --no-tags origin runtime-candidate
            target_sha="$(git rev-parse origin/runtime-candidate)"
            if [[ -n "$INPUT_EXPECTED_CANDIDATE_SHA" ]]; then
              [[ "${INPUT_EXPECTED_CANDIDATE_SHA,,}" == "$target_sha" ]] || { echo "RUNTIME_CANDIDATE_UNEXPECTED_SHA=$target_sha" >&2; exit 1; }
            fi
            recovery_mode=0
          fi
          [[ "$target_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'GENERIC_DEPLOY_INVALID_SOURCE_COMMIT' >&2; exit 1; }
          git fetch --no-tags origin "$target_sha"
          git cat-file -e "$target_sha^{commit}" || { echo 'GENERIC_DEPLOY_TARGET_NOT_IN_REPOSITORY' >&2; exit 1; }
          candidate_contract_path="$RUNNER_TEMP/generic-deploy-release-surface-contract.json"
          candidate_manifest_path="$RUNNER_TEMP/generic-deploy-production-manifest.json"
          git show "$target_sha:release-surface-contract.json" > "$candidate_contract_path"
          git show "$target_sha:commerce/legal/production-manifest.json" > "$candidate_manifest_path"
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"
          echo "RELEASE_ID=deploy-$target_sha" >> "$GITHUB_ENV"
          echo "RECOVERY_MODE=$recovery_mode" >> "$GITHUB_ENV"
          echo "CANDIDATE_CONTRACT_PATH=$candidate_contract_path" >> "$GITHUB_ENV"
          echo "CANDIDATE_MANIFEST_PATH=$candidate_manifest_path" >> "$GITHUB_ENV"

      - name: Assert runtime-candidate topology
        # A recovery (workflow_dispatch) resumes an already-owned, already-
        # paused same-owner deployment under its own separate authority and
        # may target a SHA that predates the current production-deploy tip;
        # it explicitly waives the descendant/maintenance-lineage rule below.
        if: env.RECOVERY_MODE == '0'
        run: |
          set -euo pipefail
          scripts/inspect-runtime-candidate-topology.sh --production-deploy "$PRODUCTION_DEPLOY_SHA" --candidate "$TARGET_SHA" > topology.json
          jq -e '.candidate_is_descendant_of_production_deploy == true' topology.json >/dev/null || { echo "RUNTIME_CANDIDATE_NOT_DESCENDANT_OF_PRODUCTION_DEPLOY" >&2; exit 1; }
          jq -e '(.maintenance_commits_in_range | length) == 0' topology.json >/dev/null || { jq -c '.maintenance_commits_in_range' topology.json >&2; echo "RUNTIME_CANDIDATE_CONTAINS_MAINTENANCE_COMMIT" >&2; exit 1; }
          jq -e '(.merge_commits_in_range | length) == 0' topology.json >/dev/null || { jq -c '.merge_commits_in_range' topology.json >&2; echo "RUNTIME_CANDIDATE_NOT_LINEAR" >&2; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Preflight immutable generic-deploy boundaries
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "GENERIC_DEPLOY_INVALID_SOURCE_COMMIT" >&2; exit 1; }
          [[ "$RELEASE_ID" == "deploy-$TARGET_SHA" ]] || { echo "GENERIC_DEPLOY_INVALID_RELEASE_ID" >&2; exit 1; }
          checkout_contract_version="$(jq -er '.checkout_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' "$CANDIDATE_CONTRACT_PATH")" || { echo "GENERIC_DEPLOY_CHECKOUT_CONTRACT_VERSION_INVALID" >&2; exit 1; }
          admin_contract_version="$(jq -er '.admin_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' "$CANDIDATE_CONTRACT_PATH")" || { echo "GENERIC_DEPLOY_ADMIN_CONTRACT_VERSION_INVALID" >&2; exit 1; }
          echo "CHECKOUT_CONTRACT_VERSION=$checkout_contract_version" >> "$GITHUB_ENV"
          echo "ADMIN_CONTRACT_VERSION=$admin_contract_version" >> "$GITHUB_ENV"
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          validate_json() {
            local file="$1" label="$2" bytes
            if ! jq -e 'type == "object"' "$file" >/dev/null 2>&1; then
              echo "${label}_INVALID_JSON" >&2
              bytes="$(wc -c < "$file")"
              echo "${label}_BYTES=$bytes" >&2
              printf '%s_PREFIX_HEX=' "$label" >&2
              LC_ALL=C od -An -tx1 -N64 "$file" | tr -d ' \n' >&2
              echo >&2
              exit 1
            fi
            echo "${label}_JSON=PASS"
          }
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > durable-before.json
          validate_json durable-before.json DURABLE_BEFORE
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          validate_json completion.json COMPLETION
          owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
          if [[ "$RECOVERY_MODE" == 1 ]]; then
            jq -e --arg release_id "$RELEASE_ID" --arg source_commit "$TARGET_SHA" '
              .sales_paused == true and
              .owner_release_id == $release_id and
              .owner_mode == "CONTROLLED_CUTOVER" and
              .expected.source_commit == $source_commit
            ' durable-before.json >/dev/null &&
              jq -e '.complete == false' completion.json >/dev/null || {
                echo "GENERIC_DEPLOY_MANUAL_RECOVERY_STATE_INVALID" >&2
                exit 1
              }
          fi
          if ! jq -e '.complete' completion.json >/dev/null; then
            [[ -z "$owner" || "$owner" == "$RELEASE_ID" ]] || { echo "GENERIC_DEPLOY_BLOCKED_BY_RELEASE_OWNER=$owner" >&2; exit 1; }
          fi
          git fetch origin runtime-candidate
          if ! jq -e '.complete' completion.json >/dev/null && [[ -z "$owner" ]]; then
            [[ "$(git rev-parse origin/runtime-candidate)" == "$TARGET_SHA" ]] || { echo "GENERIC_DEPLOY_TARGET_IS_NOT_RUNTIME_CANDIDATE_HEAD" >&2; exit 1; }
          fi
          production_source="$(jq -er '.runtime.source_commit' durable-before.json)"
          [[ "$production_source" =~ ^[a-f0-9]{40}$ ]] || { echo "GENERIC_DEPLOY_PRODUCTION_SOURCE_UNAVAILABLE" >&2; exit 1; }
          git cat-file -e "$production_source^{commit}" || { echo "GENERIC_DEPLOY_PRODUCTION_SOURCE_NOT_IN_REPOSITORY" >&2; exit 1; }
          git diff --name-only -z "$production_source" "$TARGET_SHA" -- commerce/migrations commerce/legal public/legal release-surface-contract.json > generic-deploy-boundary-paths.bin
          pnpm commerce:production-deploy:assert-boundary generic-deploy-boundary-paths.bin
          migration_inventory="$(jq -er '
            .runtime.migration_versions |
            if type == "array" and length > 0 and all(.[]; type == "string") then sort | join("\n")
            else error("GENERIC_DEPLOY_PRODUCTION_BASELINE_INVALID")
            end
          ' durable-before.json)"
          source_migration_inventory="$(git ls-tree -r --name-only "$production_source" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          [[ -n "$source_migration_inventory" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_INVENTORY_EMPTY" >&2; exit 1; }
          [[ "$migration_inventory" == "$source_migration_inventory" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_INVENTORY_MISMATCH" >&2; exit 1; }
          migration_inventory_sha256="$(printf %s "$migration_inventory" | shasum -a 256 | awk '{ print $1 }')"
          echo "MIGRATION_INVENTORY_SHA256=$migration_inventory_sha256"
          durable_migration="$(jq -er '.expected.migration | select(type == "string" and test("^[0-9]{4}_.+\\.sql$"))' durable-before.json)"
          [[ -n "$durable_migration" ]] || { echo "GENERIC_DEPLOY_PRODUCTION_MIGRATION_EXPECTATION_INVALID" >&2; exit 1; }
          jq -e --arg release_id "$RELEASE_ID" --arg source_commit "$TARGET_SHA" --arg migration "$durable_migration" '
            .runtime as $runtime |
            if
              ($runtime.legal_version | type == "string") and
              ($runtime.legal_manifest_sha256 | type == "string") and
              ($runtime.legal_hashes | type == "object") and
              ($runtime.current_legal_copies_match == true)
            then {
              release_id: $release_id,
              mode: "CONTROLLED_CUTOVER",
              expected: {
                source_commit: $source_commit,
                migration: $migration,
                legal_version: $runtime.legal_version,
                legal_manifest_sha256: $runtime.legal_manifest_sha256,
                legal_hashes: $runtime.legal_hashes
              }
            }
            else error("GENERIC_DEPLOY_PRODUCTION_BASELINE_INVALID")
            end
          ' durable-before.json > release.json
          validate_json release.json RELEASE_REQUEST
          validate_json "$CANDIDATE_MANIFEST_PATH" CANDIDATE_LEGAL_MANIFEST
          manifest_source_sha="$(shasum -a 256 "$CANDIDATE_MANIFEST_PATH" | awk '{ print $1 }')"
          manifest_publish_time="$(jq -er '.publish_time' "$CANDIDATE_MANIFEST_PATH")"
          jq -e --slurpfile request release.json --arg source_sha "$manifest_source_sha" --arg publish_time "$manifest_publish_time" '
            .runtime as $runtime | $request[0].expected as $expected |
            $runtime.legal_version == $expected.legal_version and
            $runtime.legal_manifest_sha256 == $expected.legal_manifest_sha256 and
            $runtime.legal_hashes == $expected.legal_hashes and
            $runtime.current_legal_copies_match == true and
            $runtime.source_legal_manifest_sha256 == $source_sha and
            $runtime.source_legal_publish_time == $publish_time
          ' durable-before.json >/dev/null || { echo "GENERIC_DEPLOY_LEGAL_RUNTIME_BASELINE_MISMATCH" >&2; exit 1; }
          jq -e --slurpfile request release.json '
            . as $candidate | $request[0].expected as $expected |
            $candidate.version == $expected.legal_version and
            {
              PUBLIC_OFFER: $candidate.documents.PUBLIC_OFFER.sha256,
              PRIVACY_POLICY: $candidate.documents.PRIVACY_POLICY.sha256,
              PD_CONSENT: $candidate.documents.PD_CONSENT.sha256,
              CHECKOUT_DISCLOSURE: $candidate.documents.CHECKOUT_DISCLOSURE.sha256
            } == $expected.legal_hashes
          ' "$CANDIDATE_MANIFEST_PATH" >/dev/null || { echo "GENERIC_DEPLOY_LEGAL_CANONICAL_MANIFEST_MISMATCH" >&2; exit 1; }
          if ! jq -e '.complete' completion.json >/dev/null; then
            if [[ "$owner" == "$RELEASE_ID" ]]; then
              jq -e --slurpfile request release.json '.expected == ($request[0].expected | del(.legal_hashes))' durable-before.json >/dev/null || { echo "GENERIC_DEPLOY_OWNER_EXPECTATIONS_MISMATCH" >&2; exit 1; }
            fi
          fi
          if ! jq -e '.complete' completion.json >/dev/null && \
            [[ "$owner" == "$RELEASE_ID" ]] && \
            jq -e --arg source "$TARGET_SHA" '
              .sales_paused == true and
              .owner_mode == "CONTROLLED_CUTOVER" and
              .expected.source_commit == $source
            ' durable-before.json >/dev/null; then
            echo 'REUSING_PAUSED_OWNER=1' >> "$GITHUB_ENV"
          else
            echo 'REUSING_PAUSED_OWNER=0' >> "$GITHUB_ENV"
          fi
          pnpm exec tsx commerce/src/reconcile-generic-production-deploy.ts durable-before.json completion.json release.json > reconciliation.json
          validate_json reconciliation.json RECONCILIATION
          action="$(jq -er '.action' reconciliation.json)"
          [[ "$action" != "BLOCKED" ]] || { jq -c . reconciliation.json >&2; exit 1; }
          echo "DEPLOY_ACTION=$action" >> "$GITHUB_ENV"

      - name: Verify an already completed deployment
        if: env.DEPLOY_ACTION == 'RELEASE_ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          node --import tsx commerce/src/assert-generic-production-deploy-ready.ts status.json release.json open
          jq -e --slurpfile request release.json '.complete and .expected == $request[0].expected' completion.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/legal-config" > legal.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/healthz" | jq -e '.ok' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/readyz" | jq -e '.ok' >/dev/null
          jq -e --arg sha "$TARGET_SHA" --arg contract "$CHECKOUT_CONTRACT_VERSION" '.source_commit == $sha and .checkout_contract_version == $contract' frontend.json >/dev/null
          jq -e --arg sha "$TARGET_SHA" --arg contract "$ADMIN_CONTRACT_VERSION" '.source_commit == $sha and .admin_contract_version == $contract' admin.json >/dev/null
          jq -e --slurpfile request release.json '
            (.version == $request[0].expected.legal_version) and
            ({
              PUBLIC_OFFER: .manifest.documents.PUBLIC_OFFER.sha256,
              PRIVACY_POLICY: .manifest.documents.PRIVACY_POLICY.sha256,
              PD_CONSENT: .manifest.documents.PD_CONSENT.sha256,
              CHECKOUT_DISCLOSURE: .manifest.documents.CHECKOUT_DISCLOSURE.sha256
            } == $request[0].expected.legal_hashes)
          ' legal.json >/dev/null

      - name: Reconfirm runtime-candidate has not moved since preflight
        # Freshness matters only up to the first durable mutation: once
        # acquire/pause has actually run (recovery, or a rerun reusing an
        # already-paused owner), the durable owner is authoritative and
        # runtime-candidate is free to move again without stranding it.
        if: env.RECOVERY_MODE == '0' && env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE' && env.REUSING_PAUSED_OWNER != '1'
        run: |
          set -euo pipefail
          git fetch --no-tags origin runtime-candidate
          current_candidate_sha="$(git rev-parse origin/runtime-candidate)"
          [[ "$current_candidate_sha" == "$TARGET_SHA" ]] || { echo "RUNTIME_CANDIDATE_MOVED_SINCE_PREFLIGHT" >&2; exit 1; }

      - name: Acquire owner and pause registrations
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE' && env.REUSING_PAUSED_OWNER != '1'
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/acquire" > /dev/null
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/pause" > paused.json
          jq -e '.sales_paused and .owner_release_id == env.RELEASE_ID' paused.json >/dev/null

      - name: Prove public checkout pause before deployment
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          pause_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output paused-checkout.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Idempotency-Key: pause-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --data '{}' "$PUBLIC_API_URL/v1/public/checkouts")"
          [[ "$pause_status" == "503" ]] || { cat paused-checkout.json >&2; exit 1; }
          jq -e '.error.code == "SALES_TEMPORARILY_PAUSED"' paused-checkout.json >/dev/null

      - name: Reconcile paused deployment
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          pnpm exec tsx commerce/src/reconcile-generic-production-deploy.ts status.json completion.json release.json > reconciliation.json
          jq -e 'type == "object"' reconciliation.json >/dev/null || { echo "RECONCILIATION_INVALID_JSON" >&2; exit 1; }
          action="$(jq -er '.action' reconciliation.json)"
          [[ "$action" == "DEPLOY" || "$action" == "VERIFY_AND_REOPEN" ]] || { jq -c . reconciliation.json >&2; exit 1; }
          echo "DEPLOY_ACTION=$action" >> "$GITHUB_ENV"

      - name: Reconfirm production-deploy has not moved since preflight
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          current_production_deploy_sha="$(scripts/read-production-deploy-ref.sh)"
          [[ "$current_production_deploy_sha" == "$PRODUCTION_DEPLOY_SHA" ]] || { echo "PRODUCTION_DEPLOY_MOVED_SINCE_PREFLIGHT" >&2; exit 1; }

      - name: Set guarded production deployment ref
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        run: scripts/set-production-deploy-ref.sh "$TARGET_SHA"

      - name: Deploy exact production candidate
        if: env.DEPLOY_ACTION == 'DEPLOY'
        run: |
          set -euo pipefail
          scripts/controlled-coolify-deploy.sh "$TARGET_SHA"
          echo 'COOLIFY_DEPLOY_DISPATCHED=1' >> "$GITHUB_ENV"

      - name: Prove all surfaces and guarded reopen
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          if [[ "${COOLIFY_DEPLOY_DISPATCHED:-0}" == "1" ]]; then
            [[ "$INITIAL_READINESS_DELAY_SECONDS" =~ ^[0-9]+$ ]] || { echo "INITIAL_READINESS_DELAY_CONFIGURATION_INVALID" >&2; exit 1; }
            echo "Allowing Coolify deployments to start for ${INITIAL_READINESS_DELAY_SECONDS}s..."
            sleep "$INITIAL_READINESS_DELAY_SECONDS"
          fi
          scripts/controlled-production-readiness.sh release.json
          api -X POST -H 'Content-Type: application/json' --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/reopen" > reopened.json
          jq -e '.sales_paused == false and .owner_release_id == null and .owner_mode == null' reopened.json >/dev/null

      - name: Verify post-reopen completion and all production surfaces
        if: env.DEPLOY_ACTION != 'RELEASE_ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" "$@"; }
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          node --import tsx commerce/src/assert-generic-production-deploy-ready.ts status.json release.json open
          jq -e --slurpfile request release.json '.complete and .expected == $request[0].expected' completion.json >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/legal-config" > legal.json
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/healthz" | jq -e '.ok' >/dev/null
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/readyz" | jq -e '.ok' >/dev/null
          jq -e --arg sha "$TARGET_SHA" --arg contract "$CHECKOUT_CONTRACT_VERSION" '.source_commit == $sha and .checkout_contract_version == $contract' frontend.json >/dev/null
          jq -e --arg sha "$TARGET_SHA" --arg contract "$ADMIN_CONTRACT_VERSION" '.source_commit == $sha and .admin_contract_version == $contract' admin.json >/dev/null
          jq -e --slurpfile request release.json '
            (.version == $request[0].expected.legal_version) and
            ({
              PUBLIC_OFFER: .manifest.documents.PUBLIC_OFFER.sha256,
