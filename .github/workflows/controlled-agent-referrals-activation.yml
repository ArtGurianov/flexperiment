name: Controlled Agent Referrals Q6 activation

# The only controller that may invoke Q6's DORMANT -> ACTIVE HTTP authority.
# It never deploys, terminalizes, or mutates a Git ref.
on:
  workflow_dispatch:
    inputs:
      expected_controller_sha: { required: true, type: string }
      expected_controller_tree: { required: true, type: string }
      expected_q6_sha: { required: true, type: string }
      expected_q6_publication_ref: { required: true, type: string }
      expected_feature_revision: { required: true, type: string }

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      TARGET_SHA: fa3b4aa5651956bb0a35f7a843e95423f057824b
      RELEASE_ID: deploy-fa3b4aa5651956bb0a35f7a843e95423f057824b
      ACTIVATION_ID: agent-referrals-activation-fa3b4aa5651956bb0a35f7a843e95423f057824b
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      EXPECTED_CONTROLLER_TREE: ${{ inputs.expected_controller_tree }}
      EXPECTED_Q6_SHA: ${{ inputs.expected_q6_sha }}
      EXPECTED_Q6_PUBLICATION_REF: ${{ inputs.expected_q6_publication_ref }}
      EXPECTED_FEATURE_REVISION: ${{ inputs.expected_feature_revision }}
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind initial exact current main controller
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$EXPECTED_CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_CONTROLLER_TREE" =~ ^[a-f0-9]{40}$ && "$EXPECTED_Q6_SHA" == "$TARGET_SHA" && "$EXPECTED_Q6_PUBLICATION_REF" == refs/heads/runtime/agent-referrals-activation-terminal-identity-1 && "$EXPECTED_FEATURE_REVISION" =~ ^[0-9]+$ ]] || { echo AGENT_REFERRALS_ACTIVATION_INPUT_INVALID >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo AGENT_REFERRALS_ACTIVATION_CONTROLLER_MAIN_MOVED >&2; exit 1; }

      - name: Prove exact Q6 terminal and classify activation state
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status-before.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-before.json
          api "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activation-state" > activation-before.json
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_ACTIVATION_PRODUCTION_NOT_Q6 >&2; exit 1; }
          git fetch --no-tags origin runtime-candidate
          [[ "$(git rev-parse origin/runtime-candidate)" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_ACTIVATION_CANDIDATE_NOT_Q6 >&2; exit 1; }
          [[ "$(git ls-remote --exit-code origin "$EXPECTED_Q6_PUBLICATION_REF" | awk 'NF == 2 { print $1 }')" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_ACTIVATION_PUBLICATION_NOT_Q6 >&2; exit 1; }
          jq -e --arg source "$TARGET_SHA" '.complete == true and .expected.source_commit == $source and .expected.migration != null and .expected.legal_version != null and .expected.legal_manifest_sha256 != null and .expected.legal_hashes != null' completion-before.json >/dev/null || { echo AGENT_REFERRALS_ACTIVATION_TERMINAL_UNPROVEN >&2; exit 1; }
          jq -e '.owner_release_id == null and .owner_mode == null and .sales_paused == false' status-before.json >/dev/null || { echo AGENT_REFERRALS_ACTIVATION_RELEASE_NOT_TERMINAL >&2; exit 1; }
          jq --arg activation "$ACTIVATION_ID" --arg release "$RELEASE_ID" --argjson revision "$EXPECTED_FEATURE_REVISION" '{activation_id:$activation, terminal_release_id:$release, expected_feature_revision:$revision, expected:.expected}' completion-before.json > activation-request.json
          if jq -e --argjson revision "$EXPECTED_FEATURE_REVISION" '.feature_state.state == "DORMANT" and .feature_state.owner_id == null and .feature_state.revision == $revision and .last_feature_state_event == null and .activation_manifest == null' activation-before.json >/dev/null; then
            echo ACTIVATION_MODE=FRESH >> "$GITHUB_ENV"
          elif scripts/release/assert-agent-referrals-q6-activation-evidence.sh activation-before.json completion-before.json "$ACTIVATION_ID" "$RELEASE_ID" "$TARGET_SHA" "$EXPECTED_FEATURE_REVISION"; then
            echo ACTIVATION_MODE=EXACT_REPLAY >> "$GITHUB_ENV"
          else
            echo AGENT_REFERRALS_ACTIVATION_STATE_UNEXPECTED >&2; exit 1
          fi

      - name: Rebind authority and issue at most one fresh activation POST
        if: env.ACTIVATION_MODE == 'FRESH'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status-before-post.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-before-post.json
          api "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activation-state" > activation-before-post.json
          jq -e '.owner_release_id == null and .owner_mode == null and .sales_paused == false' status-before-post.json >/dev/null || exit 1
          jq -e --slurpfile expected completion-before.json '.complete == true and .expected == $expected[0].expected' completion-before-post.json >/dev/null || exit 1
          jq -e --argjson revision "$EXPECTED_FEATURE_REVISION" '.feature_state.state == "DORMANT" and .feature_state.owner_id == null and .feature_state.revision == $revision and .last_feature_state_event == null and .activation_manifest == null' activation-before-post.json >/dev/null || exit 1
          # This final authority bind is intentionally the last operation before
          # the single POST. Q6 rechecks all durable activation preconditions
          # atomically inside the authority transaction itself.
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main runtime-candidate
          [[ "$CONTROLLER_SHA" == "$EXPECTED_CONTROLLER_SHA" && "$(git rev-parse "${CONTROLLER_SHA}^{tree}")" == "$EXPECTED_CONTROLLER_TREE" && "$(git rev-parse origin/main)" == "$EXPECTED_CONTROLLER_SHA" && "$(git rev-parse origin/runtime-candidate)" == "$TARGET_SHA" && "$(scripts/read-production-deploy-ref.sh)" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_ACTIVATION_AUTHORITY_REBIND_FAILED >&2; exit 1; }
          [[ "$(git ls-remote --exit-code origin "$EXPECTED_Q6_PUBLICATION_REF" | awk 'NF == 2 { print $1 }')" == "$TARGET_SHA" ]] || { echo AGENT_REFERRALS_ACTIVATION_PUBLICATION_MOVED >&2; exit 1; }
          response=activation-post.json
          set +e
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $COMMERCE_RELEASE_CONTROL_TOKEN" -H 'Content-Type: application/json' --output "$response" --write-out '%{http_code}' -X POST --data-binary @activation-request.json "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activate")"
          curl_rc=$?
          set -e
          if [[ "$curl_rc" -ne 0 || ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            if [[ "$curl_rc" -eq 0 && "$http_status" =~ ^4[0-9][0-9]$ ]]; then echo AGENT_REFERRALS_ACTIVATION_REFUSED >&2; exit 1; fi
            echo AGENT_REFERRALS_ACTIVATION_OUTCOME_UNKNOWN >&2
          fi

      - name: Reconcile exact Q6 activation evidence
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activation-state" > activation-after.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion-after.json
          jq -e --slurpfile before completion-before.json '.complete == true and .expected == $before[0].expected' completion-after.json >/dev/null || { echo AGENT_REFERRALS_ACTIVATION_TERMINAL_CHANGED >&2; exit 1; }
          scripts/release/assert-agent-referrals-q6-activation-evidence.sh activation-after.json completion-after.json "$ACTIVATION_ID" "$RELEASE_ID" "$TARGET_SHA" "$EXPECTED_FEATURE_REVISION"
