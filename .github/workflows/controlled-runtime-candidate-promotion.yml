name: Controlled runtime candidate promotion

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact published runtime-candidate commit SHA to promote.
        required: true
        type: string
      expected_controller_sha:
        description: Exact reviewed main controller commit SHA authorized to make this CAS.
        required: true
        type: string
      expected_controller_tree:
        description: Exact reviewed tree for the authorized controller commit.
        required: true
        type: string
      expected_published_ref:
        description: Exact runtime publication ref that must still resolve to target_sha.
        required: true
        type: string
      expected_runtime_candidate_sha:
        description: Exact current runtime-candidate SHA required for the CAS update.
        required: true
        type: string
      expected_production_deploy_sha:
        description: Exact current production-deploy SHA required as topology evidence.
        required: true
        type: string
      reason:
        description: Bounded human-readable audit reason for this ordinary candidate promotion.
        required: true
        type: string
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      expected_controller_sha:
        required: true
        type: string
      expected_controller_tree:
        required: true
        type: string
      expected_published_ref:
        required: true
        type: string
      expected_runtime_candidate_sha:
        required: true
        type: string
      expected_production_deploy_sha:
        required: true
        type: string
      reason:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha }}
      INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      INPUT_EXPECTED_CONTROLLER_TREE: ${{ inputs.expected_controller_tree }}
      INPUT_EXPECTED_PUBLISHED_REF: ${{ inputs.expected_published_ref }}
      INPUT_EXPECTED_RUNTIME_CANDIDATE_SHA: ${{ inputs.expected_runtime_candidate_sha }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha }}
      INPUT_REASON: ${{ inputs.reason }}
      RUNTIME_CANDIDATE_REF_TOKEN: ${{ secrets.RUNTIME_CANDIDATE_REF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/controlled-runtime-candidate-promotion
