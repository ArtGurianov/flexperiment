name: Controlled email delivery-outcome cutover

# Migration 0039: separates delivery truth from worker workflow state, so
# `status = 'FAILED'` stops asserting a delivery failure it never observed. No
# resend capability ships here.
#
# This is not a generic deploy and not the release-semantics lane: the candidate
# carries commerce/migrations, which only the candidate protocol may deliver.
#
# ORDERING IS SAFETY-CRITICAL, in both directions:
#
#   emergency latch OFF before certify   a certification order is a real 1-RUB
#                                        payment and cannot transact through an
#                                        operator stop
#   emergency latch ON  before complete  completeCandidate clears the release
#                                        gate, so without the latch sales would
#                                        briefly open before the new durable
#                                        semantics have been inspected
#
# The controller does NOT latch or clear the emergency gate. Those are admin
# operations, and a release controller holding admin credentials could also
# refund, cancel and mutate - authority far beyond driving a release. It
# observes the latch through the internal release-control status and refuses to
# proceed when the latch is wrong for the stage. Clearing it stays a deliberate
# operator act, as it has always been.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Prepare the paused candidate/certification lease, record consumed certification evidence, classify an explicitly evidenced readiness defect, abort a still-reversible candidate, or complete a certified candidate.
        required: true
        type: choice
        options: [prepare, certify, classify_runtime_readiness_defect, abort, complete]
      target_sha:
        description: Exact immutable runtime source SHA for this same-owner epoch.
        required: true
        type: string
      replacement_sha:
        description: Exact forward-only same-owner recovery source SHA (only from RECOVERY_REQUIRED).
        required: false
        type: string
      certification_occurrence_id:
        description: Hidden, closed 101-kopeck certification occurrence UUID.
        required: false
        type: string
      certification_promo_id:
        description: Active FIXED-1 certification promo UUID.
        required: false
        type: string
      certification_idempotency_key_hash:
        description: SHA-256 of the stable certification checkout idempotency key.
        required: false
        type: string
      certification_lease_seconds:
        description: Lease duration, from 180 to 300 seconds.
        required: false
        type: string
      certification_order_id:
        description: Order UUID of the consumed real 1-RUB certification checkout. Only for stage=certify.
        required: false
        type: string
      abort_reason:
        description: Bounded human-readable reason recorded with an abort. Only for stage=abort.
        required: false
        type: string
      retry_reason:
        description: Set only to OPERATIONAL for a resolved terminal payment failure and a fresh fixture.
        required: false
        type: string
      runtime_readiness_error_class:
        description: Controlled provider readiness error class for explicit PAUSED recovery classification only.
        required: false
        type: string
      runtime_readiness_error_code:
        description: Controlled provider readiness error code for explicit PAUSED recovery classification only.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      PRODUCTION_DEPLOY_REF_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_REF_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_STAGE: ${{ inputs.stage }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha }}
      INPUT_REPLACEMENT_SHA: ${{ inputs.replacement_sha || '' }}
      INPUT_CERTIFICATION_OCCURRENCE_ID: ${{ inputs.certification_occurrence_id || '' }}
      INPUT_CERTIFICATION_PROMO_ID: ${{ inputs.certification_promo_id || '' }}
      INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH: ${{ inputs.certification_idempotency_key_hash || '' }}
      INPUT_CERTIFICATION_LEASE_SECONDS: ${{ inputs.certification_lease_seconds || '' }}
      INPUT_CERTIFICATION_ORDER_ID: ${{ inputs.certification_order_id || '' }}
      INPUT_ABORT_REASON: ${{ inputs.abort_reason || '' }}
      INPUT_RETRY_REASON: ${{ inputs.retry_reason || '' }}
      INPUT_RUNTIME_READINESS_ERROR_CLASS: ${{ inputs.runtime_readiness_error_class || '' }}
      INPUT_RUNTIME_READINESS_ERROR_CODE: ${{ inputs.runtime_readiness_error_code || '' }}
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"
      INITIAL_READINESS_DELAY_SECONDS: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable controller, source, and input bundle
        run: |
          set -euo pipefail
          [[ "$INPUT_STAGE" == prepare || "$INPUT_STAGE" == certify || "$INPUT_STAGE" == classify_runtime_readiness_defect || "$INPUT_STAGE" == complete ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_STAGE_INVALID" >&2; exit 1; }
          [[ "$INPUT_STAGE" != prepare || -n "$PRODUCTION_DEPLOY_REF_TOKEN" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_DEPLOY_REF_TOKEN_REQUIRED" >&2; exit 1; }
          [[ "$INPUT_TARGET_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_TARGET_SHA_INVALID" >&2; exit 1; }
          target_sha="${INPUT_TARGET_SHA,,}"
          git fetch --no-tags origin "$target_sha"
          git cat-file -e "$target_sha^{commit}" || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_TARGET_UNAVAILABLE" >&2; exit 1; }
          git merge-base --is-ancestor "$target_sha" "$CONTROLLER_SHA" || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_TARGET_NOT_REACHABLE_FROM_CONTROLLER" >&2; exit 1; }
          effective_sha="$target_sha"
          if [[ -n "$INPUT_REPLACEMENT_SHA" ]]; then
            [[ "$INPUT_STAGE" == prepare && "$INPUT_REPLACEMENT_SHA" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_REPLACEMENT_SHA_INVALID" >&2; exit 1; }
            effective_sha="${INPUT_REPLACEMENT_SHA,,}"
            git fetch --no-tags origin "$effective_sha"
            git cat-file -e "$effective_sha^{commit}" || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_REPLACEMENT_UNAVAILABLE" >&2; exit 1; }
          fi
          # The runtime must contain the reconciled shared migrationApplied()
          # predicate. A candidate built from a tree that predates it would
          # silently reinstate the run-33139603447 reopen defect in production.
          AUTHORITY_HEAD_MIN_SHA=fd09fa5881de1e4bb7ba399a998e4797804061f5
          git merge-base --is-ancestor "$AUTHORITY_HEAD_MIN_SHA" "$effective_sha" || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_AUTHORITY_HEAD_RUNTIME_REQUIRED" >&2
            exit 1
          }
          present=0
          for value in "$INPUT_CERTIFICATION_OCCURRENCE_ID" "$INPUT_CERTIFICATION_PROMO_ID" "$INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH" "$INPUT_CERTIFICATION_LEASE_SECONDS"; do [[ -n "$value" ]] && present=$((present + 1)); done
          [[ "$present" == 0 || "$present" == 4 ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_INPUTS_PARTIAL" >&2; exit 1; }
          if [[ "$present" == 4 ]]; then
            [[ "$INPUT_CERTIFICATION_OCCURRENCE_ID" =~ ^[0-9a-fA-F-]{36}$ && "$INPUT_CERTIFICATION_PROMO_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_SCOPE_INVALID" >&2; exit 1; }
            [[ "$INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_HASH_INVALID" >&2; exit 1; }
            [[ "$INPUT_CERTIFICATION_LEASE_SECONDS" =~ ^[0-9]+$ && "$INPUT_CERTIFICATION_LEASE_SECONDS" -ge 180 && "$INPUT_CERTIFICATION_LEASE_SECONDS" -le 300 ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_LEASE_INVALID" >&2; exit 1; }
          fi
          [[ -z "$INPUT_RETRY_REASON" || "$INPUT_RETRY_REASON" == OPERATIONAL ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RETRY_REASON_INVALID" >&2; exit 1; }
          [[ -z "$INPUT_RETRY_REASON" || "$present" == 4 ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RETRY_REQUIRES_FRESH_FIXTURE" >&2; exit 1; }
          if [[ "$INPUT_STAGE" == classify_runtime_readiness_defect ]]; then
            [[ -z "$INPUT_REPLACEMENT_SHA" && "$present" == 0 && -z "$INPUT_RETRY_REASON" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_INPUTS_FORBIDDEN" >&2; exit 1; }
            [[ "$INPUT_RUNTIME_READINESS_ERROR_CLASS" =~ ^(TLS_CERT_CHAIN_UNTRUSTED|PROVIDER_BAD_REQUEST|PROVIDER_NETWORK|PROVIDER_RESPONSE_INVALID)$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_CLASS_INVALID" >&2; exit 1; }
            [[ "$INPUT_RUNTIME_READINESS_ERROR_CODE" =~ ^[A-Z0-9_]{1,80}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_CODE_INVALID" >&2; exit 1; }
          else
            [[ -z "$INPUT_RUNTIME_READINESS_ERROR_CLASS" && -z "$INPUT_RUNTIME_READINESS_ERROR_CODE" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_INPUTS_FORBIDDEN" >&2; exit 1; }
            [[ "$INPUT_STAGE" == prepare || ("$present" == 0 && -z "$INPUT_RETRY_REASON") ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_COMPLETE_INPUTS_FORBIDDEN" >&2; exit 1; }
          fi
          if [[ "$INPUT_STAGE" == certify ]]; then
            [[ "$INPUT_CERTIFICATION_ORDER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_ORDER_ID_INVALID" >&2; exit 1; }
            [[ -z "$INPUT_REPLACEMENT_SHA" && "$present" == 0 ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFY_INPUTS_FORBIDDEN" >&2; exit 1; }
          else
            [[ -z "$INPUT_CERTIFICATION_ORDER_ID" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFY_INPUTS_FORBIDDEN" >&2; exit 1; }
          fi
          {
            echo "TARGET_SHA=$target_sha"
            echo "EFFECTIVE_TARGET_SHA=$effective_sha"
            echo "RELEASE_ID=sales-availability-v1:$target_sha"
            echo "CERTIFICATION_INPUTS_PRESENT=$present"
          } >> "$GITHUB_ENV"

      - name: Bind source migration and surface contracts
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/sales-availability-release-surface-contract.json"
          git show "$EFFECTIVE_TARGET_SHA:release-surface-contract.json" > "$contract"
          jq -e '.checkout_contract_version == "sales-availability-v1" and .admin_contract_version == "sales-availability-v1"' "$contract" >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_SURFACE_CONTRACT_MISMATCH" >&2; exit 1; }
          inventory='{}'
          while IFS= read -r migration; do
            [[ -n "$migration" ]] || continue
            hash="$(git show "$EFFECTIVE_TARGET_SHA:commerce/migrations/$migration" | shasum -a 256 | awk '{ print $1 }')"
            inventory="$(jq -cn --argjson inventory "$inventory" --arg migration "$migration" --arg hash "$hash" '$inventory + {($migration): $hash}')"
          done < <(git ls-tree -r --name-only "$EFFECTIVE_TARGET_SHA" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)
          jq -e 'has("0039_email_delivery_outcome.sql")' <<<"$inventory" >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_MIGRATION_0039_MISSING" >&2; exit 1; }
          # The row-level invariant - every FAILED row carries a delivery
          # classification - is not polled after the deploy. 0039 ends with a
          # no-op UPDATE over every row, so each one traverses the enforcement
          # trigger while the migration runs: an unclassifiable row aborts the
          # migration and the deploy fails here rather than passing with bad
          # data. Verifying 0039 applied IS verifying the invariant held.
          # The expectation is derived from the candidate's own inventory, never
          # from a filename allowlist. 0038 was the last entry added to that
          # list and stays frozen as historical manual-recovery compatibility;
          # reintroducing filename knowledge per migration would walk back the
          # inventory authority this deploy is meant to keep proving.
          jq -e 'has("0038_occurrence_availability_notifications.sql")' <<<"$inventory" >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_MIGRATION_BASELINE_MISSING" >&2; exit 1; }
          echo "$inventory" > "$RUNNER_TEMP/email-delivery-outcome-migration-inventory.json"
          echo "EMAIL_DELIVERY_OUTCOME_MIGRATION_INVENTORY=$RUNNER_TEMP/email-delivery-outcome-migration-inventory.json" >> "$GITHUB_ENV"

      - name: Bind the candidate to a schema-only change surface
        run: |
          set -euo pipefail
          # This candidate carries a migration and nothing else that needs a
          # controlled lane. Prove from the source that it does not quietly move
          # legal state: a schema cutover is not a licence to publish anything.
          git show "$EFFECTIVE_TARGET_SHA:commerce/legal/production-manifest.json" > "$RUNNER_TEMP/candidate-active-manifest.json"
          jq -e '.version != "2026-08-28.1"' "$RUNNER_TEMP/candidate-active-manifest.json" >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_ACTIVE_MANIFEST_ALREADY_PROMOTED" >&2; exit 1; }
          git show "$EFFECTIVE_TARGET_SHA:commerce/legal/production-manifest.2026-08-28.1.draft.json" > "$RUNNER_TEMP/candidate-draft-manifest.json"
          jq -e '.version == "2026-08-28.1" and .publish_time == "PENDING_AUTHORITATIVE_PUBLISH_TIMESTAMP"' "$RUNNER_TEMP/candidate-draft-manifest.json" >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_DRAFT_MANIFEST_INVALID" >&2; exit 1; }
          active_privacy="$(jq -r '.documents.PRIVACY_POLICY.sha256' "$RUNNER_TEMP/candidate-active-manifest.json")"
          candidate_privacy="$(git show "$EFFECTIVE_TARGET_SHA:public/legal/privacy-policy.md" | shasum -a 256 | awk '{ print $1 }')"
          [[ "$active_privacy" == "$candidate_privacy" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CURRENT_LEGAL_COPIES_CHANGED" >&2; exit 1; }
          active_consent="$(jq -r '.documents.PD_CONSENT.sha256' "$RUNNER_TEMP/candidate-active-manifest.json")"
          candidate_consent="$(git show "$EFFECTIVE_TARGET_SHA:public/legal/personal-data-consent.md" | shasum -a 256 | awk '{ print $1 }')"
          [[ "$active_consent" == "$candidate_consent" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CURRENT_LEGAL_COPIES_CHANGED" >&2; exit 1; }

      - name: Read durable baseline and build generation-one request
        if: env.INPUT_STAGE == 'prepare' && env.INPUT_REPLACEMENT_SHA == ''
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > durable-before.json
          jq -e '(.sales_paused == false and .owner_release_id == null and (.runtime.source_commit | type == "string"))' durable-before.json >/dev/null || {
            owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
            [[ "$owner" == "$RELEASE_ID" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_BLOCKED_BY_RELEASE_OWNER=$owner" >&2; exit 1; }
          }
          production_source="$(jq -er '.runtime.source_commit | select(type == "string" and test("^[a-f0-9]{40}$"))' durable-before.json)"
          git fetch --no-tags origin "$production_source"
          production_inventory='{}'
          while IFS= read -r migration; do
            [[ -n "$migration" ]] || continue
            hash="$(git show "$production_source:commerce/migrations/$migration" | shasum -a 256 | awk '{ print $1 }')"
            production_inventory="$(jq -cn --argjson inventory "$production_inventory" --arg migration "$migration" --arg hash "$hash" '$inventory + {($migration): $hash}')"
          done < <(git ls-tree -r --name-only "$production_source" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)
          jq -e --argjson inventory "$production_inventory" '.runtime.migration_source_hashes == $inventory' durable-before.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_PRODUCTION_MIGRATION_SOURCE_MISMATCH" >&2; exit 1; }
          production_migration_names="$(git ls-tree -r --name-only "$production_source" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          candidate_migration_names="$(git ls-tree -r --name-only "$EFFECTIVE_TARGET_SHA" -- commerce/migrations | sed -n 's#^commerce/migrations/##p' | sort)"
          production_migration_count="$(printf '%s\n' "$production_migration_names" | awk 'NF { count += 1 } END { print count + 0 }')"
          candidate_applied_prefix="$(printf '%s\n' "$candidate_migration_names" | sed -n "1,${production_migration_count}p")"
          [[ "$candidate_applied_prefix" == "$production_migration_names" ]] || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_APPLIED_MIGRATION_NAMES_NOT_PREFIX" >&2
            exit 1
          }
          git diff --no-ext-diff --name-status "$production_source" "$EFFECTIVE_TARGET_SHA" -- commerce/migrations |
            awk 'NF > 0 && $1 != "A" { exit 1 }' || {
              echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_APPLIED_MIGRATION_BYTES_CHANGED" >&2
              exit 1
            }
          jq -e --argjson inventory "$(cat "$EMAIL_DELIVERY_OUTCOME_MIGRATION_INVENTORY")" '
            .runtime as $runtime |
            if ($runtime.legal_version | type == "string") and ($runtime.legal_manifest_sha256 | type == "string") and ($runtime.legal_hashes | type == "object") and ($runtime.current_legal_copies_match == true)
            then {release_id: env.RELEASE_ID, candidate_generation: 1, source_commit: env.EFFECTIVE_TARGET_SHA, migration_inventory: {files: $inventory}, legal_baseline: {legal_version: $runtime.legal_version, legal_manifest_sha256: $runtime.legal_manifest_sha256, legal_hashes: $runtime.legal_hashes}, release_family: "sales-availability-v1", checkout_contract_version: "sales-availability-v1", admin_contract_version: "sales-availability-v1", phase: "PAUSED", phase_sequence: 0}
            else error("EMAIL_DELIVERY_OUTCOME_CUTOVER_PRODUCTION_BASELINE_INVALID") end
          ' durable-before.json > initial-head.json
          jq -e '.legal_baseline.legal_version != "2026-08-28.1"' initial-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_LEGAL_BASELINE_ALREADY_PROMOTED" >&2; exit 1; }

      - name: Acquire generation one or read its authoritative state
        if: env.INPUT_STAGE == 'prepare' && env.INPUT_REPLACEMENT_SHA == ''
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          owner="$(jq -r '.owner_release_id // empty' durable-before.json)"
          [[ -z "$owner" || "$owner" == "$RELEASE_ID" ]] || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_BLOCKED_BY_RELEASE_OWNER=$owner" >&2; exit 1; }
          if api -X POST --data-binary @<(jq -n --slurpfile head initial-head.json '{head: $head[0]}') "$PUBLIC_API_URL/v1/internal/release-control/candidates/acquire" > acquired.json; then
            jq -e '.head.phase == "PAUSED" and .head.release_id == env.RELEASE_ID' acquired.json >/dev/null
            echo "SALES_AVAILABILITY_HEAD_READ_REQUIRED_AFTER_DEPLOY=1" >> "$GITHUB_ENV"
          else
            api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_HEAD_READ_UNAVAILABLE" >&2; exit 1; }
            jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and (.state_hash | test("^[a-f0-9]{64}$"))' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_HEAD_RECONCILIATION_INVALID" >&2; exit 1; }
            echo "SALES_AVAILABILITY_HEAD_READ_REQUIRED_AFTER_DEPLOY=0" >> "$GITHUB_ENV"
          fi

      - name: Adopt a forward-only recovery generation
        if: env.INPUT_STAGE == 'prepare' && env.INPUT_REPLACEMENT_SHA != ''
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_HEAD_READ_UNAVAILABLE" >&2; exit 1; }
          jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and .head.phase == "RECOVERY_REQUIRED" and (.state_hash | test("^[a-f0-9]{64}$"))' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RECOVERY_STATE_INVALID" >&2; exit 1; }
          jq -n --slurpfile current candidate-head.json --argjson inventory "$(cat "$EMAIL_DELIVERY_OUTCOME_MIGRATION_INVENTORY")" --arg source "$EFFECTIVE_TARGET_SHA" '
            $current[0] as $current | {
              head: ($current.head | .candidate_generation += 1 | .source_commit = $source | .migration_inventory = {files: $inventory} | .phase = "PAUSED" | .phase_sequence = 0 | del(.certification)),
              expected_generation: $current.head.candidate_generation,
              from_sha: $current.head.source_commit,
              expected_state_hash: $current.state_hash
            }
          ' > adopt.json
          api -X POST --data-binary @adopt.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/adopt" > adopted.json
          echo "SALES_AVAILABILITY_HEAD_READ_REQUIRED_AFTER_DEPLOY=1" >> "$GITHUB_ENV"

      # Unconditional on every prepare, including a re-run of an already
      # acquired generation. Enforcement is exactly what a resume most needs
      # proven, and the read model saying "paused" is not the same fact.
      - name: Prove public checkout is paused before candidate deployment
        if: env.INPUT_STAGE == 'prepare'
        run: |
          set -euo pipefail
          pause_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output paused-checkout.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Idempotency-Key: sales-availability-cutover-pause-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --data '{}' "$PUBLIC_API_URL/v1/public/checkouts")"
          [[ "$pause_status" == "503" ]] || { cat paused-checkout.json >&2; exit 1; }
          jq -e '.error.code == "SALES_TEMPORARILY_PAUSED"' paused-checkout.json >/dev/null

      - name: Deploy the exact paused generation
        if: env.INPUT_STAGE == 'prepare' && (env.SALES_AVAILABILITY_HEAD_READ_REQUIRED_AFTER_DEPLOY == '1' || env.INPUT_REPLACEMENT_SHA != '')
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${PRODUCTION_DEPLOY_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          scripts/set-production-deploy-ref.sh "$EFFECTIVE_TARGET_SHA"
          scripts/controlled-coolify-deploy.sh "$EFFECTIVE_TARGET_SHA"
          echo "Allowing Coolify deployments to start for ${INITIAL_READINESS_DELAY_SECONDS}s..."
          sleep "$INITIAL_READINESS_DELAY_SECONDS"

      - name: Reconcile deployed candidate and enter read-only phase
        if: env.INPUT_STAGE == 'prepare'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            if api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json && \
              api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json && \
              api "$PUBLIC_API_URL/v1/internal/release-control/provider-readiness" > provider-readiness.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/healthz" > health.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/readyz" > ready.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/tour" > tour.json && \
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/v1/public/legal-config" > legal-config.json && \
              jq -e --arg source "$EFFECTIVE_TARGET_SHA" --arg release_id "$RELEASE_ID" '
                .schema_version == 2 and .head.release_id == $release_id and .head.source_commit == $source and (.state_hash | test("^[a-f0-9]{64}$"))
              ' candidate-head.json >/dev/null && \
              jq -e --slurpfile candidate candidate-head.json --arg source "$EFFECTIVE_TARGET_SHA" --argjson inventory "$(cat "$EMAIL_DELIVERY_OUTCOME_MIGRATION_INVENTORY")" '
                .runtime as $runtime | $candidate[0].head as $head |
                .sales_paused == true and .owner_release_id == env.RELEASE_ID and
                $runtime.source_commit == $source and $runtime.worker_source_commit == $source and
                ($runtime.migration_source_hashes == $inventory) and
                ($runtime.migration_versions | sort == ($head.migration_inventory.files | keys | sort)) and
                $runtime.legal_version == $head.legal_baseline.legal_version and
                $runtime.legal_manifest_sha256 == $head.legal_baseline.legal_manifest_sha256 and
                $runtime.legal_hashes == $head.legal_baseline.legal_hashes and
                $runtime.current_legal_copies_match == true
              ' status.json >/dev/null && \
              jq -e '.environment == "production"' provider-readiness.json >/dev/null && \
              node -e '
                const fs = require("node:fs");
                const runtime = JSON.parse(fs.readFileSync("status.json", "utf8")).runtime;
                const now = Date.now(); const freshness = 90_000;
                const observed = Date.parse(runtime.worker_observed_at ?? "");
                const sweep = Date.parse(runtime.worker_last_successful_sweep_at ?? "");
                const started = Date.parse(runtime.worker_started_at ?? "");
                if (![observed, sweep, started].every(Number.isFinite) || observed < now - freshness || observed > now + 5_000 || sweep < now - freshness || sweep > now + 5_000 || sweep < started) process.exit(1);
              ' && \
              jq -e '.cities | type == "array" and (map(.purchase_status == "TEMPORARILY_PAUSED") | all)' tour.json >/dev/null && \
              jq -e --slurpfile inventory "$EMAIL_DELIVERY_OUTCOME_MIGRATION_INVENTORY" '
                (.runtime.migration_versions | index("0039_email_delivery_outcome.sql")) != null and
                (.runtime.migration_source_hashes["0039_email_delivery_outcome.sql"]
                  == $inventory[0]["0039_email_delivery_outcome.sql"])
              ' status.json >/dev/null && \
              jq -e 'has("emergency_sales_paused") and .emergency_sales_paused == false' status.json >/dev/null && \
              jq -e --arg source "$EFFECTIVE_TARGET_SHA" --slurpfile candidate candidate-head.json '.source_commit == $source and .checkout_contract_version == $candidate[0].head.checkout_contract_version' frontend.json >/dev/null && \
              jq -e --arg source "$EFFECTIVE_TARGET_SHA" --slurpfile candidate candidate-head.json '.source_commit == $source and .admin_contract_version == $candidate[0].head.admin_contract_version' admin.json >/dev/null && \
              jq -e '.ok == true' health.json >/dev/null && \
              jq -e '.ok == true' ready.json >/dev/null; then break; fi
            [[ "$attempt" == "$POLL_ATTEMPTS" ]] && { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_NOT_READY" >&2; exit 1; }
            sleep "$POLL_SECONDS"
          done
          phase="$(jq -r '.head.phase' candidate-head.json)"
          if [[ "$phase" == PAUSED ]]; then
            jq -n --slurpfile current candidate-head.json '{release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation, expected_state_hash: $current[0].state_hash, from_phase: $current[0].head.phase, phase_sequence: $current[0].head.phase_sequence, to_phase: "DEPLOYED_READ_ONLY"}' > phase.json
            api -X POST --data-binary @phase.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/phase" > phase-result.json
          fi
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          jq -e --arg source "$EFFECTIVE_TARGET_SHA" '.head.source_commit == $source and (.state_hash | test("^[a-f0-9]{64}$"))' candidate-head.json >/dev/null

      - name: Prove the emergency stop capability exists and is clear
        if: env.INPUT_STAGE == 'prepare'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          # Two facts, both fail-closed, proven while the generation is still at
          # DEPLOYED_READ_ONLY and therefore still abortable:
          #
          #   the field EXISTS      the deployed runtime predates it, so its
          #                         presence is what proves the candidate is
          #                         actually live rather than a stale container
          #   the latch is CLEAR    certification places a real 1-RUB order and
          #                         the emergency gate is absolute, so a latch
          #                         set now would fail the payment, not the run
          #
          # An absent field must never read as false, which is why existence is
          # asserted separately rather than inferred from the comparison.
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > handshake-status.json
          jq -e 'has("emergency_sales_paused")' handshake-status.json >/dev/null || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_CAPABILITY_MISSING_AFTER_DEPLOY" >&2
            echo "The candidate is not live, or is not the candidate. Abort is available from here." >&2
            exit 1
          }
          jq -e '.emergency_sales_paused == false' handshake-status.json >/dev/null || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_LATCH_SET_TOO_EARLY" >&2
            exit 1
          }

      - name: Classify an explicitly evidenced deployed runtime-readiness defect
        if: env.INPUT_STAGE == 'classify_runtime_readiness_defect'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json
          jq -e --arg release_id "$RELEASE_ID" '
            .schema_version == 2 and .head.release_id == $release_id and .head.phase == "PAUSED" and
            (.head.certification == null) and (.state_hash | test("^[a-f0-9]{64}$"))
          ' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_STATE_INVALID" >&2; exit 1; }
          jq -e --slurpfile candidate candidate-head.json '
            .sales_paused == true and .owner_release_id == $candidate[0].head.release_id and
            .runtime.source_commit == $candidate[0].head.source_commit and
            .runtime.worker_source_commit == $candidate[0].head.source_commit
          ' status.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_NOT_DEPLOYED" >&2; exit 1; }
          jq -n --slurpfile current candidate-head.json \
            --arg error_class "$INPUT_RUNTIME_READINESS_ERROR_CLASS" --arg error_code "$INPUT_RUNTIME_READINESS_ERROR_CODE" '
            {release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation,
             expected_state_hash: $current[0].state_hash, readiness_component: "PROVIDER_READINESS",
             error_class: $error_class, error_code: $error_code}
          ' > runtime-readiness-defect.json
          api -X POST --data-binary @runtime-readiness-defect.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/runtime-readiness-defect" > recovered.json
          jq -e --arg release_id "$RELEASE_ID" '
            .head.release_id == $release_id and .head.phase == "RECOVERY_REQUIRED" and
            (.head.certification == null)
          ' recovered.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RUNTIME_READINESS_TRANSITION_INVALID" >&2; exit 1; }

      - name: Reconfirm the emergency stop is still clear
        if: env.INPUT_STAGE == 'certify'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          # A re-check, not the pre-payment guarantee. The payment happens
          # between prepare and this stage, so by the time this runs the money
          # has already moved; the guarantee that the latch was clear before the
          # order is the prepare-stage handshake. What this catches is a latch
          # set during the interval, which would otherwise surface as a confusing
          # certification failure rather than a clear one.
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > pre-certify-status.json
          jq -e 'has("emergency_sales_paused")' pre-certify-status.json >/dev/null \
            || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_STATE_NOT_OBSERVABLE" >&2; exit 1; }
          jq -e '.emergency_sales_paused == false' pre-certify-status.json >/dev/null || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_LATCH_BLOCKS_CERTIFICATION" >&2
            echo "The latch belongs strictly after certification. Clear it, certify, then latch." >&2
            exit 1
          }

      - name: Activate or reconcile the certification lease
        if: env.INPUT_STAGE == 'prepare' && env.CERTIFICATION_INPUTS_PRESENT == '4'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          if [[ -n "$INPUT_RETRY_REASON" ]]; then
            jq -e '.head.phase == "CERTIFICATION_IN_FLIGHT"' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_RETRY_STATE_INVALID" >&2; exit 1; }
            jq -n --slurpfile current candidate-head.json '{release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation, expected_state_hash: $current[0].state_hash, retry_reason: "OPERATIONAL"}' > retry.json
            api -X POST --data-binary @retry.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/certification/retry" > retry-result.json
            api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          fi
          phase="$(jq -r '.head.phase' candidate-head.json)"
          if [[ "$phase" == DEPLOYED_READ_ONLY ]]; then
            jq -n --slurpfile current candidate-head.json --arg occurrence "$INPUT_CERTIFICATION_OCCURRENCE_ID" --arg promo "$INPUT_CERTIFICATION_PROMO_ID" --arg key_hash "$INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH" --argjson lease_seconds "$INPUT_CERTIFICATION_LEASE_SECONDS" '{release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation, expected_state_hash: $current[0].state_hash, occurrence_id: $occurrence, promo_id: $promo, expected_idempotency_key_hash: $key_hash, lease_seconds: $lease_seconds}' > activate.json
            api -X POST --data-binary @activate.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/certification/activate" > activated.json
            api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          fi
          phase="$(jq -r '.head.phase' candidate-head.json)"
          if [[ "$phase" == CERTIFICATION_IN_FLIGHT || "$phase" == CERTIFIED ]]; then
            jq -e --arg occurrence "$INPUT_CERTIFICATION_OCCURRENCE_ID" --arg promo "$INPUT_CERTIFICATION_PROMO_ID" --arg key_hash "$INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH" '
              .head.certification.occurrence_id == $occurrence and .head.certification.promo_id == $promo and .head.certification.expected_idempotency_key_hash == $key_hash and .head.certification.status == "CONSUMED" and (.state_hash | test("^[a-f0-9]{64}$"))
            ' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_RECONCILIATION_INVALID" >&2; exit 1; }
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_ALREADY_STARTED=$phase"
            exit 0
          fi
          jq -e --arg occurrence "$INPUT_CERTIFICATION_OCCURRENCE_ID" --arg promo "$INPUT_CERTIFICATION_PROMO_ID" --arg key_hash "$INPUT_CERTIFICATION_IDEMPOTENCY_KEY_HASH" '
            .head.phase == "CERTIFICATION_ONLY" and .head.certification.status == "ACTIVE" and .head.certification.occurrence_id == $occurrence and .head.certification.promo_id == $promo and .head.certification.expected_idempotency_key_hash == $key_hash and (.state_hash | test("^[a-f0-9]{64}$"))
          ' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFICATION_RECONCILIATION_INVALID" >&2; exit 1; }

      - name: Record consumed certification evidence
        if: env.INPUT_STAGE == 'certify'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          # Idempotent: a replay after a successful certify observes CERTIFIED
          # and reconciles instead of reposting evidence.
          if jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and .head.phase == "CERTIFIED" and .head.certification.status == "CONSUMED"' candidate-head.json >/dev/null; then
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_ALREADY_CERTIFIED=1"
            exit 0
          fi
          jq -e --arg release_id "$RELEASE_ID" '
            .schema_version == 2 and .head.release_id == $release_id and
            .head.phase == "CERTIFICATION_IN_FLIGHT" and
            .head.certification.status == "CONSUMED" and
            (.state_hash | test("^[a-f0-9]{64}$"))
          ' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFY_STATE_INVALID" >&2; exit 1; }
          jq -n --slurpfile current candidate-head.json --arg order "$INPUT_CERTIFICATION_ORDER_ID" '
            {release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation,
             expected_state_hash: $current[0].state_hash, order_id: $order}
          ' > certify.json
          api -X POST --data-binary @certify.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/certification/certify" > certified.json
          jq -e --arg release_id "$RELEASE_ID" '.head.release_id == $release_id and .head.phase == "CERTIFIED"' certified.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_CERTIFY_TRANSITION_INVALID" >&2; exit 1; }

      - name: Abort a still-reversible candidate
        if: env.INPUT_STAGE == 'abort'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          # The exit this epoch has and the 12h09m pause did not: a dispatched
          # prepare with no way out except forward through certification.
          # release-control decides reversibility - a certified candidate, a
          # changed production pointer or changed migration state all refuse
          # with their own codes - so this stage only presents the CAS token and
          # reports what came back.
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > abort-head.json
          if jq -e --arg release_id "$RELEASE_ID" '.head.release_id == $release_id and .head.phase == "ABORTED"' abort-head.json >/dev/null; then
            echo "ABORT_REPLAY=already-aborted"
            api "$PUBLIC_API_URL/v1/internal/release-control/status" > aborted-status.json
            jq -e '.owner_release_id == null' aborted-status.json >/dev/null
            exit 0
          fi
          jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and (.state_hash | test("^[a-f0-9]{64}$"))' abort-head.json >/dev/null \
            || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_ABORT_STATE_INVALID" >&2; exit 1; }
          jq -n --slurpfile current abort-head.json --arg reason "$INPUT_ABORT_REASON" \
            '{release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation, expected_state_hash: $current[0].state_hash, reason: $reason}' > abort.json
          api -X POST --data-binary @abort.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/abort" > aborted.json
          jq -e '.head.phase == "ABORTED" and .owner_release_id == null' aborted.json >/dev/null
          # Aborting releases the owner but does not reopen sales on its own:
          # whatever the operator latched stays latched, deliberately.
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > post-abort-status.json
          echo "ABORT_EMERGENCY_LATCH=$(jq -r '.emergency_sales_paused' post-abort-status.json)"

      - name: Complete only a certified authoritative candidate
        if: env.INPUT_STAGE == 'complete'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > candidate-head.json
          if jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and .head.phase == "COMPLETE" and (.state_hash | test("^[a-f0-9]{64}$"))' candidate-head.json >/dev/null; then
            # Replay after COMPLETE. The release gate must be open and unowned;
            # the emergency latch may be either state and both are healthy:
            #
            #   COMPLETE + latch ON   sales closed awaiting verification, the
            #                         expected resting point of this epoch
            #   COMPLETE + latch OFF  the operator has verified and reopened
            #
            # Neither is corrupt release state, and a crash between COMPLETE and
            # unlatching resolves to the first.
            api "$PUBLIC_API_URL/v1/internal/release-control/status" > completed-status.json
            jq -e '.sales_paused == false and .owner_release_id == null' completed-status.json >/dev/null
            latched="$(jq -r '.emergency_sales_paused' completed-status.json)"
            echo "COMPLETE_REPLAY_EMERGENCY_LATCH=$latched"
            exit 0
          fi
          jq -e --arg release_id "$RELEASE_ID" '.schema_version == 2 and .head.release_id == $release_id and (.head.source_commit | type == "string" and test("^[a-f0-9]{40}$")) and .head.phase == "CERTIFIED" and .head.certification.status == "CONSUMED" and (.state_hash | test("^[a-f0-9]{64}$"))' candidate-head.json >/dev/null || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_COMPLETE_STATE_INVALID" >&2; exit 1; }
          # completeCandidate zeroes the release gate, so without the operator's
          # emergency latch already in place, customer sales would open here -
          # before the new durable semantics have been inspected in production.
          #
          # The controller refuses rather than latching. Latching is an admin
          # operation, and a release controller holding admin credentials could
          # also refund, cancel and mutate; that is far wider authority than
          # driving a release requires. It observes and gates instead.
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > pre-complete-status.json
          jq -e 'has("emergency_sales_paused")' pre-complete-status.json >/dev/null \
            || { echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_STATE_NOT_OBSERVABLE" >&2; exit 1; }
          jq -e '.emergency_sales_paused == true' pre-complete-status.json >/dev/null || {
            echo "EMAIL_DELIVERY_OUTCOME_CUTOVER_EMERGENCY_LATCH_REQUIRED_BEFORE_COMPLETE" >&2
            echo "Latch the emergency stop from the admin dashboard, then rerun this stage." >&2
            exit 1
          }
          jq -n --slurpfile current candidate-head.json '{release_id: $current[0].head.release_id, candidate_generation: $current[0].head.candidate_generation, expected_state_hash: $current[0].state_hash}' > complete.json
          api -X POST --data-binary @complete.json "$PUBLIC_API_URL/v1/internal/release-control/candidates/complete" > completed.json
          jq -e '.sales_paused == false and .owner_release_id == null and .head.phase == "COMPLETE"' completed.json >/dev/null
          api "$PUBLIC_API_URL/v1/admin/release-control/candidates/head" > completed-head.json
          jq -e '.head.phase == "COMPLETE" and (.state_hash | test("^[a-f0-9]{64}$"))' completed-head.json >/dev/null
