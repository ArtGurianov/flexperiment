name: Controlled Agent Referrals Phase 1 deploy

# One-shot controller for the Phase 1 legal-identity cleanup. Unlike the
# topology normalization before it, this is ordinary lineage: TARGET is a
# direct child of the current production-deploy and an ancestor of protected
# main, so nothing here waives an ancestry rule. `main` being ahead of TARGET
# is not drift - the intervening commit is CONTROL_PLANE, governed by
# protected main plus required CI and never deployed.
#
# The two production gates in docs/release/AGENT_REFERRALS_PHASE_1_RUNBOOK.md
# prove existing eligibility and are STOP conditions. They are asserted before
# any production effect, and this controller never repairs, backfills or
# re-queries its way past one.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact Phase 1 candidate commit (Q)
        required: true
        type: string
      target_tree:
        description: Exact tree of target_sha
        required: true
        type: string
      expected_production_deploy_sha:
        description: Expected current production-deploy (BASE)
        required: true
        type: string
      gate1_evidence:
        description: "Gate 1 read-only production proof, exactly: rows=0;<UTC timestamp>;<evidence reference>"
        required: true
        type: string
      gate2_evidence:
        description: "Gate 2 read-only production proof, exactly: rows=0;<UTC timestamp>;<evidence reference>"
        required: true
        type: string
      base_integrity_check_evidence:
        description: Immutable reference to the read-only PRAGMA integrity_check = ok evidence captured immediately before dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      BASE_SHA: 2ae6a351669d2cc9d8cd42cf92d50436d64d08cd
      EXPECTED_TARGET_SHA: 1d7310883f4822945725a6ba95d7ff37a470f502
      EXPECTED_TARGET_TREE: b53cdd72fdae633ad26ea5871d7b7b4f4d440342
      # The exact reviewed range, asserted as a sequence rather than a count.
      EXPECTED_RANGE: "b4e350f4ba6ecbaf110461dd5356c2293b3e5c2b 64b1c598f1525f7eece32f49cfc63146a2892067 1d7310883f4822945725a6ba95d7ff37a470f502"
      EXPECTED_MIGRATION_SHA256: c8f711ace8ebf169fb492aa4b3cd5c745f98a8ed9be03ff1cf76d1ef6a184637
      EXPECTED_MIGRATION: 0058_agents_legal_identity_cleanup.sql
      CONTROLLER_SHA: ${{ github.sha }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_TREE: ${{ inputs.target_tree }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha }}
      INPUT_GATE1_EVIDENCE: ${{ inputs.gate1_evidence }}
      INPUT_GATE2_EVIDENCE: ${{ inputs.gate2_evidence }}
      INPUT_BASE_INTEGRITY_CHECK_EVIDENCE: ${{ inputs.base_integrity_check_evidence }}
      BASE_LEGAL_VERSION: "2026-08-28.1"
      BASE_LEGAL_MANIFEST_SHA256: fb879a80c48a50c41694d83118e5f8004a4fec5fbf36f954b15f4b678f4efe02
      BASE_LEGAL_HASHES_JSON: '{"PUBLIC_OFFER":"bd20b056a269ed1286c6ea35a728fbfd58e90a2f845b72ac112fe3544ec9ecaf","PRIVACY_POLICY":"642d11458733e8c1e5bfb28d0cde7f917a276dfcb3e32dc52adc34fac6326339","PD_CONSENT":"acdb8a31a846c1c697cfd977fb67f24e75d280ab72cb6fbce5bbf0146d4ba5b6","CHECKOUT_DISCLOSURE":"97f84fb7d8af72964e4c24f93223a99daf53002f7542cb9209608d1e5335902f"}'
      AR_EXPECTED_STATE: ACTIVE
      AR_EXPECTED_REVISION: "4"
      AR_EXPECTED_OWNER: agent-referrals-activation-ce66d23fdcea5fc84018be43cf428270ea889ee8
      # EX_TEMPFAIL: the readiness primitive's single retryable exit code.
      READINESS_EXIT_CONVERGENCE: "75"
      PRODUCTION_DEPLOY_REF_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_REF_TOKEN }}
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      ADMIN_RELEASE_URL: https://admin.flexperiment.ru/release.json
      POLL_ATTEMPTS: "30"
      POLL_SECONDS: "10"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind dedicated production-deploy credential
        run: |
          set -euo pipefail
          [[ -n "$PRODUCTION_DEPLOY_REF_TOKEN" ]] || { echo PHASE_1_DEPLOY_REF_TOKEN_REQUIRED >&2; exit 1; }
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${PRODUCTION_DEPLOY_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - uses: pnpm/action-setup@v4
        with: { version: 10.29.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Bind the exact Phase 1 candidate
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo PHASE_1_CONTROLLER_NOT_MAIN >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          # TARGET is supplied at dispatch and must equal the reviewed candidate
          # exactly. It is deliberately NOT compared with origin/main: Q is an
          # ancestor of main, not its tip, and requiring equality would force a
          # pointless re-cut every time governed control-plane work merges.
          [[ "$TARGET_SHA" == "$EXPECTED_TARGET_SHA" ]] || { echo PHASE_1_TARGET_NOT_REVIEWED_CANDIDATE >&2; exit 1; }
          [[ "$TARGET_TREE" == "$EXPECTED_TARGET_TREE" ]] || { echo PHASE_1_TARGET_TREE_NOT_REVIEWED >&2; exit 1; }
          [[ "$(git rev-parse "${TARGET_SHA}^{tree}")" == "$TARGET_TREE" ]] || { echo PHASE_1_TARGET_TREE_MISMATCH >&2; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" "$(git rev-parse origin/main)" || { echo PHASE_1_TARGET_NOT_ON_MAIN >&2; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" "$CONTROLLER_SHA" || { echo "PHASE_1_CONTROLLER_OLDER_THAN_TARGET" >&2; exit 1; }
          # Ordinary lineage: no ancestry waiver is claimed or needed here.
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA" || { echo PHASE_1_TARGET_NOT_DESCENDANT_OF_BASE >&2; exit 1; }
          # The reviewed range is three commits and is asserted as an exact
          # sequence, not a count: Q, the governed CONTROL_PLANE commit that
          # landed between candidate and cutover, and Q2. A count would admit
          # any three commits; this admits only the ones that were reviewed.
          actual_range="$(git rev-list --reverse "$BASE_SHA".."$TARGET_SHA" | tr '\n' ' ' | sed 's/ $//')"
          [[ "$actual_range" == "$EXPECTED_RANGE" ]] || { echo "PHASE_1_RANGE_NOT_REVIEWED_SEQUENCE: $actual_range" >&2; exit 1; }
          [[ -z "$(git rev-list --min-parents=2 "$BASE_SHA".."$TARGET_SHA")" ]] || { echo PHASE_1_RANGE_CONTAINS_MERGE_COMMIT >&2; exit 1; }
          for commit in $(git rev-list "$BASE_SHA".."$TARGET_SHA"); do
            git cat-file -e "${commit}:.release/maintenance-only" 2>/dev/null && { echo PHASE_1_RANGE_CONTAINS_MAINTENANCE_COMMIT >&2; exit 1; } || true
          done
          initial_pointer="$(scripts/read-production-deploy-ref.sh)"
          [[ "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" == "$BASE_SHA" && ( "$initial_pointer" == "$BASE_SHA" || "$initial_pointer" == "$TARGET_SHA" ) ]] || { echo PHASE_1_PRODUCTION_POINTER_MISMATCH >&2; exit 1; }

      - name: Prove the crossed boundary is SCHEMA and exactly the Phase 1 migration
        run: |
          set -euo pipefail
          git diff --name-only -z "$BASE_SHA" "$TARGET_SHA" > boundary-paths.bin
          git diff --name-status "$BASE_SHA" "$TARGET_SHA" -- commerce/migrations > migration-delta.txt
          printf 'A\t%s\n' "commerce/migrations/$EXPECTED_MIGRATION" > migration-delta-expected.txt
          diff -u migration-delta-expected.txt migration-delta.txt || { echo PHASE_1_UNEXPECTED_SCHEMA_DELTA >&2; exit 1; }
          # The net delta names the file; this pins its exact bytes, which is
          # what carries the in-transaction Gate 1/2 guards.
          actual_migration_sha256="$(git show "$TARGET_SHA:commerce/migrations/$EXPECTED_MIGRATION" | shasum -a 256 | awk '{print $1}')"
          [[ "$actual_migration_sha256" == "$EXPECTED_MIGRATION_SHA256" ]] || { echo "PHASE_1_MIGRATION_BYTES_NOT_REVIEWED: $actual_migration_sha256" >&2; exit 1; }
          node --import tsx -e '
            import { readFileSync } from "node:fs";
            import { compatibilitySemanticsPaths, genericProductionDeployBoundary, releaseSemanticsCategories } from "./commerce/src/generic-production-deploy-boundary";
            const paths = readFileSync("boundary-paths.bin").toString().split("\0").filter(Boolean);
            const fail = (code) => { console.error(code); process.exit(1); };
            // Every excluded class is proved on its own. The classifier returns
            // only the first crossing in priority order, so a SCHEMA verdict
            // can hide a COMPATIBILITY or RELEASE_CONTROL category underneath.
            if (paths.some((p) => p.startsWith("commerce/legal/") || p.startsWith("public/legal/") || p === "certification.sh")) fail("PHASE_1_LEGAL_CHANGED");
            if (paths.includes("release-surface-contract.json")) fail("PHASE_1_SURFACE_CONTRACT_CHANGED");
            if (paths.some((p) => compatibilitySemanticsPaths.includes(p))) fail("PHASE_1_COMPATIBILITY_CHANGED");
            if (releaseSemanticsCategories(paths).length) fail("PHASE_1_RELEASE_SEMANTICS_CHANGED");
            if (genericProductionDeployBoundary(paths) !== "SCHEMA") fail("PHASE_1_BOUNDARY_NOT_SCHEMA");
          '

      - name: Require the Gate 1/2 preflight provenance
        run: |
          set -euo pipefail
          # Provenance, not authority. These inputs prove an operator ran the
          # read-only queries and looked at the result; they do not make the
          # cutover safe and must never be described as if they did. The BASE
          # runtime can invalidate either gate after the query returns, so the
          # authority is 0058's own in-transaction Gate 1/2 guards, which run
          # under the same BEGIN IMMEDIATE as the DDL they protect.
          #
          # rows=0 is literal all the same: an operator who saw a non-empty
          # result must not be able to dispatch. The SQL and the full semantics
          # live in docs/release/AGENT_REFERRALS_PHASE_1_RUNBOOK.md.
          gate_shape='^rows=0;[^;]+;[^;]+$'
          [[ "$INPUT_GATE1_EVIDENCE" =~ $gate_shape ]] || { echo PHASE_1_GATE_1_EVIDENCE_NOT_ZERO >&2; exit 1; }
          [[ "$INPUT_GATE2_EVIDENCE" =~ $gate_shape ]] || { echo PHASE_1_GATE_2_EVIDENCE_NOT_ZERO >&2; exit 1; }
          [[ -n "${INPUT_BASE_INTEGRITY_CHECK_EVIDENCE//[[:space:]]/}" ]] || { echo PHASE_1_BASE_INTEGRITY_EVIDENCE_REQUIRED >&2; exit 1; }
          # What production can prove about itself, it must: the token-gated
          # read-only dormant-readiness surface reports partner_identities and
          # agent_referrals_legal_profile_revisions counts from the live runtime.
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary "$(jq -n --arg id "deploy-$BASE_SHA" --arg source "$BASE_SHA" '{release_id:$id,mode:"ROLLING",expected:{source_commit:$source}}')" \
            "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/dormant-readiness" > dormant-readiness.json || true
          jq -c '{business_facts_all_zero, business_facts_tables}' dormant-readiness.json >&2 || true

      - name: Materialize exact TARGET surface-contract readiness inputs
        run: |
          set -euo pipefail
          git show "$TARGET_SHA:release-surface-contract.json" > phase-1-release-surface-contract.json
          checkout_contract_version="$(jq -er '.checkout_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' phase-1-release-surface-contract.json)"
          admin_contract_version="$(jq -er '.admin_contract_version | select(type == "string" and test("^[a-z0-9][a-z0-9.-]{0,63}$"))' phase-1-release-surface-contract.json)"
          echo "CHECKOUT_CONTRACT_VERSION=$checkout_contract_version" >> "$GITHUB_ENV"
          echo "ADMIN_CONTRACT_VERSION=$admin_contract_version" >> "$GITHUB_ENV"

      - name: Classify durable deployment state and pin the target expectation
        run: |
          set -euo pipefail
          release_id="deploy-${TARGET_SHA}"
          # A SCHEMA crossing changes the applied set, so the inventory
          # expectation is computed from TARGET's tree, never from BASE's.
          inventory="$(git ls-tree -r --name-only "$TARGET_SHA" -- commerce/migrations | sed -n "s#^commerce/migrations/##p" | sort)"
          migration="inventory-sha256:$(printf %s "$inventory" | shasum -a 256 | awk "{print \$1}")"
          [[ "$(printf '%s\n' "$inventory" | tail -n 1)" == "$EXPECTED_MIGRATION" ]] || { echo PHASE_1_TARGET_SCHEMA_HEAD_UNEXPECTED >&2; exit 1; }
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status-before.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$release_id" > completion-before.json
          api "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activation-state" > ar-fence-before.json
          jq -n --arg id "$release_id" --arg source "$TARGET_SHA" --arg migration "$migration" --arg version "$BASE_LEGAL_VERSION" --arg manifest "$BASE_LEGAL_MANIFEST_SHA256" --argjson hashes "$BASE_LEGAL_HASHES_JSON" '{release_id:$id,mode:"CONTROLLED_CUTOVER",expected:{source_commit:$source,migration:$migration,legal_version:$version,legal_manifest_sha256:$manifest,legal_hashes:$hashes}}' > release.json
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

          assert_ar_fence() {
            jq -e --arg state "$AR_EXPECTED_STATE" --argjson revision "$AR_EXPECTED_REVISION" --arg owner "$AR_EXPECTED_OWNER" '
              .feature_state.state == $state and .feature_state.revision == $revision and .feature_state.owner_id == $owner
            ' "$1" >/dev/null || { echo PHASE_1_AGENT_REFERRALS_FENCE_MISMATCH >&2; exit 1; }
          }
          production_deploy="$(scripts/read-production-deploy-ref.sh)"
          [[ "$production_deploy" == "$BASE_SHA" || "$production_deploy" == "$TARGET_SHA" ]] || { echo PHASE_1_PRODUCTION_POINTER_UNEXPECTED >&2; exit 1; }
          if jq -e --slurpfile request release.json '.complete == true and .expected == $request[0].expected' completion-before.json >/dev/null; then
            [[ "$production_deploy" == "$TARGET_SHA" ]] || { echo PHASE_1_COMPLETED_POINTER_MISMATCH >&2; exit 1; }
            assert_ar_fence ar-fence-before.json
            echo DEPLOYMENT_STATE=ALREADY_COMPLETE >> "$GITHUB_ENV"; exit 0
          fi
          if [[ "$production_deploy" == "$BASE_SHA" ]] && jq -e '.owner_release_id == null and .owner_mode == null and .sales_paused == false' status-before.json >/dev/null; then
            jq -e --arg base "$BASE_SHA" '.runtime.source_commit == $base and .runtime.worker_source_commit == $base' status-before.json >/dev/null || { echo PHASE_1_BASE_RUNTIME_IDENTITY_MISMATCH >&2; exit 1; }
            assert_ar_fence ar-fence-before.json
            echo DEPLOYMENT_STATE=FRESH >> "$GITHUB_ENV"; exit 0
          fi
          if jq -e --arg id "$release_id" --slurpfile request release.json '.owner_release_id == $id and .owner_mode == "CONTROLLED_CUTOVER" and .expected == ($request[0].expected | del(.legal_hashes))' status-before.json >/dev/null; then
            assert_ar_fence ar-fence-before.json
            if jq -e '.sales_paused == false' status-before.json >/dev/null; then
              [[ "$production_deploy" == "$BASE_SHA" ]] || { echo PHASE_1_ACQUIRED_UNPAUSED_POINTER_MISMATCH >&2; exit 1; }
              echo DEPLOYMENT_STATE=OWNED_ACQUIRED_UNPAUSED >> "$GITHUB_ENV"; exit 0
            fi
            if [[ "$production_deploy" == "$BASE_SHA" ]]; then
              echo DEPLOYMENT_STATE=OWNED_PRE_CAS >> "$GITHUB_ENV"
            elif jq -e --arg target "$TARGET_SHA" '.runtime.source_commit == $target and .runtime.worker_source_commit == $target' status-before.json >/dev/null; then
              echo DEPLOYMENT_STATE=OWNED_CONVERGED >> "$GITHUB_ENV"
            else
              echo DEPLOYMENT_STATE=OWNED_NEEDS_DEPLOY >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          echo PHASE_1_OWNER_STATE_UNEXPECTED >&2; exit 1

      - name: Acquire owner
        if: env.DEPLOYMENT_STATE == 'FRESH'
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$BASE_SHA" ]] || { echo PHASE_1_AUTHORITY_MOVED >&2; exit 1; }
          git fetch --no-tags origin refs/heads/runtime-candidate:refs/remotes/origin/runtime-candidate
          [[ "$(git rev-parse origin/runtime-candidate)" == "$BASE_SHA" || "$(git rev-parse origin/runtime-candidate)" == "$TARGET_SHA" ]] || { echo PHASE_1_RUNTIME_CANDIDATE_UNEXPECTED >&2; exit 1; }
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/acquire" > /dev/null

      - name: Pause sales
        if: env.DEPLOYMENT_STATE == 'FRESH' || env.DEPLOYMENT_STATE == 'OWNED_ACQUIRED_UNPAUSED'
        run: |
          set -euo pipefail
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$BASE_SHA" ]] || { echo PHASE_1_AUTHORITY_MOVED >&2; exit 1; }
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/pause" > paused.json
          jq -e --arg id "$RELEASE_ID" '.owner_release_id == $id and .owner_mode == "CONTROLLED_CUTOVER" and .sales_paused == true' paused.json >/dev/null || { echo PHASE_1_PAUSE_NOT_HELD >&2; exit 1; }

      - name: Prove public checkout pause before deployment
        if: env.DEPLOYMENT_STATE != 'ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output checkout-paused.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H "Idempotency-Key: phase-1-pause-${GITHUB_RUN_ID}" --data '{}' "$PUBLIC_API_URL/v1/public/checkouts")"
          [[ "$code" == 503 ]] && jq -e '.error.code == "SALES_TEMPORARILY_PAUSED"' checkout-paused.json >/dev/null || { echo PHASE_1_CHECKOUT_NOT_PAUSED >&2; exit 1; }

      - name: Rebind same-owner authority and guard production pointer CAS
        if: env.DEPLOYMENT_STATE != 'ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > status-before-consequence.json
          jq -e --arg id "$RELEASE_ID" --slurpfile request release.json '.owner_release_id == $id and .owner_mode == "CONTROLLED_CUTOVER" and .sales_paused == true and .expected == ($request[0].expected | del(.legal_hashes))' status-before-consequence.json >/dev/null || { echo PHASE_1_HELD_OWNER_CHANGED >&2; exit 1; }
          [[ "$(git rev-parse "${TARGET_SHA}^{tree}")" == "$TARGET_TREE" ]] || { echo PHASE_1_TARGET_REBIND_FAILED >&2; exit 1; }
          pointer="$(scripts/read-production-deploy-ref.sh)"
          [[ "$pointer" == "$BASE_SHA" || "$pointer" == "$TARGET_SHA" ]] || { echo PHASE_1_PRODUCTION_POINTER_MOVED >&2; exit 1; }
          if [[ "$pointer" == "$BASE_SHA" ]]; then scripts/set-production-deploy-ref.sh "$TARGET_SHA" "$BASE_SHA"; fi

      - name: Materialize the exact TARGET readiness parser worktree
        if: env.DEPLOYMENT_STATE != 'ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          RUNTIME_ASSERT_DIR="$RUNNER_TEMP/phase-1-runtime"
          git worktree add --detach "$RUNTIME_ASSERT_DIR" "$TARGET_SHA"
          [[ "$(git -C "$RUNTIME_ASSERT_DIR" rev-parse HEAD)" == "$TARGET_SHA" ]] || { echo PHASE_1_RUNTIME_WORKTREE_MISMATCH >&2; exit 1; }
          (cd "$RUNTIME_ASSERT_DIR" && pnpm install --frozen-lockfile --ignore-scripts)
          echo "RUNTIME_ASSERT_DIR=$RUNTIME_ASSERT_DIR" >> "$GITHUB_ENV"

      - name: Deploy exact TARGET and prove readiness
        if: env.DEPLOYMENT_STATE != 'ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_STATE" != "OWNED_CONVERGED" ]]; then scripts/controlled-coolify-deploy.sh "$TARGET_SHA"; fi
          readiness_status=0
          scripts/controlled-production-readiness.sh release.json || readiness_status=$?
          if [[ "$readiness_status" == "0" ]]; then exit 0; fi
          # Exactly one code may re-fire the TARGET webhook sequence: 75
          # (EX_TEMPFAIL), which the readiness primitive returns only when an
          # observable surface never converged. Everything else is terminal -
          # an admission refusal (3) is deterministic evidence about a
          # converged runtime, a configuration error (2) is ours, and 1 is the
          # code `set -e` produces for any unexpected failure, which must
          # never authorise another production deployment.
          if [[ "$readiness_status" != "$READINESS_EXIT_CONVERGENCE" ]]; then echo "PHASE_1_READINESS_TERMINAL: exit $readiness_status" >&2; exit "$readiness_status"; fi
          scripts/controlled-coolify-deploy.sh "$TARGET_SHA"
          readiness_retry_status=0
          scripts/controlled-production-readiness.sh release.json || readiness_retry_status=$?
          if [[ "$readiness_retry_status" != "0" ]]; then
            # One bounded retry, and no more. In particular a candidate that
            # cannot boot because 0058's gates refused it looks exactly like a
            # surface that never converged, and must not be treated as anything
            # else: there is no schema-failure branch, no waiver, and no
            # automatic redeploy of BASE from here. Recovering to BASE, if
            # operationally required, is a separate controlled act - see
            # docs/release/AGENT_REFERRALS_PHASE_1_RUNBOOK.md.
            echo "PHASE_1_CANDIDATE_NOT_CONVERGED_AFTER_ONE_RETRY: exit $readiness_retry_status" >&2
            exit "$readiness_retry_status"
          fi

      - name: Reopen and prove terminal completion
        if: env.DEPLOYMENT_STATE != 'ALREADY_COMPLETE'
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api -X POST --data-binary @release.json "$PUBLIC_API_URL/v1/internal/release-control/reopen" > reopened.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > completion.json
          jq -e '.complete == true' completion.json >/dev/null || { echo PHASE_1_COMPLETION_NOT_TERMINAL >&2; exit 1; }
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$TARGET_SHA" ]] || { echo PHASE_1_PRODUCTION_POINTER_POSTCONDITION_FAILED >&2; exit 1; }

      - name: Prove terminal runtime, applied schema and the unchanged Agent Referrals fence
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/release/release-api.sh"
          api "$PUBLIC_API_URL/v1/internal/release-control/status" > terminal-status.json
          api "$PUBLIC_API_URL/v1/internal/release-control/completion/$RELEASE_ID" > terminal-completion.json
          api "$PUBLIC_API_URL/v1/internal/release-control/agent-referrals/activation-state" > terminal-ar-fence.json
          jq -e --arg target "$TARGET_SHA" '.owner_release_id == null and .owner_mode == null and .sales_paused == false and .runtime.source_commit == $target and .runtime.worker_source_commit == $target' terminal-status.json >/dev/null || { echo PHASE_1_TERMINAL_RUNTIME_MISMATCH >&2; exit 1; }
          jq -e --arg migration "$EXPECTED_MIGRATION" '.runtime.migration_versions | index($migration) != null' terminal-status.json >/dev/null || { echo PHASE_1_MIGRATION_NOT_APPLIED >&2; exit 1; }
          jq -e --slurpfile request release.json '.complete == true and .expected == $request[0].expected' terminal-completion.json >/dev/null || { echo PHASE_1_TERMINAL_COMPLETION_MISMATCH >&2; exit 1; }
          jq -e --arg state "$AR_EXPECTED_STATE" --argjson revision "$AR_EXPECTED_REVISION" --arg owner "$AR_EXPECTED_OWNER" '.feature_state.state == $state and .feature_state.revision == $revision and .feature_state.owner_id == $owner' terminal-ar-fence.json >/dev/null || { echo PHASE_1_AGENT_REFERRALS_FENCE_CHANGED >&2; exit 1; }
