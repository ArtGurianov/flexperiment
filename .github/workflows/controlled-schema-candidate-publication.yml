name: Controlled ordinary schema candidate publication

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed schema runtime commit to publish.
        required: true
        type: string
      expected_controller_sha:
        description: Exact current protected-main controller SHA.
        required: true
        type: string
      expected_controller_tree:
        description: Exact tree of the reviewed controller SHA.
        required: true
        type: string
      expected_production_deploy_sha:
        description: Exact production-deploy base for append-only schema admission.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha }}
      INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      INPUT_EXPECTED_CONTROLLER_TREE: ${{ inputs.expected_controller_tree }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha }}
      SCHEMA_CANDIDATE_REF_TOKEN: ${{ secrets.SCHEMA_CANDIDATE_REF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 10.29.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Bind exact controller, target and schema admission
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo SCHEMA_PUBLICATION_CONTROLLER_NOT_MAIN >&2; exit 1; }
          [[ "$INPUT_TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_EXPECTED_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_EXPECTED_CONTROLLER_TREE" =~ ^[0-9a-f]{40}$ && "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo SCHEMA_PUBLICATION_INPUT_INVALID >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/production-deploy:refs/remotes/origin/production-deploy "$INPUT_TARGET_SHA"
          [[ "$CONTROLLER_SHA" == "$INPUT_EXPECTED_CONTROLLER_SHA" && "$CONTROLLER_SHA" == "$(git rev-parse origin/main)" ]] || { echo SCHEMA_PUBLICATION_CONTROLLER_MOVED >&2; exit 1; }
          [[ "$(git rev-parse "${CONTROLLER_SHA}^{tree}")" == "$INPUT_EXPECTED_CONTROLLER_TREE" ]] || { echo SCHEMA_PUBLICATION_CONTROLLER_TREE_MISMATCH >&2; exit 1; }
          [[ "$(git rev-parse origin/production-deploy)" == "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" ]] || { echo SCHEMA_PUBLICATION_PRODUCTION_DEPLOY_MOVED >&2; exit 1; }
          git merge-base --is-ancestor "$INPUT_TARGET_SHA" "$CONTROLLER_SHA" || { echo SCHEMA_PUBLICATION_TARGET_NOT_COVERED_BY_CONTROLLER >&2; exit 1; }
          git merge-base --is-ancestor "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" "$INPUT_TARGET_SHA" || { echo SCHEMA_PUBLICATION_TARGET_NOT_DESCENDANT_OF_PRODUCTION >&2; exit 1; }
          node --import tsx commerce/src/ordinary-schema-release.ts "$INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA" "$INPUT_TARGET_SHA" > admission.json
          jq -e '.targetMigrationExpectation | test("^inventory-sha256:[a-f0-9]{64}$")' admission.json >/dev/null
          echo "PUBLISH_REF=refs/heads/runtime/schema-$INPUT_TARGET_SHA" >> "$GITHUB_ENV"
      - name: Publish immutable schema provenance ref
        run: |
          set -euo pipefail
          [[ -n "$SCHEMA_CANDIDATE_REF_TOKEN" ]] || { echo SCHEMA_CANDIDATE_REF_TOKEN_REQUIRED >&2; exit 1; }
          existing="$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$INPUT_TARGET_SHA" ]] || { echo "SCHEMA_PUBLICATION_REF_CONFLICT=$existing" >&2; exit 1; }
          else
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${SCHEMA_CANDIDATE_REF_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force-with-lease="${PUBLISH_REF}:" origin "${INPUT_TARGET_SHA}:${PUBLISH_REF}"
          fi
          [[ "$(git ls-remote --exit-code origin "$PUBLISH_REF" | awk '{print $1}')" == "$INPUT_TARGET_SHA" ]] || { echo SCHEMA_PUBLICATION_READBACK_MISMATCH >&2; exit 1; }
          {
            echo "## Ordinary schema candidate publication"
            echo "- Published ref: $PUBLISH_REF"
            echo "- runtime-candidate: unchanged"
            echo "- production-deploy: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
