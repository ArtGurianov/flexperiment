name: Controlled generic runtime publication

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact reviewed ordinary runtime commit to publish.
        required: true
        type: string
      expected_controller_sha:
        description: Exact current protected-main controller SHA.
        required: true
        type: string
      expected_controller_tree:
        description: Exact tree of the reviewed controller SHA.
        required: true
        type: string
      expected_production_deploy_sha:
        description: Exact production-deploy base for ordinary runtime admission.
        required: true
        type: string
      expected_test_run_id:
        description: Successful push-triggered Test workflow run for target_sha.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CONTROLLER_SHA: ${{ github.sha }}
      INPUT_TARGET_SHA: ${{ inputs.target_sha }}
      INPUT_EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      INPUT_EXPECTED_CONTROLLER_TREE: ${{ inputs.expected_controller_tree }}
      INPUT_EXPECTED_PRODUCTION_DEPLOY_SHA: ${{ inputs.expected_production_deploy_sha }}
      INPUT_EXPECTED_TEST_RUN_ID: ${{ inputs.expected_test_run_id }}
      GENERIC_RUNTIME_PUBLICATION_REF_TOKEN: ${{ secrets.GENERIC_RUNTIME_PUBLICATION_REF_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/controlled-generic-runtime-publication
