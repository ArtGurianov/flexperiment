name: Controlled 0041 Gen2 deploy-only recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-GEN2-AFTER-OFFLINE-BRIDGE.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: flexperiment-production-controlled-cutover
  cancel-in-progress: false

jobs:
  deploy_gen2_only:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      # This is a deployment controller, not the runtime source.
      CONTROLLER_SHA: ${{ github.sha }}
      GEN1_RUNTIME_SHA: 68f80a411b7f286928ef10826ed225228098d246
      GEN2_RUNTIME_SHA: 0ddc33d0fd0077fe0ba238ec75ae4090fc38ac34
      RELEASE_ID: outbox-attempt-authority-v1:68f80a411b7f286928ef10826ed225228098d246
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_COMMERCE_DEPLOY_WEBHOOK_URL }}
      COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_DEPLOY_WEBHOOK_URL }}
      COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_ADMIN_DEPLOY_WEBHOOK_URL }}
      COMMERCE_RELEASE_CONTROL_TOKEN: ${{ secrets.COMMERCE_RELEASE_CONTROL_TOKEN }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
      ADMIN_RELEASE_URL: ${{ vars.ADMIN_RELEASE_URL }}
      # The stopped SQLite volume is the bridge's execution substrate. This is
      # location metadata, not a caller-selectable deployment target.
      OFFLINE_BRIDGE_SSH_HOST: root@185.175.159.228
      OFFLINE_BRIDGE_SSH_PRIVATE_KEY: ${{ secrets.GEN1_OFFLINE_BRIDGE_SSH_PRIVATE_KEY }}
      OFFLINE_BRIDGE_SSH_KNOWN_HOSTS: ${{ secrets.GEN1_OFFLINE_BRIDGE_SSH_KNOWN_HOSTS }}
      # Set once, after the reviewed maintenance PR receives its final SHA.
      # It is execution-artifact identity, never a deployment-source input.
      OFFLINE_BRIDGE_MAINTENANCE_ARTIFACT_SHA: ${{ vars.GEN1_OFFLINE_BRIDGE_MAINTENANCE_ARTIFACT_SHA }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the only permitted recovery runtime
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "GEN2_DEPLOY_CONTROLLER_NOT_MAIN" >&2; exit 1; }
          [[ "$INPUT_CONFIRM" == "DEPLOY-GEN2-AFTER-OFFLINE-BRIDGE" ]] || { echo "GEN2_DEPLOY_CONFIRMATION_REQUIRED" >&2; exit 1; }
          git fetch --no-tags origin "$GEN1_RUNTIME_SHA" "$GEN2_RUNTIME_SHA"
          # The main controller that drives deployment must include the exact
          # runtime it is authorizing. The offline bridge merge deliberately
          # makes GEN2 a parent of this controller without making the
          # maintenance bridge itself deployable.
          git merge-base --is-ancestor "$GEN2_RUNTIME_SHA" "$CONTROLLER_SHA" || { echo "GEN2_DEPLOY_CONTROLLER_OLDER_THAN_TARGET" >&2; exit 1; }
          [[ "$(git rev-parse "$GEN2_RUNTIME_SHA^")" == "$GEN1_RUNTIME_SHA" ]] || { echo "GEN2_DEPLOY_RUNTIME_TOPOLOGY_INVALID" >&2; exit 1; }
          git cat-file -e "$GEN2_RUNTIME_SHA^{commit}"
          ! git cat-file -e "$GEN2_RUNTIME_SHA:.release/maintenance-only" 2>/dev/null || { echo "GEN2_DEPLOY_TARGET_IS_MAINTENANCE_ONLY" >&2; exit 1; }
          # No target/replacement input exists. In particular this controller
          # contains no permitted path that could restart GEN1 after bridge.
          [[ "$GEN2_RUNTIME_SHA" != "$GEN1_RUNTIME_SHA" ]] || { echo "GEN2_DEPLOY_OLD_RUNTIME_FORBIDDEN" >&2; exit 1; }

      - name: Configure the pinned offline bridge substrate
        run: |
          set -euo pipefail
          [[ -n "$OFFLINE_BRIDGE_SSH_PRIVATE_KEY" && -n "$OFFLINE_BRIDGE_SSH_KNOWN_HOSTS" ]] || { echo "GEN2_DEPLOY_OFFLINE_SUBSTRATE_CREDENTIALS_MISSING" >&2; exit 1; }
          [[ "$OFFLINE_BRIDGE_MAINTENANCE_ARTIFACT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "GEN2_DEPLOY_MAINTENANCE_ARTIFACT_SHA_INVALID" >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$OFFLINE_BRIDGE_SSH_PRIVATE_KEY" > "$HOME/.ssh/0041-offline-bridge"
          chmod 0600 "$HOME/.ssh/0041-offline-bridge"
          printf '%s\n' "$OFFLINE_BRIDGE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Prove the durable offline bridge receipt with Gen1 still stopped
        run: |
          set -euo pipefail
          # This deliberately executes against stopped SQLite's Docker volume,
          # not the Gen1 runtime API. The receipt reader proves both Commerce
          # and worker are stopped and have restart policy disabled.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/0041-offline-bridge" "$OFFLINE_BRIDGE_SSH_HOST" "COMMERCE_GEN1_TO_GEN2_BRIDGE_MAINTENANCE_ARTIFACT_SHA=$OFFLINE_BRIDGE_MAINTENANCE_ARTIFACT_SHA bash -s" < scripts/read-0041-offline-bridge-receipt.sh

      - name: CAS production-deploy to Gen2 before any webhook
        run: |
          set -euo pipefail
          current_pointer="$(scripts/read-production-deploy-ref.sh)"
          case "$current_pointer" in
            "$GEN1_RUNTIME_SHA")
              [[ "$(scripts/read-production-deploy-ref.sh)" == "$GEN1_RUNTIME_SHA" ]] || { echo "GEN2_DEPLOY_POINTER_MOVED_BEFORE_CAS" >&2; exit 1; }
              scripts/set-production-deploy-ref.sh "$GEN2_RUNTIME_SHA"
              ;;
            "$GEN2_RUNTIME_SHA")
              echo "GEN2_DEPLOY_POINTER_REPLAY=1"
              ;;
            *) echo "GEN2_DEPLOY_POINTER_UNEXPECTED_SHA" >&2; exit 1 ;;
          esac
          [[ "$(scripts/read-production-deploy-ref.sh)" == "$GEN2_RUNTIME_SHA" ]] || { echo "GEN2_DEPLOY_POINTER_POSTCONDITION_FAILED" >&2; exit 1; }

      - name: Deploy only the hard-bound Gen2 runtime after the pointer CAS
        run: scripts/controlled-coolify-deploy.sh "$GEN2_RUNTIME_SHA"

      - name: Prove Gen2 surfaces and the still-paused ATTEMPT fence
        run: |
          set -euo pipefail
          source scripts/release/release-api.sh
          for attempt in $(seq 1 30); do
            if api "$PUBLIC_API_URL/v1/internal/release-control/status" > status.json \
              && api "$PUBLIC_API_URL/v1/internal/release-control/candidates/head/$RELEASE_ID" > candidate-head.json \
              && curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_FRONTEND_URL/release.json" > frontend.json \
              && curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$ADMIN_RELEASE_URL" > admin.json \
              && curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/healthz" > health.json \
              && curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 "$PUBLIC_API_URL/readyz" > ready.json \
              && jq -e --arg release "$RELEASE_ID" --arg source "$GEN2_RUNTIME_SHA" '
                .schema_version == 2 and .head.release_id == $release and .head.candidate_generation == 2 and
                .head.source_commit == $source and .head.phase == "PAUSED" and .head.phase_sequence == 0 and
                (.head | has("certification") | not)
              ' candidate-head.json >/dev/null \
              && jq -e --arg release "$RELEASE_ID" --arg source "$GEN2_RUNTIME_SHA" '
                .sales_paused == true and .owner_release_id == $release and .emergency_sales_paused == false and
                .runtime.source_commit == $source and .runtime.worker_source_commit == $source and
                .outbox_authority.attempt_authority == "ATTEMPT" and
                .outbox_authority.email_dispatch_paused == true and
                .outbox_authority.dispatch_owner_release_id == $release and
                .outbox_authority.dispatch_owner_generation == null and
                .outbox_authority.revision == 7 and .outbox_authority.dispatch.drained == true and
                .outbox_authority.last_event.action == "DISPATCH_FENCED" and
                .outbox_authority.last_event.owner_release_id == $release and
                .outbox_authority.last_event.revision == 7
              ' status.json >/dev/null \
              && jq -e --arg source "$GEN2_RUNTIME_SHA" '.source_commit == $source' frontend.json >/dev/null \
              && jq -e --arg source "$GEN2_RUNTIME_SHA" '.source_commit == $source' admin.json >/dev/null \
              && jq -e '.ok == true' health.json >/dev/null \
              && jq -e '.ok == true' ready.json >/dev/null; then exit 0; fi
            [[ "$attempt" == 30 ]] && { echo "GEN2_DEPLOY_RUNTIME_NOT_OBSERVED" >&2; exit 1; }
            sleep 10
          done
